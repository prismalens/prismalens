# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: en-US
reviews:
  profile: chill
  auto_review:
    # CLI-FIRST LANE. Online review is opt-in, not automatic.
    #
    # This repo is on CodeRabbit's OSS tier: 1-10 PR reviews per developer per
    # hour, scaling with project popularity — a young repo sits near the bottom.
    # The limit is per DEVELOPER, not per repo, so this repo, `mage-memory` and
    # `sreforge` all draw one counter. Measured over 180 merged PRs: 7.5/day,
    # worst hour 8 opens, and at 1 review/hr 61% of PRs arrived with the counter
    # already empty. Reviewing everything automatically means the reviews land
    # where they happen to fall, not where they are worth spending.
    #
    # So: the CodeRabbit CLI (a separate, much larger counter) reviews every push
    # via the kit's pre-push gate, and this scarce online counter is no longer
    # spent automatically — only on PRs explicitly labelled `review-ready`.
    #
    # SCOPE, precisely: `labels` gates AUTOMATIC review only. Manual triggers —
    # `@coderabbitai review` and `@coderabbitai full review` — run regardless of
    # these settings and still spend the online counter, labelled or not. That is
    # deliberate and wanted: it is the escape hatch for re-requesting a review
    # after `auto_pause_after_reviewed_commits` stops incremental ones. But it
    # means this is a DEFAULT, not a hard cap. The cap is discipline, plus the
    # fact that a manual trigger is an explicit act rather than a side effect of
    # opening a PR — which is exactly the 61%-empty-counter problem above.
    #
    # This is NOT a reduction in review. `review-evidence` is a required check
    # (ruleset 18441175): a PR with neither a CodeRabbit review nor a CLI review
    # marker at its head SHA cannot merge. Removing automatic review without that
    # gate in place would have made "unreviewed" the silent default — which is
    # why the gate shipped first, in #322.
    #
    # No dry run exists for this setting: CodeRabbit applies base-branch config
    # only for open-source repos, so it takes effect the moment it lands on main.
    # The revert is one commit — see ~/ai-context/state/prismalens-valve-revert.md.
    enabled: false
    labels:
      - "review-ready"
    # Still load-bearing under the flip: once a PR IS admitted, this stops a
    # fix-push loop from spending the counter again on every push. Push fixes as
    # a batch, then re-request explicitly with `@coderabbitai review`.
    auto_pause_after_reviewed_commits: 1
    ignore_title_keywords:
      - "WIP"
      - "Version Packages" # changesets release PR — generated churn, reviewed for zero value
  # Not a rate-limit lever (the limit counts reviews, not files) — this keeps PRs under
  # the OSS files-per-review cap of 50-150 and off generated noise.
  path_filters:
    - "!.changeset/**"
    - "!pnpm-lock.yaml"
  path_instructions:
    - path: "packages/*/src/**"
      instructions: >-
        If this PR changes a CLI verb, flag, env var, config key, task name, file layout, prompt surface, canonical event, or operator workflow, it must also update the RELEVANT documentation surface that describes that behavior — an unrelated docs/ or README change does not satisfy this. If the relevant surface is not updated, flag it as a documentation gap and name the specific stale surface. Reference surfaces: `packages/cli/README.md`, `packages/api/README.md`, `packages/@prismalens/contracts/README.md`, `docs/`.

        When a PR adds or substantially rewrites documentation that explains a resolution order, a mode/topology, a state machine, a pipeline, a precedence rule, or a side-by-side comparison — anything with three or more interacting parts — flag it as a documentation gap if the passage is prose-only. Such a passage must carry a worked example (real or realistically simulated input mapped to its output), a terminal transcript, a diagram (inline SVG or fenced diagram source — never a new build dependency added just to render one), or, only when the subject is genuinely graphical, a screenshot that names what invalidates it. Name the specific passage and which form fits; "add a diagram" is not an actionable finding. Do not flag prose that is below this threshold — a visual restating a two-step sequence is noise.
    - path: "packages/@prismalens/*/src/**"
      instructions: >-
        If this PR changes a CLI verb, flag, env var, config key, task name, file layout, prompt surface, canonical event, or operator workflow, it must also update the RELEVANT documentation surface that describes that behavior — an unrelated docs/ or README change does not satisfy this. If the relevant surface is not updated, flag it as a documentation gap and name the specific stale surface. Reference surfaces: `packages/cli/README.md`, `packages/api/README.md`, `packages/@prismalens/contracts/README.md`, `docs/`.

        When a PR adds or substantially rewrites documentation that explains a resolution order, a mode/topology, a state machine, a pipeline, a precedence rule, or a side-by-side comparison — anything with three or more interacting parts — flag it as a documentation gap if the passage is prose-only. Such a passage must carry a worked example (real or realistically simulated input mapped to its output), a terminal transcript, a diagram (inline SVG or fenced diagram source — never a new build dependency added just to render one), or, only when the subject is genuinely graphical, a screenshot that names what invalidates it. Name the specific passage and which form fits; "add a diagram" is not an actionable finding. Do not flag prose that is below this threshold — a visual restating a two-step sequence is noise.
    - path: "packages/cli/src/**"
      instructions: >-
        This is the published `prismalens` CLI package, so its public surface is user-facing.
    - path: "packages/@prismalens/engine/src/**"
      instructions: >-
        This is the published `@prismalens/engine` package. Repo invariants: the engine is agent/harness-agnostic (no harness-specific logic outside the harness registry); the engine takes a host-assembled InvestigationContext (it never fetches its own inputs); ordered-evidence epistemics — no numeric confidence scores anywhere in contracts or UI copy; the engine is a library — no protocol/transport/concurrency assumptions in engine core.
    - path: "packages/@prismalens/contracts/src/**"
      instructions: >-
        This is the published `@prismalens/contracts` package. Repo invariant: ordered-evidence epistemics — no numeric confidence scores anywhere in contracts.
    - path: "packages/frontend/src/**"
      instructions: >-
        Repo invariant: ordered-evidence epistemics — no numeric confidence scores anywhere in UI copy.
