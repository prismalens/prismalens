# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: en-US
reviews:
  profile: chill
  # Rate-limit discipline. This repo is on CodeRabbit's OSS tier: 1-10 PR reviews per
  # developer per hour, scaling with project popularity — a young repo sits near the
  # bottom. EVERY review run spends one, including the automatic incremental review
  # after each push, so a fix-push loop drains the whole budget on a single PR.
  # Pausing after 1 reviewed commit means one review per PR; push your fixes as a batch,
  # then re-request explicitly with an `@coderabbitai review` comment.
  auto_review:
    auto_pause_after_reviewed_commits: 1
    ignore_title_keywords:
      - "WIP"
      - "Version Packages" # changesets release PR — generated churn, reviewed for zero value
  # Not a rate-limit lever (the limit counts reviews, not files) — this keeps PRs under
  # the OSS files-per-review cap of 50-150 and off generated noise.
  path_filters:
    - "!.changeset/**"
    - "!pnpm-lock.yaml"
  path_instructions:
    - path: "packages/cli/src/**"
      instructions: >-
        This is the published `prismalens` CLI package. If this PR changes a CLI verb, flag, env var, config key, task name, file layout, prompt surface, canonical event, or operator workflow, it must also update the RELEVANT documentation surface that describes that behavior — an unrelated docs/ or README change does not satisfy this. If the relevant surface is not updated, flag it as a documentation gap and name the specific stale surface. Reference surfaces: `packages/cli/README.md`, `packages/api/README.md`, `packages/@prismalens/contracts/README.md`, `docs/`.
    - path: "packages/@prismalens/engine/src/**"
      instructions: >-
        This is the published `@prismalens/engine` package. If this PR changes a CLI verb, flag, env var, config key, task name, file layout, prompt surface, canonical event, or operator workflow, it must also update the RELEVANT documentation surface that describes that behavior — an unrelated docs/ or README change does not satisfy this. If the relevant surface is not updated, flag it as a documentation gap and name the specific stale surface. Reference surfaces: `packages/cli/README.md`, `packages/api/README.md`, `packages/@prismalens/contracts/README.md`, `docs/`. Repo invariants: the engine is agent/harness-agnostic (no harness-specific logic outside the harness registry); the engine takes a host-assembled InvestigationContext (it never fetches its own inputs); ordered-evidence epistemics — no numeric confidence scores anywhere in contracts or UI copy; the engine is a library — no protocol/transport/concurrency assumptions in engine core.
    - path: "packages/@prismalens/contracts/src/**"
      instructions: >-
        This is the published `@prismalens/contracts` package. If this PR changes a CLI verb, flag, env var, config key, task name, file layout, prompt surface, canonical event, or operator workflow, it must also update the RELEVANT documentation surface that describes that behavior — an unrelated docs/ or README change does not satisfy this. If the relevant surface is not updated, flag it as a documentation gap and name the specific stale surface. Reference surfaces: `packages/cli/README.md`, `packages/api/README.md`, `packages/@prismalens/contracts/README.md`, `docs/`. Repo invariant: ordered-evidence epistemics — no numeric confidence scores anywhere in contracts.
    - path: "packages/api/src/**"
      instructions: >-
        This is the published `prismalens` API package. If this PR changes a CLI verb, flag, env var, config key, task name, file layout, prompt surface, canonical event, or operator workflow, it must also update the RELEVANT documentation surface that describes that behavior — an unrelated docs/ or README change does not satisfy this. If the relevant surface is not updated, flag it as a documentation gap and name the specific stale surface. Reference surfaces: `packages/cli/README.md`, `packages/api/README.md`, `packages/@prismalens/contracts/README.md`, `docs/`.
    - path: "packages/frontend/src/**"
      instructions: >-
        This is the `prismalens` frontend package. If this PR changes a CLI verb, flag, env var, config key, task name, file layout, prompt surface, canonical event, or operator workflow, it must also update the RELEVANT documentation surface that describes that behavior — an unrelated docs/ or README change does not satisfy this. If the relevant surface is not updated, flag it as a documentation gap and name the specific stale surface. Reference surfaces: `packages/cli/README.md`, `packages/api/README.md`, `packages/@prismalens/contracts/README.md`, `docs/`. Repo invariant: ordered-evidence epistemics — no numeric confidence scores anywhere in UI copy.
    - path: "packages/worker/src/**"
      instructions: >-
        This is the `prismalens` worker package. If this PR changes a CLI verb, flag, env var, config key, task name, file layout, prompt surface, canonical event, or operator workflow, it must also update the RELEVANT documentation surface that describes that behavior — an unrelated docs/ or README change does not satisfy this. If the relevant surface is not updated, flag it as a documentation gap and name the specific stale surface. Reference surfaces: `packages/cli/README.md`, `packages/api/README.md`, `packages/@prismalens/contracts/README.md`, `docs/`.
