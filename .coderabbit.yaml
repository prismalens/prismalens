# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: en-US
reviews:
  profile: chill
  auto_review:
    # Admission (Sumit1993/rig#150): automatic review is off. The hourly `CodeRabbit summoner`
    # routine (Sumit1993/rig scripts/coderabbit-routine) summons one PR per hour across every
    # repo, because the allowance is one review per developer per hour. Marking a PR ready
    # starts nothing. Sessions never summon by hand: fix, push once, reply in each thread,
    # and the routine re-reviews. `coderabbit_review` below is the operator's override for a
    # review now; `labels` gates automatic review only.
    #
    # The Claude lane is separate and opt-in here (`admission: label` in
    # .github/claude-review.yml): it reviews only PRs labelled `claude_review`.
    # Merge is enforced by `CI gate`, the conventional-title check, and
    # `required_review_thread_resolution`.
    #
    # No dry run exists for this setting: CodeRabbit applies base-branch config
    # only for open-source repos, so it takes effect the moment it lands on main.
    # The revert is one commit — see ~/ai-context/state/prismalens-valve-revert.md.
    enabled: false
    labels:
      - "coderabbit_review"
    # Still load-bearing under the flip: once a PR IS admitted, this stops a
    # fix-push loop from spending the counter again on every push. Push fixes as
    # a batch, then re-request explicitly with `@coderabbitai review`.
    auto_pause_after_reviewed_commits: 1
    ignore_title_keywords:
      - "WIP"
      - "Version Packages" # changesets release PR — generated churn, reviewed for zero value
  # `request_changes_workflow` is deliberately ABSENT (default: false). It was set
  # true in #411 so a clean diff would still yield a formal review object for
  # `review-evidence.sh` to consume; that consumer was deleted in #415. Left on, it
  # is a redundant second blocker: a REQUEST_CHANGES verdict blocks merge on top of
  # the unresolved threads that already do, and clearing it needs a dismissal or a
  # re-review rather than resolving the finding it names.
  #
  # Not a rate-limit lever (the limit counts reviews, not files) — this keeps PRs under
  # the OSS files-per-review cap of 50-150 and off generated noise.
  path_filters:
    - "!.changeset/**"
    - "!pnpm-lock.yaml"
    # Playwright specs and their committed screenshots: the suite is the review.
    - "!packages/frontend/e2e/**"
  path_instructions:
    - path: "packages/*/src/**"
      instructions: >-
        docs.prismalens.io documents a short contract, not every feature; the list is `docs/POLICY.md` in prismalens/prismalens.io. Flag a documentation gap only when this PR changes an item on that list (install or upgrade commands, the basic use of `pl up`, `pl doctor` or `pl upgrade`, the alert webhook contract, the report's structure, or what leaves the machine, what the agent can reach and where data lives), and name the page. Do not flag new or changed settings, screens, flags, environment variables, events or internal behaviour as documentation gaps: `--help`, the UI and the release notes describe them. One exception: `packages/cli/README.md` lists every top-level `pl` command, so a new or removed command updates it.
    - path: "packages/@prismalens/*/src/**"
      instructions: >-
        docs.prismalens.io documents a short contract, not every feature; the list is `docs/POLICY.md` in prismalens/prismalens.io. Flag a documentation gap only when this PR changes an item on that list (install or upgrade commands, the basic use of `pl up`, `pl doctor` or `pl upgrade`, the alert webhook contract, the report's structure, or what leaves the machine, what the agent can reach and where data lives), and name the page. Do not flag new or changed settings, screens, flags, environment variables, events or internal behaviour as documentation gaps: `--help`, the UI and the release notes describe them. One exception: `packages/cli/README.md` lists every top-level `pl` command, so a new or removed command updates it.
    - path: "packages/cli/src/**"
      instructions: >-
        This is the published `prismalens` CLI package, so its public surface is user-facing.
    - path: "packages/@prismalens/engine/src/**"
      instructions: >-
        This is the published `@prismalens/engine` package. Repo invariants: the engine is agent/harness-agnostic (no harness-specific logic outside the harness registry); the engine takes a host-assembled InvestigationContext (it never fetches its own inputs); ordered-evidence epistemics — no numeric confidence scores anywhere in contracts or UI copy; the engine is a library — no protocol/transport/concurrency assumptions in engine core.
    - path: "packages/@prismalens/contracts/src/**"
      instructions: >-
        This is the published `@prismalens/contracts` package. Repo invariant: ordered-evidence epistemics — no numeric confidence scores anywhere in contracts.
    - path: "packages/frontend/src/**"
      instructions: >-
        Repo invariant: ordered-evidence epistemics — no numeric confidence scores anywhere in UI copy.
# `chat` governs comment-chat commands (@coderabbitai ...), which is a separate
# surface from the `reviews` block above. It defaults to allow_non_org_members:
# true, so on a public repo any GitHub user who can comment could otherwise
# issue commands — see https://docs.coderabbit.ai/guides/commands and
# https://docs.coderabbit.ai/reference/review-commands.
#
# The command that matters here is `@coderabbitai resolve`: it resolves review
# threads, and required_review_thread_resolution: true (ruleset 18441175) is now
# the ONLY mechanism that blocks a merge on findings — #415 deleted the
# review-evidence gate and everything that fed it. So an outside commenter
# clearing threads on someone else's PR removes the last remaining blocker.
# That is the whole reason for this change.
#
# `@coderabbitai approve` is not a live concern any more: it only submits an
# approving review when reviews.request_changes_workflow is enabled, and #415
# removed that setting (deliberately absent above, default false). With it off,
# the command does nothing.
#
# Restricting to org members is a mitigation, not a fix: a PR author who is an
# org member can still issue `resolve` on their own PR. Ruleset 18441175 stands
# regardless.
#
# Real cost, stated honestly: this also takes @coderabbitai review away from
# outside contributors as a self-service re-request after
# auto_pause_after_reviewed_commits stops incremental review on their PR.
# Acceptable because admission is already a manual maintainer action (auto_review
# is off; coderabbit_review is applied by hand) — a maintainer can issue the
# re-request too — and because no merge depends on a CodeRabbit review any more,
# so the worst case is friction, not a deadlock.
chat:
  allow_non_org_members: false
