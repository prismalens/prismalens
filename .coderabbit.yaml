# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: en-US
reviews:
  profile: chill
  auto_review:
    # ONLINE REVIEW IS ADMITTED, NOT AUTOMATIC.
    #
    # Every PR is reviewed by Claude Code in GitHub Actions
    # (.github/workflows/claude-code-review.yml), which is subscription-billed
    # and not scarce. This counter is scarce: it is per DEVELOPER, not per repo,
    # so this repo, `sreforge` and `mage-memory` all draw one pool, and a
    # successful review costs roughly a 40-minute cooldown across all three.
    # Measured over 180 merged PRs: 7.5/day, worst hour 8 opens, and at 1
    # review/hr 61% of PRs arrived with the counter already empty. Reviewing
    # everything automatically spends it where PRs happen to fall rather than
    # where a second opinion is worth having.
    #
    # So it is spent in exactly two cases, and `labels` below is what implements
    # the first:
    #
    #   1. Someone decides a PR is worth an independent second opinion — a
    #      sensitive surface (the CI/workflow surface itself, credential and crypto
    #      handling, the engine core, contract or schema changes), or a Claude
    #      review whose findings deserve a check from a reviewer sharing no model,
    #      prompt or failure mode. Apply the `review-ready` label BY HAND.
    #      This used to be automatic: `review-admit.yml` applied the label on a
    #      path match against `.github/high-risk-paths.txt`, and the
    #      `review-evidence` gate kept such PRs red until `coderabbitai[bot]`
    #      evidence existed. Both were retired in #415 with the rest of that gate.
    #      The label is now the whole mechanism, and it is a judgement call.
    #   2. The Claude lane is down — `@coderabbitai review`, by hand.
    #
    # SCOPE, precisely: `labels` gates AUTOMATIC review only. Manual triggers run
    # regardless of these settings and still spend the counter. That is wanted —
    # it is the escape hatch for case 2 and for re-requesting after
    # `auto_pause_after_reviewed_commits` stops incremental reviews.
    #
    # WHAT ENFORCES A MERGE, since it is no longer a required check: `CI gate`,
    # the conventional-title check, and GitHub's native
    # `required_review_thread_resolution` — an unresolved thread from any reviewer
    # blocks the merge button. Findings block; silence does not. So an unlabelled
    # PR is reviewed by the Claude lane only, and that is the accepted default.
    #
    # No dry run exists for this setting: CodeRabbit applies base-branch config
    # only for open-source repos, so it takes effect the moment it lands on main.
    # The revert is one commit — see ~/ai-context/state/prismalens-valve-revert.md.
    enabled: false
    labels:
      - "review-ready"
    # Still load-bearing under the flip: once a PR IS admitted, this stops a
    # fix-push loop from spending the counter again on every push. Push fixes as
    # a batch, then re-request explicitly with `@coderabbitai review`.
    auto_pause_after_reviewed_commits: 1
    ignore_title_keywords:
      - "WIP"
      - "Version Packages" # changesets release PR — generated churn, reviewed for zero value
  # `request_changes_workflow` is deliberately ABSENT (default: false). It was set
  # true in #411 so a clean diff would still yield a formal review object for
  # `review-evidence.sh` to consume; that consumer was deleted in #415. Left on, it
  # is a redundant second blocker: a REQUEST_CHANGES verdict blocks merge on top of
  # the unresolved threads that already do, and clearing it needs a dismissal or a
  # re-review rather than resolving the finding it names.
  #
  # Not a rate-limit lever (the limit counts reviews, not files) — this keeps PRs under
  # the OSS files-per-review cap of 50-150 and off generated noise.
  path_filters:
    - "!.changeset/**"
    - "!pnpm-lock.yaml"
  path_instructions:
    - path: "packages/*/src/**"
      instructions: >-
        If this PR changes a CLI verb, flag, env var, config key, task name, file layout, prompt surface, canonical event, or operator workflow, it must also update the RELEVANT documentation surface that describes that behavior — an unrelated docs/ or README change does not satisfy this. If the relevant surface is not updated, flag it as a documentation gap and name the specific stale surface. Reference surfaces: `packages/cli/README.md`, `packages/api/README.md`, `packages/@prismalens/contracts/README.md`, `docs/`.

        When a PR adds or substantially rewrites documentation that explains a resolution order, a mode/topology, a state machine, a pipeline, a precedence rule, or a side-by-side comparison — anything with three or more interacting parts — flag it as a documentation gap if the passage is prose-only. Such a passage must carry a worked example (real or realistically simulated input mapped to its output), a terminal transcript, a diagram (inline SVG or fenced diagram source — never a new build dependency added just to render one), or, only when the subject is genuinely graphical, a screenshot that names what invalidates it. Name the specific passage and which form fits; "add a diagram" is not an actionable finding. Do not flag prose that is below this threshold — a visual restating a two-step sequence is noise.
    - path: "packages/@prismalens/*/src/**"
      instructions: >-
        If this PR changes a CLI verb, flag, env var, config key, task name, file layout, prompt surface, canonical event, or operator workflow, it must also update the RELEVANT documentation surface that describes that behavior — an unrelated docs/ or README change does not satisfy this. If the relevant surface is not updated, flag it as a documentation gap and name the specific stale surface. Reference surfaces: `packages/cli/README.md`, `packages/api/README.md`, `packages/@prismalens/contracts/README.md`, `docs/`.

        When a PR adds or substantially rewrites documentation that explains a resolution order, a mode/topology, a state machine, a pipeline, a precedence rule, or a side-by-side comparison — anything with three or more interacting parts — flag it as a documentation gap if the passage is prose-only. Such a passage must carry a worked example (real or realistically simulated input mapped to its output), a terminal transcript, a diagram (inline SVG or fenced diagram source — never a new build dependency added just to render one), or, only when the subject is genuinely graphical, a screenshot that names what invalidates it. Name the specific passage and which form fits; "add a diagram" is not an actionable finding. Do not flag prose that is below this threshold — a visual restating a two-step sequence is noise.
    - path: "packages/cli/src/**"
      instructions: >-
        This is the published `prismalens` CLI package, so its public surface is user-facing.
    - path: "packages/@prismalens/engine/src/**"
      instructions: >-
        This is the published `@prismalens/engine` package. Repo invariants: the engine is agent/harness-agnostic (no harness-specific logic outside the harness registry); the engine takes a host-assembled InvestigationContext (it never fetches its own inputs); ordered-evidence epistemics — no numeric confidence scores anywhere in contracts or UI copy; the engine is a library — no protocol/transport/concurrency assumptions in engine core.
    - path: "packages/@prismalens/contracts/src/**"
      instructions: >-
        This is the published `@prismalens/contracts` package. Repo invariant: ordered-evidence epistemics — no numeric confidence scores anywhere in contracts.
    - path: "packages/frontend/src/**"
      instructions: >-
        Repo invariant: ordered-evidence epistemics — no numeric confidence scores anywhere in UI copy.
# `chat` governs comment-chat commands (@coderabbitai ...), which is a separate
# surface from the `reviews` block above. It defaults to allow_non_org_members:
# true, so on a public repo any GitHub user who can comment could otherwise
# issue commands — see https://docs.coderabbit.ai/guides/commands and
# https://docs.coderabbit.ai/reference/review-commands.
#
# The command that matters here is `@coderabbitai resolve`: it resolves review
# threads, and required_review_thread_resolution: true (ruleset 18441175) is now
# the ONLY mechanism that blocks a merge on findings — #415 deleted the
# review-evidence gate and everything that fed it. So an outside commenter
# clearing threads on someone else's PR removes the last remaining blocker.
# That is the whole reason for this change.
#
# `@coderabbitai approve` is not a live concern any more: it only submits an
# approving review when reviews.request_changes_workflow is enabled, and #415
# removed that setting (deliberately absent above, default false). With it off,
# the command does nothing.
#
# Restricting to org members is a mitigation, not a fix: a PR author who is an
# org member can still issue `resolve` on their own PR. Ruleset 18441175 stands
# regardless.
#
# Real cost, stated honestly: this also takes @coderabbitai review away from
# outside contributors as a self-service re-request after
# auto_pause_after_reviewed_commits stops incremental review on their PR.
# Acceptable because admission is already a manual maintainer action (auto_review
# is off; review-ready is applied by hand) — a maintainer can issue the
# re-request too — and because no merge depends on a CodeRabbit review any more,
# so the worst case is friction, not a deadlock.
chat:
  allow_non_org_members: false
