name: Bug report
description: PrismaLens, the `pl` command or the desktop app behaves incorrectly.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug. Issues are public, so remove tokens, keys,
        connection strings and private code from anything you paste.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you saw, and what you expected instead.
      placeholder: I created an incident, clicked Investigate, and ...
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The actions or commands, in order.
      placeholder: |
        1. pl up
        2. ...
        3. see error
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: "`pl doctor` output"
      description: Run `pl doctor` (or `npx prismalens doctor`) and paste the full output. It names the version, install channel, coding agents and workspace; it prints file paths, not secret values.
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: PrismaLens version
      description: "`pl --version`"
      placeholder: 0.5.1
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: OS and install channel
      description: Your OS, and how you installed PrismaLens (npm, the install script, Homebrew, Scoop, or the desktop app).
      placeholder: Ubuntu 24.04 on WSL2, npm
    validations:
      required: true
  - type: input
    id: agent
    attributes:
      label: Coding agent and version
      description: The agent the run used, and its version (for example `opencode --version`).
      placeholder: OpenCode 1.18.30
    validations:
      required: false
  - type: textarea
    id: report
    attributes:
      label: Investigation report (for problems with an investigation)
      description: On the incident, use Export Markdown and paste the report here.
      render: markdown
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Relevant output or logs
      description: Error messages, or lines from `<workspace>/logs/` (run `pl up --verbose` to see them in the terminal).
      render: shell
    validations:
      required: false
