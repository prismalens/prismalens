# Enforce that PR titles follow Conventional Commits. The repo squash-merges, so a
# PR's title becomes the commit subject on the trunk (`main`). Keeping titles
# conventional keeps history readable and changelog-ready.
#
# This validates the PR TITLE, not local branch commits (those get squashed away) —
# which is why a commit-msg hook (husky/commitlint) would be the wrong layer for a
# branch-protected, squash-merge repo.
#
# This is wired as a REQUIRED status check on `main` by repository ruleset
# 18441175, alongside `CI gate` — the two remaining required contexts since #415
# retired `review-evidence` — so a non-conventional title blocks merge.
# The ruleset is edited directly through the GitHub API; there is no
# in-tree file that defines it. `synchronize` is included because a required check
# must run on each new push to stay green.
name: Lint PR title

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - edited
      - synchronize
  # Merge-queue support (#403). A required check must report on the queue's
  # speculative merge commit or the queue can never merge anything. There is no
  # PR title to validate in a `merge_group` event — the title was already
  # validated (and is immutable to the queue) on the pull_request_target events
  # above, and a PR with a red title check cannot enter the queue in the first
  # place — so the queue leg reports success by construction rather than
  # re-checking. Split into two jobs because the two events carry different
  # payloads; both report the same required context name.
  merge_group:

permissions:
  pull-requests: read

jobs:
  validate:
    name: Validate PR title (conventional commits)
    if: github.event_name != 'merge_group'
    runs-on: ubuntu-latest
    steps:
      # No `with:` config — defaults validate against the standard conventional-commit
      # types (feat, fix, docs, style, refactor, perf, test, build, ci, chore, revert).
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  validate-queue:
    name: Validate PR title (conventional commits)
    if: github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    steps:
      - run: echo "Title validated on the pull request before it entered the merge queue."
