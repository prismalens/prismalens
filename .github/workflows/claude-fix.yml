# The fixer lane — applies code fixes on a PR branch when an org member comments
# `@claude fix`. Tracked in #403 (operator decision 2026-08-12: fixes apply
# online; merges stay human; reviewer/operator resolve threads, never the fixer).
#
# THIS LANE HOLDS `contents: write` — THE REPO'S ONLY MODEL-ADJACENT WRITE.
# ------------------------------------------------------------------
# That is what lets the fixer push commits to the PR branch. It is deliberately
# absent from `claude.yml` (mention lane) and `claude-code-review.yml` (review
# lane), both of which are read-only by design. The trade-off: this lane can
# modify source files and push, so the `--allowed-tools` list (primary), token
# scope, the `--disallowed-tools` belt, and the association filter are the
# controls that stop an attacker-influenced comment from steering a write into
# the repo. See the CONTAINMENT comment on the `fix` job for the full model.
name: Claude Fix

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

# Serialise per PR so two `@claude fix` comments in quick succession cannot race
# on the same branch. NOT `cancel-in-progress`: a fix is an instruction someone
# typed, and killing it half-done loses work nobody asked to discard (same
# reasoning as claude.yml's mention lane).
concurrency:
  group: claude-fix-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  # RESOLVE THE PR HEAD BEFORE GRANTING WRITE ACCESS.
  # ------------------------------------------------------------------
  # For `issue_comment`, the default checkout ref is the repo default branch,
  # not the PR branch. For `pull_request_review_comment`, the default ref is a
  # detached PR merge ref — `git push` has no upstream to target. Either way
  # the agent would commit to the wrong place or fail entirely.
  #
  # This lightweight job runs with minimal permissions (pull-requests: read),
  # fetches the PR head ref/sha/repo via `gh api`, and gates the write-capable
  # `fix` job on a same-repo check. A fork PR must hard-stop the run here:
  # the write credential on `fix` must never meet attacker-controlled code
  # from a fork ref (same class as the `pull_request_target` footgun).
  resolve-pr:
    # Same association + mention filter as the fix job — no point resolving
    # the PR if we would skip the fix anyway.
    if: |
      (
        github.event.comment.author_association == 'OWNER' ||
        github.event.comment.author_association == 'MEMBER' ||
        github.event.comment.author_association == 'COLLABORATOR'
      ) && (
        (github.event_name == 'issue_comment' && github.event.issue.pull_request && contains(github.event.comment.body, '@claude fix')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude fix'))
      )
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      head_ref: ${{ steps.pr.outputs.head_ref }}
      head_sha: ${{ steps.pr.outputs.head_sha }}
      same_repo: ${{ steps.pr.outputs.same_repo }}
    steps:
      - name: Fetch PR metadata and validate origin
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
        run: |
          pr="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
          head_ref="$(jq -r '.head.ref' <<< "$pr")"
          head_sha="$(jq -r '.head.sha' <<< "$pr")"
          head_repo="$(jq -r '.head.repo.full_name' <<< "$pr")"

          echo "head_ref=${head_ref}" >> "$GITHUB_OUTPUT"
          echo "head_sha=${head_sha}" >> "$GITHUB_OUTPUT"

          # FORK GUARD — the whole point of this job.
          # If the PR comes from a fork, `same_repo` is 'false' and the
          # `fix` job's `if:` will skip, denying the write credential to
          # code the repo owner did not author.
          if [[ "$head_repo" == "$GITHUB_REPOSITORY" ]]; then
            echo "same_repo=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::PR head repo '${head_repo}' does not match '${GITHUB_REPOSITORY}' — refusing to checkout fork code with write credentials."
            echo "same_repo=false" >> "$GITHUB_OUTPUT"
          fi

  fix:
    needs: resolve-pr
    # TWO conditions, and both matter.
    #
    # The mention itself is the second half. The first half is WHO may mention:
    # this is a public repo, so without the association filter any account that
    # can leave a comment can start a run that spends the subscription and feeds
    # attacker-chosen text to an agent holding this repo's app identity.
    #
    # Since #415 there is no merge gate reading anything this lane could produce —
    # `review-evidence` is retired and merges are enforced by `CI gate`, the title
    # check, and GitHub's native unresolved-thread rule. So this filter is no longer
    # backed by a second control underneath it: it is the whole of what stops an
    # arbitrary commenter from spending the subscription and steering an agent that
    # carries this repo's app identity. Note the limit of any association check —
    # the adversary this repo models is a drifted agent holding a maintainer
    # credential, and such an agent passes every one of them.
    #
    # CONTAINMENT OF A DRIFTED AGENT — THREE LAYERS, IN ORDER OF STRENGTH.
    #
    #   1. ALLOWLIST (`--allowed-tools`). Agent mode resolves its tool list
    #      ONLY from `claude_args`, so only the tools listed below are
    #      available at all. Anything not listed — `Task`, `gh api`, `gh pr
    #      review`, `gh pr merge`, `mcp__github_inline_comment__*` — is
    #      unreachable regardless of the deny list. This is the primary
    #      control.
    #
    #   2. TOKEN SCOPE. `pull-requests: read` on the GITHUB_TOKEN means the
    #      checked-out credential cannot submit reviews, resolve threads, or
    #      merge via the GitHub API even if a command somehow executed. The
    #      action posts under its own app installation token (see
    #      claude-code-review.yml L58-61), but the app token's scope is
    #      bounded to what the action itself calls — the agent's Bash
    #      commands use GITHUB_TOKEN, which is read-only for PRs.
    #
    #   3. DENY LIST (`--disallowed-tools`). Belt only, for the two CLI
    #      commands that the allowlist's `Bash(gh pr :*)` prefix patterns
    #      might accidentally widen in a future edit. Only prefix-form
    #      patterns (`Bash(command:*)`) are valid here — mid-pattern `:*`
    #      is treated literally by Claude Code and matches nothing.
    #
    # The `github.event.issue.pull_request` guard ensures the issue_comment trigger
    # only fires on pull requests, not bare issues — a fix on an issue has no
    # branch to push to.
    #
    # The `same_repo` gate is the fork guard from `resolve-pr` — it prevents a
    # fork PR from ever reaching the write-capable checkout below.
    if: |
      needs.resolve-pr.outputs.same_repo == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
      issues: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Check out the PR head branch, not the default branch or merge ref.
          # `resolve-pr` already validated that this ref belongs to the same
          # repo, so the write credential is safe to use here.
          ref: ${{ needs.resolve-pr.outputs.head_ref }}
          fetch-depth: 1
          # The agent pushes to the PR branch, so it needs a credential.
          # `contents: write` on the job token is what backs this.
          persist-credentials: true

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        # SYNCHRONOUS SUBAGENTS, PINNED BY BEHAVIOR — THE ASYNC REGRESSION
        # (#403, root-caused 2026-08-12).
        #
        # Same failure shape as the review lane: recent Claude Code CLIs
        # launch subagents in the background by default, and the action's
        # one-shot print mode exits before a background subagent can report
        # back. See the full root-cause in claude-code-review.yml; the fix
        # is the same env var.
        #
        # REMOVE once upstream makes print mode survive the launch→notification
        # gap, then VERIFY on a real PR that the fixer actually pushes.
        env:
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: '1'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # THE ALLOWED-TOOLS LIST IS LOAD-BEARING.
          #
          # `prompt:` puts this action in agent mode, and agent mode resolves
          # its entire tool list ONLY from `claude_args` — `settings` is not
          # read. MCP posting servers are installed conditionally on this list.
          # An omitted list leaves the agent with no tools at all: observed
          # twice on 2026-08-09 (review lane), both ran many turns, hit
          # permission denials, posted nothing, reported `conclusion: success`.
          #
          # THE LIST IS SCOPED TO WHAT THE FIXER NEEDS AND NOTHING MORE.
          #
          # Deliberately PRESENT:
          #   - Read,Grep,Glob,LS — read the codebase
          #   - Edit,Write,MultiEdit,TodoWrite — edit files
          #   - Bash(git status:*) through Bash(git push:*) — commit and push
          #   - Bash(gh pr view:*),Bash(gh pr diff:*) — read the PR
          #   - mcp__github_comment__update_claude_comment — report back
          #     (see REPLY MECHANISM below)
          #
          # Deliberately ABSENT:
          #   - Task — no subagents; the fixer is a single-shot editor.
          #   - mcp__github_inline_comment__create_inline_comment — the fixer
          #     replies to existing findings, it does not open new ones.
          #   - Any `gh api` prefix — no prefix narrow enough for thread
          #     replies (`gh api repos/.../pulls/N/comments`) can be written
          #     that does not also cover the reviews and merge endpoints,
          #     because `gh api` accepts flags before the path (`-X POST`,
          #     `--method`, `-H`, etc.) and prefix matching cannot skip them.
          #     `Bash(gh api:*)` uses a mid-pattern colon that Claude Code
          #     treats literally (docs: `:*` is only recognized at the end),
          #     so it would match nothing anyway.
          #   - Bash(gh pr comment:*) — not needed; the MCP tool is safer
          #     because it can only update the bot's own comment.
          #   - Bash(gh pr review:*),Bash(gh pr merge:*) — the fixer must
          #     never submit reviews or merge.
          #
          # REPLY MECHANISM — MCP FALLBACK.
          #
          # The ideal path is per-thread replies via `gh api ...pulls/N/comments
          # -F in_reply_to=ID`. But no `Bash(gh api ...)` prefix can be scoped
          # narrowly enough: the reviews, merge, and resolve-thread endpoints
          # share the same `gh api repos/...` prefix, and flag reordering
          # (`-X POST` vs `--method POST` vs implicit POST) defeats any fixed
          # prefix. Rather than allow a broad `gh api` surface on the one job
          # that holds `contents: write`, the fixer uses
          # `mcp__github_comment__update_claude_comment` to update its own
          # summary comment with a table of findings and the commit SHAs that
          # address them. The reviewer or operator can then cross-reference
          # each thread. This is less convenient but safer: the MCP tool can
          # only update comments the bot itself authored.
          #
          # A stale list fails SILENTLY — an agent denied at its first step
          # still exits `success`. Re-derive this list whenever the action
          # changes; a green job is not proof the list is current.
          claude_args: >-
            --allowed-tools
            "Read,Grep,Glob,LS,Edit,Write,MultiEdit,TodoWrite,Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git add:*),Bash(git commit:*),Bash(git push:*),Bash(gh pr view:*),Bash(gh pr diff:*),mcp__github_comment__update_claude_comment"
            --disallowed-tools "Bash(gh pr review:*)"
            --disallowed-tools "Bash(gh pr merge:*)"

          prompt: |
            You are a code fixer. An org member has commented `@claude fix` on
            this pull request. Your job:

            1. Read the PR diff and ALL unresolved review threads on this PR.
            2. For each unresolved thread that describes a fixable issue, apply
               the fix to the codebase on the PR's existing branch.
            3. Commit your changes with clear, conventional-commit messages.
               Never force-push — always a normal `git push`.
            4. After pushing, update your summary comment (using the
               `mcp__github_comment__update_claude_comment` tool) with a table
               listing each review thread you addressed and the commit SHA that
               fixes it. Format: one row per thread, with the thread's first
               line of context and the short SHA. This lets the reviewer or
               operator cross-reference each thread with its fix.
            5. If a finding requires changes to files under `.github/workflows/`,
               do NOT edit those files. Instead, note in the summary comment
               that the fix requires a workflow change and must be applied by
               the operator.
            6. If you cannot fix a finding, note it in the summary comment
               explaining why.

            Never resolve review threads. Never submit a review. Never merge.
            Never force-push.

