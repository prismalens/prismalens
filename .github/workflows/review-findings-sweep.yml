# This is a managed caller stub.
# Logic lives in prismalens/gh-workflows/.github/workflows/review-findings-sweep.yml.
# Do not add logic here.

name: Review Findings Sweep

on:
  # A closed PR is swept at once; the weekly run catches late thread changes and missed closes.
  pull_request:
    types: [closed]
  # Each submitted review, a reply included, sweeps that one open PR (gh-workflows#218).
  pull_request_review:
    types: [submitted]
  schedule:
    # Mondays 05:41 UTC. Off the hour on purpose: GitHub delays cron at peak hours.
    - cron: '41 5 * * 1'
  workflow_dispatch:
    inputs:
      full_history:
        description: 'Sweep every pull request, ignoring the update window'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  pull-requests: read
  # The sweep proves its repository to the telemetry Worker with an OIDC token (gh-workflows#176).
  id-token: write

# One sweep per PR at a time; a newer review supersedes a queued one (#1052).
concurrency:
  group: review-sweep-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  sweep:
    # The sweep reads claude[bot] threads. A review by any other bot (CodeRabbit posts dozens
    # an hour) cannot change them, so it takes no runner (#1052). Humans may be replying in one.
    if: >-
      github.event_name != 'pull_request_review' ||
      github.event.review.user.type != 'Bot' ||
      github.event.review.user.login == 'claude[bot]'
    uses: prismalens/gh-workflows/.github/workflows/review-findings-sweep.yml@86342cb105815ce2ed6887fdcf23dd668643ab9e # main
    with:
      full_history: ${{ inputs.full_history || false }}
      window_days: 8
    # explicit mapping: `inherit` does not cross ownership boundaries.
    secrets:
      REVIEW_TELEMETRY_URL: ${{ secrets.REVIEW_TELEMETRY_URL }}
      REVIEW_TELEMETRY_TOKEN: ${{ secrets.REVIEW_TELEMETRY_TOKEN }}
