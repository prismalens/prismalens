name: Publish agent host

# By hand only: PrismaLens and Assayer pick up a new version when they bump it (#916).
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1+, which an older Node 24 does not bundle.
      - run: npm install --global npm@11.21.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @prismalens/agent-host build
      - run: pnpm --filter @prismalens/agent-host test
      # pnpm pack rewrites `catalog:` ranges to real versions; npm publishes the tarball with provenance.
      - name: Publish
        working-directory: packages/@prismalens/agent-host
        run: |
          pnpm pack --pack-destination "$RUNNER_TEMP"
          npm publish "$RUNNER_TEMP"/prismalens-agent-host-*.tgz --access public --provenance
