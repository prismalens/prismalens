name: Playwright E2E

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright E2E (Chromium, shard ${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    # No service containers: dispatch is in-process over a SQLite job table, so the
    # app boots with no broker.
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build monorepo packages
        run: pnpm build

      - name: Install Playwright Chromium Browser
        run: pnpm --filter @prismalens/frontend exec playwright install chromium --with-deps

      # Phone and tablet run nightly (e2e-responsive.yml), not per PR. `@quarantine`
      # tests are excluded here and run in the next step (CONTRIBUTING.md, "Browser e2e tier").
      - name: Run Playwright E2E Tests
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: ${{ runner.temp }}/playwright-main.json
        run: pnpm --filter @prismalens/frontend test:e2e --project=chromium --project=journeys --shard=${{ matrix.shard }}/2

      - name: Flaky and failed tests to the job summary
        if: ${{ !cancelled() }}
        run: |
          if [ -f "$RUNNER_TEMP/playwright-main.json" ]; then
            sh scripts/playwright-summary.sh "$RUNNER_TEMP/playwright-main.json" "Playwright E2E, shard ${{ matrix.shard }}/2" >> "$GITHUB_STEP_SUMMARY"
          fi

      # Non-blocking by construction: a quarantined test may fail without failing the job.
      # Each has an open issue; the summary lists how it did. Shard 1 runs them all.
      - name: Run quarantined tests (non-blocking)
        id: quarantine
        if: ${{ !cancelled() && matrix.shard == 1 }}
        continue-on-error: true
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: ${{ runner.temp }}/playwright-quarantine.json
          PLAYWRIGHT_HTML_OUTPUT_DIR: ${{ github.workspace }}/packages/frontend/playwright-report-quarantine
        run: pnpm --filter @prismalens/frontend test:e2e --project=chromium-quarantine --project=journeys-quarantine

      - name: Quarantined tests to the job summary
        if: ${{ !cancelled() && matrix.shard == 1 }}
        run: |
          if [ -f "$RUNNER_TEMP/playwright-quarantine.json" ]; then
            sh scripts/playwright-summary.sh "$RUNNER_TEMP/playwright-quarantine.json" "Playwright E2E, quarantined (non-blocking)" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Playwright Report
        if: ${{ failure() || steps.quarantine.outcome == 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            packages/frontend/playwright-report/
            packages/frontend/playwright-report-quarantine/
          retention-days: 7
