# The desktop app (#83): build the unpacked Electron app on each OS from the
# app tarball scripts/pack-cli.mjs packs (npm ships only the launcher, #717), launch it on an empty
# workspace, and assert the window rendered the app. When release.yml calls it
# with a draft release's tag, the three unpacked apps are zipped and attached to
# that draft, unsigned (signing is #697).
name: Desktop app build

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "packages/desktop/**"
      - "scripts/pack-cli.mjs"
      - "scripts/lib/**"
      - "scripts/artifact-budgets.json"
      - "packages/@prismalens/agent-adapters/scripts/**"
      # The app installs the packed tarball, so any dependency change can grow it (#1269).
      - "package.json"
      - "packages/**/package.json"
      - ".nvmrc"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/build-desktop-app.yml"
      - "scripts/install/install.sh"
      - "scripts/install/install.ps1"
  push:
    branches: [main]
    paths:
      - "packages/desktop/**"
      - "scripts/pack-cli.mjs"
      - "scripts/lib/**"
      - "scripts/artifact-budgets.json"
      - "packages/@prismalens/agent-adapters/scripts/**"
      # The app installs the packed tarball, so any dependency change can grow it (#1269).
      - "package.json"
      - "packages/**/package.json"
      - ".nvmrc"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/build-desktop-app.yml"
      - "scripts/install/install.sh"
      - "scripts/install/install.ps1"
  workflow_call:
    inputs:
      release-tag:
        type: string
        required: true
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ inputs.release-tag || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and smoke (${{ matrix.os }})
    # A draft release PR is rebuilt on every push to main; it builds only after it is marked ready (#1052).
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # A PR builds on Linux only; main, a release and dispatch build all three.
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest"]' || '["ubuntu-latest","macos-latest","windows-2022"]') }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release-tag }}

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the workspace
        run: pnpm build

      - name: Build the unpacked app
        run: pnpm --filter @prismalens/desktop dist

      # Extract All must survive it: a file budget everywhere, MAX_PATH under a 100-char folder on Windows (#673 w53);
      # the size and file budgets are scripts/artifact-budgets.json's (#906).
      - name: Check the app's size, file count and path lengths
        run: |
          read -r mb files < <(node -p "const b = require('./scripts/artifact-budgets.json')['desktop-' + process.env.RUNNER_OS]; b.mb + ' ' + b.files")
          node packages/desktop/scripts/check-release-paths.mjs --max-mb "$mb" --max-files "$files" ${{ runner.os == 'Windows' && '--paths' || '' }}

      - name: Launch it and assert the window rendered (xvfb on Linux)
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run --auto-servernum pnpm --filter @prismalens/desktop smoke "$GITHUB_WORKSPACE/desktop-smoke-${RUNNER_OS}.png"
          else
            pnpm --filter @prismalens/desktop smoke "$GITHUB_WORKSPACE/desktop-smoke-${RUNNER_OS}.png"
          fi

      # The run panel's browser shares nothing with the app (#973): cookie, Node, bridge, file: and the window's origin.
      # --no-sandbox as in the smoke: the runner's chrome-sandbox is not setuid; the isolation under test is the view's own preferences.
      - name: The panel's browser is isolated from the app (xvfb on Linux)
        run: |
          cd packages/desktop
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run --auto-servernum npx electron --no-sandbox scripts/browser-isolation.mjs || { cat dist/browser-isolation.txt; exit 1; }
          else
            npx electron scripts/browser-isolation.mjs || { cat dist/browser-isolation.txt; exit 1; }
          fi
          cat dist/browser-isolation.txt

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: desktop-smoke-${{ runner.os }}
          path: desktop-smoke-*.png
          retention-days: 7

      - name: Zip the unpacked app
        id: zip
        run: |
          cd packages/desktop/release
          # electron-builder also leaves its .icon-ico / .icon-icns cache here (#745).
          dir=$(find . -mindepth 1 -maxdepth 1 -type d ! -name '.*' | head -1)
          name="PrismaLens-${RUNNER_OS}-${RUNNER_ARCH}-unsigned.zip"
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a -tzip "$GITHUB_WORKSPACE/$name" "$dir" >/dev/null
          else
            # ditto keeps the .app bundle's symlinks and modes on macOS.
            if [ "$RUNNER_OS" = "macOS" ]; then ditto -c -k --keepParent "$dir" "$GITHUB_WORKSPACE/$name"; else zip -qry "$GITHUB_WORKSPACE/$name" "$dir"; fi
          fi
          size=$(wc -c < "$GITHUB_WORKSPACE/$name")
          if [ "$size" -lt 50000000 ]; then echo "::error::$name is $size bytes; $dir is not the app"; exit 1; fi
          echo "name=$name" >> "$GITHUB_OUTPUT"

      # What a user of the official installer gets: the app and its launcher in the OS's usual place,
      # opened through that launcher to the first screen, then uninstalled.
      - name: Install it with the official installer and open it from its launcher (xvfb on Linux)
        run: |
          zip="$GITHUB_WORKSPACE/${{ steps.zip.outputs.name }}"
          png="$GITHUB_WORKSPACE/desktop-installed-${RUNNER_OS}.png"
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run --auto-servernum node packages/desktop/scripts/smoke-installed.mjs "$zip" "$png"
          else
            node packages/desktop/scripts/smoke-installed.mjs "$zip" "$png"
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: desktop-installed-${{ runner.os }}
          path: desktop-installed-*.png
          retention-days: 7

      # The app's own package-manager entries, from this build's zip on a local server.
      - name: Smoke the prismalens-app cask (macOS)
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          set -eu
          version=$(node -p "require('./packages/desktop/package.json').version")
          dir="$RUNNER_TEMP/app-base"
          mkdir -p "$dir"
          cp "$GITHUB_WORKSPACE/${{ steps.zip.outputs.name }}" "$dir/"
          (cd "$dir" && shasum -a 256 ./*.zip | sed 's# \./# #' > SHA256SUMS)
          python3 -m http.server 8766 --bind 127.0.0.1 --directory "$dir" >/dev/null 2>&1 &
          server=$!
          node scripts/install/package-manifests.mjs --version "$version" --sums "$dir/SHA256SUMS" \
            --out "$RUNNER_TEMP/app-manifests" --base-url "http://127.0.0.1:8766" --allow-missing
          brew tap-new --no-git local/prismalens-app-test
          tap="$(brew --repository local/prismalens-app-test)"
          mkdir -p "$tap/Casks"
          cp "$RUNNER_TEMP/app-manifests/Casks/prismalens-app.rb" "$tap/Casks/"
          brew install --cask local/prismalens-app-test/prismalens-app
          kill "$server"
          [ -x /Applications/PrismaLens.app/Contents/MacOS/PrismaLens ] || { echo "::error::no /Applications/PrismaLens.app"; exit 1; }
          echo "quarantine on the cask's app: $(xattr -p com.apple.quarantine /Applications/PrismaLens.app 2>/dev/null || echo none)"
          brew uninstall --cask prismalens-app
          [ ! -e /Applications/PrismaLens.app ] || { echo "::error::uninstall left /Applications/PrismaLens.app"; exit 1; }
          brew untap local/prismalens-app-test

      - name: Smoke the prismalens-app Scoop manifest (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = (Get-Content packages\desktop\package.json -Raw | ConvertFrom-Json).version
          $dir = "$env:RUNNER_TEMP\app-base"
          New-Item -ItemType Directory $dir -Force | Out-Null
          $zip = Copy-Item "$env:GITHUB_WORKSPACE\${{ steps.zip.outputs.name }}" $dir -PassThru
          "$((Get-FileHash $zip.FullName -Algorithm SHA256).Hash.ToLower())  $($zip.Name)" | Out-File "$dir\SHA256SUMS" -Encoding ascii
          $server = Start-Process python -ArgumentList "-m", "http.server", "8766", "--bind", "127.0.0.1", "--directory", $dir -PassThru -WindowStyle Hidden
          node scripts/install/package-manifests.mjs --version $version --sums "$dir\SHA256SUMS" `
            --out "$env:RUNNER_TEMP\app-manifests" --base-url "http://127.0.0.1:8766" --allow-missing
          Invoke-RestMethod https://raw.githubusercontent.com/ScoopInstaller/Install/1e2f334083d609986d8c8bc9e31ae8e87c39fab4/install.ps1 -OutFile "$env:RUNNER_TEMP\install-scoop.ps1"
          & "$env:RUNNER_TEMP\install-scoop.ps1" -RunAsAdmin
          $env:Path = "$env:USERPROFILE\scoop\shims;$env:Path"
          scoop install "$env:RUNNER_TEMP\app-manifests\bucket\prismalens-app.json"
          if ($LASTEXITCODE -ne 0) { Write-Error "scoop install failed"; exit 1 }
          Stop-Process -Id $server.Id -Force
          $lnk = Join-Path ([Environment]::GetFolderPath('Programs')) 'Scoop Apps\PrismaLens.lnk'
          if (-not (Test-Path $lnk)) { Write-Error "no Start menu shortcut at $lnk"; exit 1 }
          $target = (New-Object -ComObject WScript.Shell).CreateShortcut($lnk).TargetPath
          if (-not (Test-Path $target) -or (Split-Path $target -Leaf) -ne 'PrismaLens.exe') { Write-Error "the shortcut opens $target"; exit 1 }
          "ok: $lnk opens $target"
          # Opened from Scoop's shortcut, the app renders and adds no launcher of its own beside Scoop's.
          $png = "$env:GITHUB_WORKSPACE\desktop-scoop.png"
          $env:PRISMALENS_DESKTOP_SMOKE = $png; $env:PRISMALENS_DESKTOP_SMOKE_LAUNCHER = "1"
          $env:PRISMALENS_WORKSPACE_DIR = "$env:RUNNER_TEMP\scoop-ws"; $env:PRISMALENS_TELEMETRY = "off"
          Start-Process $lnk
          for ($i = 0; $i -lt 180 -and -not ((Test-Path $png) -and (Get-Item $png).Length -gt 10000); $i++) { Start-Sleep 1 }
          if (-not (Test-Path $png)) { Write-Error "the app opened from Scoop's shortcut rendered nothing"; exit 1 }
          Start-Sleep 10
          $own = Join-Path ([Environment]::GetFolderPath('Programs')) 'PrismaLens.lnk'
          if (Test-Path $own) { Write-Error "the app added $own beside Scoop's shortcut"; exit 1 }
          "ok: rendered from Scoop's shortcut, no second shortcut"
          scoop uninstall prismalens-app
          if (Test-Path $lnk) { Write-Error "uninstall left $lnk"; exit 1 }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-${{ runner.os }}
          path: ${{ steps.zip.outputs.name }}
          retention-days: 7

  attach:
    name: Attach to the draft release
    needs: build
    if: inputs.release-tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: desktop-*
          path: apps
          merge-multiple: true

      - name: Upload the unsigned apps
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release-tag }}
        run: gh release upload "$TAG" apps/*.zip --repo "$GITHUB_REPOSITORY" --clobber
