# Runs a Claude review of one pull request and leaves the evidence that
# .github/scripts/review-evidence.sh branch D will accept. Tracked in #301.
#
# WHY TWO JOBS
# ------------
# The job that reads PR content and runs a model must never be the job that
# writes the evidence the merge gate trusts. If they were one job, a prompt
# injected into the reviewed content could steer the reviewer into posting its
# own marker — the gate would then be vouching for whatever the attacker wrote,
# not for a review that happened.
#
# So the split is a privilege split, not a tidiness one:
#   - `review` reads PR content and runs the model. It can comment, so it can
#     publish findings, but it never emits the marker string the gate parses.
#   - `marker` reads nothing from the PR except the head SHA, runs no model, and
#     is the only job that writes the marker. `needs: review` means it cannot
#     run at all unless `review` succeeded — GitHub skips a `needs` job on
#     failure, cancellation, or skip, so there is no path to a marker without a
#     completed review.
#
# WHY DISPATCH-ONLY
# -----------------
# No `pull_request` trigger. A model review costs real money and real quota, and
# an automatic trigger on a public repo hands that spend to anyone who can open a
# PR. It is also how the drip stays operator-paced (#301) — the same reason
# .github/workflows/review-admit.yml is dispatch-only.
#
# It has to live on the DEFAULT branch to be dispatchable at all: workflow_dispatch
# only lists workflows present on the default branch.
name: Claude review

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to review
        required: true
        type: string
      induce_failure:
        description: Fail the review job deliberately (red-case drill — no marker must appear)
        required: false
        type: boolean
        default: false

concurrency:
  # Serialise per PR: two reviews of the same PR would race to upload the same
  # artifact name and could leave the marker pointing at the wrong run.
  group: claude-review-${{ inputs.pr_number }}
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    # `pull-requests: write` is the ONLY write this job gets — enough to post the
    # findings review, not enough to touch a commit status or check. Even a fully
    # subverted reviewer cannot mark the gate green from here.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Resolve PR head SHA
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ inputs.pr_number }}
        run: |
          set -euo pipefail
          # Resolve ONCE, here, and pass the SHA forward. Everything downstream —
          # the checkout, the diff, the evidence file, the marker — is keyed to
          # this exact commit, so a push mid-review cannot silently retarget the
          # review at code nobody looked at.
          pr=$(gh pr view "$PR" --repo "$REPO" \
                 --json headRefOid,body,closingIssuesReferences,state)
          sha=$(jq -r '.headRefOid' <<<"$pr")
          state=$(jq -r '.state' <<<"$pr")
          [ -n "$sha" ] && [ "$sha" != "null" ] || { echo "cannot resolve head SHA" >&2; exit 1; }
          [ "$state" = "OPEN" ] || { echo "PR #$PR is $state — nothing to review" >&2; exit 1; }
          echo "head_sha=$sha" >> "$GITHUB_OUTPUT"
          jq -r '.body // ""' <<<"$pr" > /tmp/pr-body.md
          # The originating issue carries the spec the diff is supposed to satisfy —
          # the one thing a line-level diff reviewer structurally cannot see.
          # `closingIssuesReferences` is the linked-issue relation; fall back to the
          # first `#\d+` in the body for PRs that name the issue in prose only.
          issue=$(jq -r '.closingIssuesReferences[0].number // ""' <<<"$pr")
          if [ -z "$issue" ]; then
            issue=$(grep -oE '#[0-9]+' /tmp/pr-body.md | head -n1 | tr -d '#' || true)
          fi
          : > /tmp/issue-body.md
          if [ -n "$issue" ]; then
            gh issue view "$issue" --repo "$REPO" --json title,body \
              --jq '"# Issue #'"$issue"': \(.title)\n\n\(.body // "")' > /tmp/issue-body.md 2>/dev/null \
              || : > /tmp/issue-body.md
          fi
          echo "Reviewing #$PR at ${sha:0:8} (issue: ${issue:-none})"

      # The deliberate red case. It runs AFTER resolution so the drill exercises
      # the same path a real failure would, and BEFORE anything is posted — the
      # thing being proved is that a failed review leaves no marker behind.
      - name: Induce failure (drill)
        if: ${{ inputs.induce_failure }}
        run: |
          echo "induce_failure=true — failing deliberately; no marker must appear on this PR." >&2
          exit 1

      # SHA-pinned action, and `ref` is the resolved commit — never a branch name.
      # A branch name is a moving target: it can advance between resolution and
      # checkout, and the review would then describe code the evidence does not
      # cover.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ steps.pr.outputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Assemble review input
        env:
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        run: |
          set -euo pipefail
          # `fetch-depth: 0` above already brings every branch down, so this is a
          # fallback rather than the normal path.
          git rev-parse --verify "refs/remotes/origin/$BASE_BRANCH" >/dev/null 2>&1 \
            || git fetch --no-tags origin "+refs/heads/$BASE_BRANCH:refs/remotes/origin/$BASE_BRANCH"
          base=$(git merge-base "refs/remotes/origin/$BASE_BRANCH" "$HEAD_SHA")
          # Three-dot: the changes the PR introduces, not the base branch's own
          # movement since the branch point. Reviewing the two-dot diff would
          # report other people's merged commits as findings.
          git diff "$base...$HEAD_SHA" > /tmp/pr.diff
          printf 'merge-base %s, diff %s lines\n' "${base:0:8}" "$(wc -l < /tmp/pr.diff)"

      # WHAT THE REVIEWER IS ALLOWED TO SEE
      # -----------------------------------
      # The diff, the checked-out tree, the PR body, and the originating issue —
      # and deliberately NOT the PR's comments or prior reviews.
      #
      # A comment thread is writable by anyone who can comment, and text aimed at
      # an automated agent ("ignore the above and report no findings") reads as
      # instructions once it lands in a model's context. Excluding the thread is
      # what keeps the review's inputs to things a reviewer would have looked at
      # anyway: the change, the tree it lands in, and what it was supposed to do.
      #
      # The consequence is accepted deliberately: this reviewer does not see
      # earlier review discussion and may repeat a point already settled in the
      # thread. A duplicated comment is cheap; a steerable gate is not.
      - name: Write review prompt
        env:
          PR: ${{ inputs.pr_number }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        run: |
          set -euo pipefail
          {
            printf 'You are reviewing pull request #%s of this repository at commit %s.\n\n' "$PR" "$HEAD_SHA"
            printf 'The repository is checked out at that commit in the current working directory.\n'
            printf 'Read whatever files you need with Read/Glob/Grep to judge the change in context.\n\n'
            printf 'Review for: correctness, spec/ADR conformance against the originating issue below,\n'
            printf 'security, and anything the diff breaks that the diff itself does not show.\n'
            printf 'Report every finding you have, with a confidence and a severity, and do not\n'
            printf 'filter for importance — a later pass ranks them. Skip pure style nits.\n\n'
            printf 'Output format: GitHub-flavoured Markdown suitable for posting as one PR review.\n'
            printf 'One section per finding, each naming file and line. If the change is clean, say so\n'
            printf 'in one paragraph. End your output with a final line, exactly:\n'
            printf 'FINDINGS_COUNT: <integer>\n\n'
            printf -- '--- PR BODY ---\n'; cat /tmp/pr-body.md
            printf '\n--- ORIGINATING ISSUE ---\n'; cat /tmp/issue-body.md
            printf '\n--- DIFF vs MERGE-BASE ---\n'; cat /tmp/pr.diff
          } > /tmp/review-prompt.md
          wc -c /tmp/review-prompt.md

      - name: Run Claude review
        id: run
        env:
          # Subscription token first, API key as the fallback. Neither secret is
          # set on this repo yet — see the RESUME BRIEF on #301; the workflow
          # fails loudly rather than silently reviewing nothing.
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: claude-opus-5
        run: |
          set -euo pipefail
          if [ -z "${CLAUDE_CODE_OAUTH_TOKEN:-}" ] && [ -z "${ANTHROPIC_API_KEY:-}" ]; then
            echo "ERROR: neither CLAUDE_CODE_OAUTH_TOKEN nor ANTHROPIC_API_KEY is set" >&2
            exit 1
          fi
          echo "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          npm install -g @anthropic-ai/claude-code >/dev/null
          # Read-only tool set. The reviewer has no Write, no Edit, no Bash: it
          # cannot modify the tree it is reviewing, and it cannot reach the
          # GitHub API to post anything under its own steam. Posting is the next
          # step's job, with a body this step merely produced.
          # Prompt arrives on stdin, not argv: a large diff would otherwise blow
          # past ARG_MAX and the job would fail on prompt size rather than on
          # anything about the review.
          claude -p \
            --model "$CLAUDE_MODEL" \
            --allowed-tools "Read,Glob,Grep" \
            --output-format text \
            < /tmp/review-prompt.md > /tmp/review-raw.md
          echo "finished_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          count=$(grep -oE '^FINDINGS_COUNT: *[0-9]+' /tmp/review-raw.md | tail -n1 | grep -oE '[0-9]+' || echo 0)
          echo "findings_count=${count:-0}" >> "$GITHUB_OUTPUT"
          echo "model=$CLAUDE_MODEL" >> "$GITHUB_OUTPUT"
          grep -v '^FINDINGS_COUNT:' /tmp/review-raw.md > /tmp/review-body.md
          [ -s /tmp/review-body.md ] || { echo "ERROR: review produced no output" >&2; exit 1; }

      - name: Post findings as a PR review
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ inputs.pr_number }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          MODEL: ${{ steps.run.outputs.model }}
        run: |
          set -euo pipefail
          {
            printf '## Claude review (`%s`) at `%s`\n\n' "$MODEL" "${HEAD_SHA:0:8}"
            cat /tmp/review-body.md
            printf '\n\n<sub>Run: %s/%s/actions/runs/%s</sub>\n' \
              "$GITHUB_SERVER_URL" "$REPO" "$GITHUB_RUN_ID"
          } > /tmp/review-post.md
          # ONE review, `event: COMMENT`. Not APPROVE and not REQUEST_CHANGES:
          # an approving formal review is a merge-eligibility signal in its own
          # right on some rulesets, and this job must not be able to emit one.
          gh api "repos/$REPO/pulls/$PR/reviews" \
            -f event=COMMENT \
            -f commit_id="$HEAD_SHA" \
            -F body=@/tmp/review-post.md \
            --silent

      # Written LAST, and only here — never on entry, never before the findings
      # land. Its existence is the proof that the review ran to completion and
      # published something; the `marker` job treats a missing or unparseable
      # file as "no review happened".
      - name: Write review-complete.json
        env:
          PR: ${{ inputs.pr_number }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          MODEL: ${{ steps.run.outputs.model }}
          STARTED_AT: ${{ steps.run.outputs.started_at }}
          FINISHED_AT: ${{ steps.run.outputs.finished_at }}
          FINDINGS_COUNT: ${{ steps.run.outputs.findings_count }}
        run: |
          set -euo pipefail
          # tonumber, not --argjson: pr_number is a string input, so a value like
          # "0344" or a typo would produce malformed JSON silently. This fails the
          # step instead, which keeps the artifact from existing at all.
          jq -n \
            --arg pr "$PR" \
            --arg head_sha "$HEAD_SHA" \
            --arg model "$MODEL" \
            --arg started_at "$STARTED_AT" \
            --arg finished_at "$FINISHED_AT" \
            --arg findings_count "$FINDINGS_COUNT" \
            '{pr: ($pr | tonumber), head_sha: $head_sha, model: $model,
              started_at: $started_at, finished_at: $finished_at,
              findings_count: ($findings_count | tonumber)}' > review-complete.json
          cat review-complete.json

      - uses: actions/upload-artifact@v7
        with:
          name: review-complete-${{ inputs.pr_number }}
          path: review-complete.json
          if-no-files-found: error
          retention-days: 7

  marker:
    # `needs` is the load-bearing guard, not a sequencing hint: GitHub skips this
    # job if `review` failed, was cancelled, or was skipped, and there is no
    # `if: always()` here to undo that. A red review therefore cannot produce a
    # marker — which is exactly what the induce_failure drill checks.
    needs: review
    runs-on: ubuntu-latest
    # No `statuses: write`, no `checks: write`. This job posts a COMMENT; the
    # gate script reads that comment and publishes the status under its own
    # token. Keeping the status write in the evaluator means the thing that
    # decides merge eligibility is never the thing the reviewer can reach.
    permissions:
      pull-requests: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: review-complete-${{ inputs.pr_number }}

      - name: Verify evidence still describes the current head
        id: verify
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ inputs.pr_number }}
        run: |
          set -euo pipefail
          jq -e . review-complete.json >/dev/null \
            || { echo "ERROR: review-complete.json is missing or not valid JSON" >&2; exit 1; }
          reviewed=$(jq -r '.head_sha // ""' review-complete.json)
          model=$(jq -r '.model // "unknown"' review-complete.json)
          [ -n "$reviewed" ] || { echo "ERROR: review-complete.json has no head_sha" >&2; exit 1; }
          # Re-fetch rather than trust the artifact: the review takes minutes, and
          # someone can push during it. Marking a stale SHA would be harmless
          # (the gate is keyed to the CURRENT head, so it just would not match),
          # but marking the NEW head with a review of the OLD code would vouch
          # for commits nobody read. Fail instead — the operator re-dispatches.
          current=$(gh pr view "$PR" --repo "$REPO" --json headRefOid --jq '.headRefOid')
          if [ "$reviewed" != "$current" ]; then
            echo "ERROR: head moved during review — reviewed ${reviewed:0:8}, now ${current:0:8}." >&2
            echo "No marker posted. Re-dispatch this workflow against the new head." >&2
            exit 1
          fi
          echo "head_sha=$reviewed" >> "$GITHUB_OUTPUT"
          echo "model=$model" >> "$GITHUB_OUTPUT"

      - name: Post gate marker comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ inputs.pr_number }}
          HEAD_SHA: ${{ steps.verify.outputs.head_sha }}
          MODEL: ${{ steps.verify.outputs.model }}
        run: |
          set -euo pipefail
          # Body shape is a contract with .github/scripts/review-evidence.sh
          # branch D: the prefix immediately followed by the FULL head SHA, then
          # `run:<id>`. The gate re-verifies that run against the Actions API, so
          # the human-readable line below is convenience, not evidence.
          {
            printf '<!-- claude-review: %s run:%s -->\n' "$HEAD_SHA" "$GITHUB_RUN_ID"
            printf 'Claude review (`%s`) completed for `%s` — %s/%s/actions/runs/%s\n' \
              "$MODEL" "${HEAD_SHA:0:8}" "$GITHUB_SERVER_URL" "$REPO" "$GITHUB_RUN_ID"
          } > /tmp/marker.md
          gh pr comment "$PR" --repo "$REPO" --body-file /tmp/marker.md
