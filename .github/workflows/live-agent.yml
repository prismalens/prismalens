# Live agent check: the real pinned agent on the free model, nightly and on demand.
#
# PRs run the agent loop against scripted fakes (ci.yml), so a red `CI gate` means
# the code is wrong. This workflow is the other half: it asks whether the real
# agent and a real free model still complete an investigation, on a known cadence
# and with a stated pass bound (#884). It is advisory and nothing requires it.
#
# The agent is PINNED to the same OpenCode version ci.yml pins (`AGENT_VERSION`
# below must match). This is not a run against agents' latest releases; that was
# ruled out on #639 and #712. Only the model varies.
#
# Packed intake runs 3 attempts and passes if at least 2 complete with a valid
# report (the script exits 0 only then). Each attempt uploads its paged event
# stream (/api/investigations/:id/events), the recording source for #533.
#
# Release gate: dispatch with `ref` set to a release PR's base SHA, then link the
# run from the release PR. Only the nightly schedule files the failure issue.
name: Live agent

on:
  pull_request:
  schedule:
    - cron: "47 2 * * *" # 02:47 UTC daily, on the default branch
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or SHA to check (default is the branch the run is dispatched on)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: live-agent-${{ inputs.ref || github.ref }}
  cancel-in-progress: false

env:
  AGENT_VERSION: 1.18.30
  FREE_MODEL: opencode/deepseek-v4.1-flash-free

jobs:
  pack:
    name: Pack npm tarball
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Pack tarball
        run: |
          mkdir -p /tmp/tarballs
          node scripts/pack-cli.mjs --out /tmp/tarballs
          ls -l /tmp/tarballs

      - uses: actions/upload-artifact@v7
        with:
          name: npm-tarballs
          path: /tmp/tarballs/*.tgz
          retention-days: 3

  packed-intake-live:
    name: Packed intake, live agent (2 of 3)
    needs: pack
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Install the pinned OpenCode
        run: npm install -g "opencode-ai@${AGENT_VERSION}" && opencode --version

      - uses: actions/download-artifact@v8
        with:
          name: npm-tarballs
          path: tarballs

      - name: Three attempts, pass on at least two valid reports
        env:
          PACKED_INTAKE_AGENT: live
          PACKED_INTAKE_REPO: fixture
          PRISMALENS_HARNESS: opencode
          PRISMALENS_HARNESS_MODEL: ${{ env.FREE_MODEL }}
        run: |
          set -u
          mkdir -p events
          passed=0
          for n in 1 2 3; do
            echo "::group::attempt $n"
            model="$PRISMALENS_HARNESS_MODEL"; [ "$n" -le 2 ] && model=opencode/does-not-exist
            if PRISMALENS_HARNESS_MODEL="$model" PACKED_INTAKE_EVENTS_OUT="$PWD/events/attempt-$n.json" \
              PACKED_INTAKE_PORT=$((3102 + n)) \
              timeout 20m node scripts/packed-intake.mjs tarballs; then
              passed=$((passed + 1))
              echo "attempt $n: valid report" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "attempt $n: no valid report" >> "$GITHUB_STEP_SUMMARY"
            fi
            echo "::endgroup::"
          done
          echo "$passed of 3 attempts completed with a valid report" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$passed" -lt 2 ]; then
            echo "::error::only $passed of 3 attempts completed with a valid report; 2 are needed"
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: intake-events-attempt-1
          path: events/attempt-1.json
          if-no-files-found: ignore
          retention-days: 30

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: intake-events-attempt-2
          path: events/attempt-2.json
          if-no-files-found: ignore
          retention-days: 30

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: intake-events-attempt-3
          path: events/attempt-3.json
          if-no-files-found: ignore
          retention-days: 30

  harness-admission-live:
    name: Harness admission, live (opencode)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the packages the engine imports
        run: pnpm --filter "@prismalens/contracts..." build

      - name: Install the pinned OpenCode
        run: npm install -g "opencode-ai@${AGENT_VERSION}" && opencode --version

      - name: Run the admission script against this checkout
        env:
          PRISMALENS_HARNESS_MODEL: ${{ env.FREE_MODEL }}
        run: pnpm --filter @prismalens/engine exec tsx scripts/acp-admission.ts opencode "$GITHUB_WORKSPACE"

  report-failure:
    name: Upsert the failing-check issue
    needs: [pack, packed-intake-live, harness-admission-live]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Comment on the open issue, or open one
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          set -eu
          title="Live agent check failing on main (workflow test, ignore)"
          failed=$(echo "$NEEDS_JSON" | jq -r 'to_entries | map(select(.value.result == "failure") | .key) | join(", ")')
          body="The nightly live agent check failed on $(date -u +%F) at $GITHUB_SHA. Failed jobs: ${failed}. Run: ${RUN_URL}"
          number=$(gh issue list --state open --search "\"$title\" in:title" --json number,title \
            --jq "map(select(.title == \"$title\")) | .[0].number // empty")
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$title" --body "$body

          This issue is opened by .github/workflows/live-agent.yml and gets one comment per failing night."
          fi
