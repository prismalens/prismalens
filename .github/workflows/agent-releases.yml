# What the agents we support have released (#914): a zero-token protocol probe of each row's
# latest version, and a pull request that moves a pin once its release has soaked 3 days.
# Neither spends a model call, and neither is required by `CI gate`.
name: Agent releases (probe and pin bumps)

on:
  schedule:
    - cron: "23 3 * * *" # 03:23 UTC daily, on the default branch
  workflow_dispatch:
  # A change to the probe or to this file runs the probe, so it is seen working before it merges.
  pull_request:
    paths:
      - ".github/workflows/agent-releases.yml"
      - "scripts/agent-probe.mjs"
      - "scripts/agent-pins.json"

permissions:
  contents: read

concurrency:
  group: agent-releases
  cancel-in-progress: false

jobs:
  probe:
    name: Protocol probe (latest release of every row)
    if: github.repository == 'prismalens/prismalens'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The deepagents row installs with uv, which fetches the Python 3.14 it needs.
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      - name: Build the registry the table reads `tested` from
        run: pnpm --filter @prismalens/config... build

      # initialize and session/new only: the agents run unauthenticated and see no model.
      - name: Probe every row at its latest release
        run: node scripts/agent-probe.mjs --all --registry "$GITHUB_WORKSPACE/packages/@prismalens/config/dist/providers/harness.js"

  bump:
    name: Pin bump
    if: github.repository == 'prismalens/prismalens' && github.event_name != 'pull_request'
    uses: prismalens/gh-workflows/.github/workflows/pin-bump.yml@86342cb105815ce2ed6887fdcf23dd668643ab9e
    permissions:
      contents: write
      pull-requests: write
    with:
      # Adapters first: the claude-code probe reads the adapter pin, after a failed probe put it back.
      pins: >-
        [{"package": "@agentclientprotocol/claude-agent-acp", "pin-path": "packages/@prismalens/agent-adapters/package.json"},
        {"package": "@agentclientprotocol/codex-acp", "pin-path": "packages/@prismalens/agent-adapters/package.json"},
        {"package": "opencode-ai", "pin-path": "scripts/agent-pins.json", "pin-key": "[\"pins\",\"opencode-ai\"]"},
        {"package": "@anthropic-ai/claude-code", "pin-path": "scripts/agent-pins.json", "pin-key": "[\"pins\",\"@anthropic-ai/claude-code\"]"},
        {"package": "@openai/codex", "pin-path": "scripts/agent-pins.json", "pin-key": "[\"pins\",\"@openai/codex\"]"}]
      soak-days: 3
      probe: |
        adapter() { node -p "require('./packages/@prismalens/agent-adapters/package.json').devDependencies['$1']"; }
        case "$PIN_PACKAGE" in
          @agentclientprotocol/claude-agent-acp) node scripts/agent-probe.mjs --agent claude-code --version "$PIN_VERSION" ;;
          @agentclientprotocol/codex-acp) node scripts/agent-probe.mjs --agent codex --version "$PIN_VERSION" ;;
          opencode-ai) node scripts/agent-probe.mjs --agent opencode --version "$PIN_VERSION" ;;
          @anthropic-ai/claude-code) node scripts/agent-probe.mjs --agent claude-code --version "$(adapter @agentclientprotocol/claude-agent-acp)" --companion "$PIN_VERSION" ;;
          @openai/codex) node scripts/agent-probe.mjs --agent codex --version "$(adapter @agentclientprotocol/codex-acp)" --companion "$PIN_VERSION" ;;
          *) echo "no probe for $PIN_PACKAGE"; exit 1 ;;
        esac
      # An adapter pin needs its lockfile entry, and every pin its row's `tested`, or CI stays red.
      sync: npx --yes "$(node -p "require('./package.json').packageManager")" install --lockfile-only --ignore-scripts && node scripts/agent-tested.mjs
    secrets:
      # A PR opened with GITHUB_TOKEN starts no checks, and the bump PR exists to run them.
      token: ${{ secrets.RELEASE_PAT }}
