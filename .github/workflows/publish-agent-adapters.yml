name: Publish agent adapters

# By hand only: the package's pins move with the agent registry, not with a release.
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @prismalens/agent-adapters build
      - run: node --test packages/@prismalens/agent-adapters/scripts/pack.test.mjs
      - name: Publish
        working-directory: packages/@prismalens/agent-adapters
        run: npm publish "$(node scripts/pack.mjs | tail -1)" --access public --provenance
