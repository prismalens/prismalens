# Build / typecheck / test / lint for every PR and every push to a trunk. What a run runs is
# decided by its plan (scripts/ci-plan.mjs); the proofs a PR does not need on every push, and the
# live agent check, are in `proofs.yml` and `nightly.yml`.
#
# This is a pnpm + Turborepo monorepo (NestJS API + TanStack Start UI + a per-run
# investigation child + shared @prismalens/* packages). The jobs mirror the commands a
# contributor runs locally (see CONTRIBUTING.md).
#
# Task ordering (Prisma generate -> config build -> package builds -> typecheck)
# is encoded in turbo.json via `dependsOn`, so `pnpm build`, `pnpm typecheck`,
# and `pnpm test` each self-order from a clean checkout — no manual prerequisite
# steps needed here. Lint (Biome) only reads source, so it needs neither.
#
# Only the aggregating `CI gate` job below is wired as a REQUIRED status check —
# see .github/workflows/README.md for the full list and who publishes each. It
# fails unless every job it `needs` succeeded, so the individual jobs are enforced
# through it rather than being required one by one.
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# One build per run (#885): `build` saves turbo's cache under this run's SHA, and the
# jobs that `need` it restore it, so their `pnpm build` is a replay, not a compile.
env:
  TURBO_CACHE_DIR: ${{ github.workspace }}/.turbo-cache

jobs:
  # What this run has to run (scripts/ci-plan.mjs, #1052, #1053). `CI gate` below lets exactly the
  # jobs a plan output switches off be skipped, and only when that output is `false` in so many words.
  changes:
    name: Plan this run
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      skip: ${{ steps.plan.outputs.skip }}
      code: ${{ steps.plan.outputs.code }}
      e2e: ${{ steps.plan.outputs.e2e }}
      intake: ${{ steps.plan.outputs.intake }}
      full: ${{ steps.plan.outputs.full }}
      agents: ${{ steps.plan.outputs.agents }}
      defer: ${{ steps.plan.outputs.defer }}
      reason: ${{ steps.plan.outputs.reason }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts/ci-plan.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Plan
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          DRAFT: ${{ github.event.pull_request.draft }}
          ACTION: ${{ github.event.action }}
        run: node scripts/ci-plan.mjs

  build:
    name: Build & typecheck
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Turbo cache (saved for the jobs that need this one)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo-cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      # Manifest/exports sanity for the packages that publish to npm (R0.c).
      - name: publint (publishable packages)
        run: pnpm publint

  # Node is .nvmrc's, the engines.node floor `pl doctor` enforces (#673 s6). macOS runs nightly
  # and on a release PR (`proofs.yml`), because its PR runs flaked (#959).
  test:
    name: Unit tests (ubuntu-latest)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore the build from the build job
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo-cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      # Coverage floors (#58) run here: cli and database `test` already pass --coverage,
      # and the api's floor only evaluates under `test:cov`.
      - name: Test with coverage thresholds
        run: |
          pnpm turbo run test --filter='!@prismalens/api'
          pnpm turbo run test:cov --filter=@prismalens/api

  # Packed-artifact smoke (work-005 R0.d): pack the single published tarball
  # (prismalens — the @prismalens/* closure is bundled into it, issue #193) and
  # prove it installs + runs in a clean container — no pnpm, no monorepo, no
  # devDeps. Catches missing `files`, undeclared deps, bin/shebang wiring, ESM
  # layout, and engines bugs that monorepo-resident tests structurally cannot.
  pack:
    name: Pack npm tarball
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore the build from the build job
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo-cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - name: Agent adapters tarball
        run: |
          pnpm --filter @prismalens/agent-adapters build
          node --test packages/@prismalens/agent-adapters/scripts/pack.test.mjs packages/@prismalens/agent-adapters/scripts/bundle.test.mjs

      - name: Pack tarball
        # `pnpm pack` cannot produce this artifact: the published package carries
        # the first-party closure as bundleDependencies, and pnpm's handling of
        # those has historically diverged from npm's. The pack script builds
        # everything, generates the dependency union, and asserts the tarball —
        # and it is the SAME script the publish job runs (issue #237).
        run: |
          mkdir -p /tmp/tarballs
          node scripts/pack-cli.mjs --out /tmp/tarballs
          ls -l /tmp/tarballs

      # Path limit under the npm, installer and Scoop prefixes, size budget and licence texts
      # (#906); a second pack must give the same bytes; publint reads the packed manifests.
      - name: Gate the packed tarballs
        run: |
          node packages/@prismalens/agent-adapters/scripts/pack.mjs
          node scripts/check-artifact.mjs /tmp/tarballs/prismalens-*.tgz packages/@prismalens/agent-adapters/dist-pack/prismalens-agent-adapters-*.tgz
          node scripts/pack-cli.mjs --skip-build --out /tmp/tarballs-2
          cmp /tmp/tarballs/prismalens-*.tgz /tmp/tarballs-2/prismalens-*.tgz
          pnpm publint:packed

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-tarballs
          path: /tmp/tarballs/*.tgz
          retention-days: 3

  packed-smoke:
    name: "Tarball: installs and boots (${{ matrix.image }})"
    needs: pack
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        # node:22 is gone: the published package declares `engines.node >=24`
        # because @prismalens/api and @prismalens/database (both now INSIDE the
        # tarball) require it. `npm install --engine-strict` would refuse on 22,
        # which is the intended behaviour, not a cell worth running.
        image: ["node:24-slim"]
    container: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Deliberately narrow, so an unrelated repo change cannot fail this
          # job. refusal-gate-check.mjs is the Part A assertion sequence this
          # script shares with cross-os-app-boot.mjs (#551) — it is imported at
          # runtime, so leaving it out fails here, not at build time.
          sparse-checkout: |
            scripts/packed-smoke.sh
            scripts/lib/npm-install-retry.mjs
            packages/@prismalens/engine/scripts/refusal-gate-check.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-tarballs
          path: tarballs

      - name: Smoke the packed tarball
        run: sh scripts/packed-smoke.sh tarballs

  packed-intake:
    # Unit F on the 2026-09-13 gap study on #337 (#630), extended to the
    # unattended gate (2026-09-17): does a real alert source reach an incident
    # on the packed tarball, and does the app then investigate it on its own?
    # `packed-smoke` proves the tarball boots; this proves a webhook delivery
    # becomes an open incident, an investigation starts without a human and
    # completes with a report citing real paths, and a resolution closes the
    # incident. On PRs the harness is the scripted fake ACP agent installed as
    # `opencode` (scripts/fakes/sessions/intake.json), so a red run means the
    # code is wrong, not that a free model was slow or refused (#884). The
    # repository under investigation is a small built-in fixture (#876).
    # `PACKED_INTAKE_AGENT=live` runs the same script on the pinned OpenCode and
    # the keyless model; `packed-intake-live` below runs it that way.
    #
    # REQUIRED: in `ci-gate`'s `needs` (#920, operator ruling 2026-10-24).
    name: "Tarball: alert to incident to report, unattended"
    needs: [pack, changes]
    if: needs.changes.outputs.intake == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-tarballs
          path: tarballs

      - name: Prometheus webhook to incident, unattended investigation, and back to resolved
        env:
          PACKED_INTAKE_AGENT: fake
          PACKED_INTAKE_REPO: fixture
          PRISMALENS_HARNESS: opencode
        run: node scripts/packed-intake.mjs tarballs

  packed-upgrade-smoke:
    # An installed tarball upgrades a database that predates `investigation_turns` and
    # claims each legacy pending job with the right intent (#673), on the fake ACP agent.
    # The npm release chain (#920) runs in `proofs.yml`.
    #
    # REQUIRED: in `ci-gate`'s `needs` (#920).
    name: "Tarball: upgrades an old database"
    needs: [pack, changes]
    if: needs.changes.outputs.intake == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # The chain script needs only the root package's own dependencies (cross-spawn, semver).
      - name: Install the script's dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts --filter prismalens-monorepo

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-tarballs
          path: tarballs

      - name: Upgrade a populated database on the packed tarball
        run: node scripts/packed-upgrade-smoke.mjs tarballs

  lint:
    name: Lint (Biome)
    needs: changes
    if: needs.changes.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The UI gates read the lines a pull request adds against its base.
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Biome reads source only — no build or Prisma generate required.
      - name: Biome check (format + lint)
        run: pnpm format-and-lint

      # With `format-and-lint` above (Biome and the stylesheet look rules) this is the static UI checks
      # (`ui:check:static`), the gate on the lines a PR adds against its own base.
      - name: Static UI checks
        if: github.event_name == 'pull_request'
        run: bash packages/frontend/scripts/ui-gates.sh "origin/${{ github.base_ref }}"

      # These read scripts and workflows only, so a CI-only change is proven here without a build.
      - name: Script tests
        run: node --test scripts/pack-cli.test.mjs scripts/install/package-manifests.test.mjs scripts/lib/gate-service-sandbox.test.mjs scripts/gate-side-checks.test.mjs scripts/lib/gate-portable.test.mjs scripts/lib/upgrade-chain.test.mjs scripts/lib/app-boot-retry.test.mjs scripts/ci-plan.test.mjs scripts/ci-gate-report.test.mjs scripts/agent-probe.test.mjs scripts/check-artifact.test.mjs scripts/install/encoding.test.mjs scripts/lib/npm-install-retry.test.mjs scripts/agent-tested.test.mjs scripts/agent-adapter-sdk.test.mjs scripts/workflow-pins.test.mjs scripts/nightly-version.test.mjs

  # The `gate-scripts` job that stood here tested `.github/scripts/` — the
  # merge-gate publisher, the high-risk path matcher, and their producer-transport
  # guards. All of it was deleted with the `review-evidence` gate in #415, so the
  # directory is gone and there is nothing left for this job to run.

  # Playwright (e2e-browser.yml, called here so `CI gate` can wait on it): only when the app or the UI changed.
  e2e:
    name: E2E
    needs: [build, changes]
    if: needs.changes.outputs.e2e == 'true'
    uses: ./.github/workflows/e2e-browser.yml

  # The proofs a release PR, or a change to what they read, needs on its own commit (proofs.yml, #1052).
  proofs:
    name: Proofs
    needs: changes
    if: needs.changes.outputs.full == 'true' || needs.changes.outputs.agents == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/proofs.yml
    with:
      full: ${{ needs.changes.outputs.full == 'true' }}
      agents: ${{ needs.changes.outputs.agents == 'true' }}

  # The single aggregating required status check. The branch ruleset requires
  # THIS context instead of enumerating every job above, so adding, renaming, or
  # re-sharding a job (or a matrix leg) never rots the ruleset again.
  #
  # `if: always()` is load-bearing. Without it, a failed or skipped dependency
  # would merely SKIP this job — and GitHub counts a SKIPPED required check as
  # SUCCESS, so the gate would pass VACUOUSLY and let a broken PR merge. `always()`
  # alone is not enough either: it only guarantees the job RUNS, not that it
  # notices a red dependency. Hence the explicit assertion below, which treats
  # anything other than `success` on any needed job as red. Matrix jobs (`packed-smoke`)
  # and the called `e2e` and `proofs` contribute ONE aggregated result each — `failure`
  # if any leg failed — so every leg is still covered.
  ci-gate:
    name: CI gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - changes
      - build
      - test
      - pack
      - packed-smoke
      - packed-intake
      - packed-upgrade-smoke
      - lint
      - e2e
      - proofs
    if: always()
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts/ci-gate-report.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Assert every required job succeeded
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          echo "Needed job results:"
          echo "$NEEDS_JSON"
          # A draft release PR runs nothing (#1052); the gate stays red until it is marked ready.
          if [ "$(echo "$NEEDS_JSON" | jq -r '.changes.outputs.defer // empty')" = "true" ]; then
            echo "::error::CI gate is red on purpose: $(echo "$NEEDS_JSON" | jq -r '.changes.outputs.reason')"
            exit 1
          fi
          # A job may be skipped only when `changes` says `false` for its tier (#1052, #1053); `lint` only on `skip`.
          # An absent or other output allows no skip, and `changes` itself must succeed.
          bad=$(echo "$NEEDS_JSON" | jq -r '
            .changes.outputs as $p
            | def tier: if . == "build" or . == "test" or . == "pack" or . == "packed-smoke" then $p.code
                elif . == "packed-intake" or . == "packed-upgrade-smoke" then $p.intake
                elif . == "e2e" then $p.e2e
                elif . == "lint" then (if $p.skip == "true" then "false" else "true" end)
                elif . == "proofs" then (if $p.full == "false" and $p.agents == "false" then "false" else "true" end)
                else "true" end;
            to_entries
            | map(select(.value.result != "success"
                and ((.value.result == "skipped" and .key != "changes"
                      and (.key | tier) == "false") | not))
                | "\(.key)=\(.value.result)")
            | join(", ")')
          if [ -n "$bad" ]; then
            echo "::error::CI gate is red — these jobs did not succeed: $bad"
            # Say what kind of red each job is, so nobody reads a log for a runner shortage (#1052).
            if echo "$bad" | grep -q "=skipped"; then
              echo "A job shown as skipped did not run because a job it needs did not succeed, or the plan did not allow the skip."
            fi
            node scripts/ci-gate-report.mjs || echo "(could not list the failed jobs)"
            exit 1
          fi
          reason=$(echo "$NEEDS_JSON" | jq -r '.changes.outputs.reason // empty')
          echo "All required jobs succeeded or were skipped by the plan${reason:+: $reason}"
          node scripts/ci-gate-report.mjs || true
