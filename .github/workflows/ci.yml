# Build / typecheck / test / lint for every PR and every push to a trunk.
#
# This is a pnpm + Turborepo monorepo (NestJS API + TanStack Start UI + a BullMQ
# worker + shared @prismalens/* packages). The jobs mirror the commands a
# contributor runs locally (see CONTRIBUTING.md).
#
# Task ordering (Prisma generate -> config build -> package builds -> typecheck)
# is encoded in turbo.json via `dependsOn`, so `pnpm build`, `pnpm typecheck`,
# and `pnpm test` each self-order from a clean checkout — no manual prerequisite
# steps needed here. Lint (Biome) only reads source, so it needs neither.
#
# Only the aggregating `CI gate` job below is wired as a REQUIRED status check in
# .github/governance.json. It fails unless every job it `needs` succeeded, so the
# individual jobs are enforced through it rather than being required one by one.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      # Manifest/exports sanity for the packages that publish to npm (R0.c).
      - name: publint (publishable packages)
        run: pnpm publint

  # Fail a PR that adds a changeset naming a non-publishable package (the #178
  # silent-release-stall class: `@prismalens/cli` is not a workspace package, so
  # `changeset version` throws only on push-to-main and no Version PR ever opens).
  # Zero-dep script — Node only, no pnpm install.
  changesets:
    name: Validate changesets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Validate changeset package names
        run: node scripts/validate-changesets.mjs

  test:
    name: Test (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # engines.node is >=22 (work-005 decision 5) — prove it, and prove the
      # suite is not ubuntu-only, before the first npm release.
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

  # Packed-artifact smoke (work-005 R0.d): pack the single published tarball
  # (prismalens — the @prismalens/* closure is bundled into it, issue #193) and
  # prove it installs + runs in a clean container — no pnpm, no monorepo, no
  # devDeps. Catches missing `files`, undeclared deps, bin/shebang wiring, ESM
  # layout, and engines bugs that monorepo-resident tests structurally cannot.
  pack:
    name: Pack npm tarball
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build closure
        run: pnpm --filter prismalens... build

      - name: Pack tarball
        run: |
          mkdir -p /tmp/tarballs
          (cd packages/cli && pnpm pack --out /tmp/tarballs/%s-%v.tgz)
          ls -l /tmp/tarballs

      - uses: actions/upload-artifact@v7
        with:
          name: npm-tarballs
          path: /tmp/tarballs/*.tgz
          retention-days: 3

  packed-smoke:
    name: Packed smoke (${{ matrix.image }})
    needs: pack
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ["node:22-slim", "node:24-slim"]
    container: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts/packed-smoke.sh
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@v4
        with:
          name: npm-tarballs
          path: tarballs

      - name: Smoke the packed tarball
        run: sh scripts/packed-smoke.sh tarballs

  lint:
    name: Lint (Biome)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Biome reads source only — no build or Prisma generate required.
      - name: Biome check (format + lint)
        run: pnpm format-and-lint

      # SPDX headers on first-party source; policy in CONTRIBUTING.md.
      - name: SPDX header check
        run: pnpm spdx:check

  # The single aggregating required status check. The branch ruleset requires
  # THIS context instead of enumerating every job above, so adding, renaming, or
  # re-sharding a job (or a matrix leg) never rots the ruleset again.
  #
  # `if: always()` is load-bearing. Without it, a failed or skipped dependency
  # would merely SKIP this job — and GitHub counts a SKIPPED required check as
  # SUCCESS, so the gate would pass VACUOUSLY and let a broken PR merge. `always()`
  # alone is not enough either: it only guarantees the job RUNS, not that it
  # notices a red dependency. Hence the explicit assertion below, which treats
  # anything other than `success` on any needed job as red. Matrix jobs (`test`,
  # `packed-smoke`) contribute ONE aggregated result each — `failure` if any cell
  # failed — so every leg is still covered.
  ci-gate:
    name: CI gate
    runs-on: ubuntu-latest
    needs: [build, changesets, test, pack, packed-smoke, lint]
    if: always()
    steps:
      - name: Assert every required job succeeded
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          echo "Needed job results:"
          echo "$NEEDS_JSON"
          bad=$(echo "$NEEDS_JSON" | jq -r '
            to_entries
            | map(select(.value.result != "success") | "\(.key)=\(.value.result)")
            | join(", ")')
          if [ -n "$bad" ]; then
            echo "::error::CI gate is red — these jobs did not succeed: $bad"
            exit 1
          fi
          echo "All required jobs succeeded."
