# Build / typecheck / test / lint for every PR and every push to a trunk, and the
# live agent check on dispatch (the `live-*` jobs at the bottom).
#
# This is a pnpm + Turborepo monorepo (NestJS API + TanStack Start UI + a per-run
# investigation child + shared @prismalens/* packages). The jobs mirror the commands a
# contributor runs locally (see CONTRIBUTING.md).
#
# Task ordering (Prisma generate -> config build -> package builds -> typecheck)
# is encoded in turbo.json via `dependsOn`, so `pnpm build`, `pnpm typecheck`,
# and `pnpm test` each self-order from a clean checkout — no manual prerequisite
# steps needed here. Lint (Biome) only reads source, so it needs neither.
#
# Only the aggregating `CI gate` job below is wired as a REQUIRED status check —
# see .github/workflows/README.md for the full list and who publishes each. It
# fails unless every job it `needs` succeeded, so the individual jobs are enforced
# through it rather than being required one by one.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Merge-queue support (#403): the queue builds a speculative merge of the
  # queued PR(s) onto main and requires `CI gate` to pass on THAT commit, which
  # is what lets the ruleset drop "branch must be up to date" without letting
  # two individually-green PRs break main together. Every job in this file is
  # event-agnostic, so no job-level changes are needed — the trigger is enough.
  merge_group:
  # The live agent check (#884): only the `live-*` jobs run on dispatch; every PR job
  # above them, and `CI gate`, is skipped. It is dispatch-only because the free model
  # stalls (2 of 2 rounds timed out, #914), so a nightly would be red most nights.
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or SHA for the live agent check (default is the branch the run is dispatched on)
        required: false
        type: string

permissions:
  contents: read

# A live run on main has its own group and is never cancelled, so it and a push
# run on main cannot cancel each other.
concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && format('live-agent-{0}', inputs.ref || github.ref) || format('ci-{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

# One build per run (#885): `build` saves turbo's cache under this run's SHA, and the
# jobs that `need` it restore it, so their `pnpm build` is a replay, not a compile.
env:
  TURBO_CACHE_DIR: ${{ github.workspace }}/.turbo-cache
  # The live jobs' model: OpenCode's own free one. Their agent versions are the pins in
  # scripts/agent-pins.json, which `agent-releases.yml` moves (#639, #712, #914).
  FREE_MODEL: opencode/deepseek-v4.1-flash-free

jobs:
  build:
    name: Build & typecheck
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Turbo cache (saved for the jobs that need this one)
        uses: actions/cache@v6
        with:
          path: .turbo-cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      # packages/api/openapi.json is a committed, generated artifact (#547) — catch
      # hand-drift here instead of the next contributor discovering it months later.
      - name: OpenAPI spec drift check
        run: |
          pnpm --filter @prismalens/api openapi:generate
          if ! git diff --quiet -- packages/api/openapi.json; then
            echo "::error::packages/api/openapi.json is out of date. Run 'pnpm --filter @prismalens/api openapi:generate' and commit the result."
            git diff -- packages/api/openapi.json | head -200
            exit 1
          fi

      # Manifest/exports sanity for the packages that publish to npm (R0.c).
      - name: publint (publishable packages)
        run: pnpm publint

  test:
    name: Test (${{ matrix.os }}, Node ${{ matrix.node }})
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      # engines.node is >=24 everywhere, the floor `pl doctor` enforces (#673 s6);
      # macOS runs on the merge queue and main only, not on every PR push (#885).
      matrix:
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest"]' || '["ubuntu-latest","macos-latest"]') }}
        node: [24]
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore the build from the build job
        uses: actions/cache/restore@v6
        with:
          path: .turbo-cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      # Coverage floors (#58) run here: cli and database `test` already pass --coverage,
      # and the api's floor only evaluates under `test:cov`.
      - name: Test
        if: runner.os != 'Linux'
        run: pnpm test

      - name: Test with coverage thresholds
        if: runner.os == 'Linux'
        run: |
          pnpm turbo run test --filter='!@prismalens/api'
          pnpm turbo run test:cov --filter=@prismalens/api

  # Packed-artifact smoke (work-005 R0.d): pack the single published tarball
  # (prismalens — the @prismalens/* closure is bundled into it, issue #193) and
  # prove it installs + runs in a clean container — no pnpm, no monorepo, no
  # devDeps. Catches missing `files`, undeclared deps, bin/shebang wiring, ESM
  # layout, and engines bugs that monorepo-resident tests structurally cannot.
  pack:
    name: Pack npm tarball
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore the build from the build job
        uses: actions/cache/restore@v6
        with:
          path: .turbo-cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - name: Pack script tests
        run: node --test scripts/pack-cli.test.mjs scripts/install/package-manifests.test.mjs scripts/lib/gate-service-sandbox.test.mjs scripts/gate-side-checks.test.mjs scripts/lib/gate-portable.test.mjs scripts/lib/upgrade-chain.test.mjs scripts/lib/app-boot-retry.test.mjs scripts/agent-probe.test.mjs

      - name: Agent adapters tarball
        run: |
          pnpm --filter @prismalens/agent-adapters build
          node --test packages/@prismalens/agent-adapters/scripts/pack.test.mjs

      - name: Pack tarball
        # `pnpm pack` cannot produce this artifact: the published package carries
        # the first-party closure as bundleDependencies, and pnpm's handling of
        # those has historically diverged from npm's. The pack script builds
        # everything, generates the dependency union, and asserts the tarball —
        # and it is the SAME script the publish job runs (issue #237).
        run: |
          mkdir -p /tmp/tarballs
          node scripts/pack-cli.mjs --out /tmp/tarballs
          ls -l /tmp/tarballs

      - uses: actions/upload-artifact@v7
        with:
          name: npm-tarballs
          path: /tmp/tarballs/*.tgz
          retention-days: 3

  packed-smoke:
    name: Packed smoke (${{ matrix.image }})
    needs: pack
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        # node:22 is gone: the published package declares `engines.node >=24`
        # because @prismalens/api and @prismalens/database (both now INSIDE the
        # tarball) require it. `npm install --engine-strict` would refuse on 22,
        # which is the intended behaviour, not a cell worth running.
        image: ["node:24-slim"]
    container: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Deliberately narrow, so an unrelated repo change cannot fail this
          # job. refusal-gate-check.mjs is the Part A assertion sequence this
          # script shares with cross-os-app-boot.mjs (#551) — it is imported at
          # runtime, so leaving it out fails here, not at build time.
          sparse-checkout: |
            scripts/packed-smoke.sh
            packages/@prismalens/engine/scripts/refusal-gate-check.mjs
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@v8
        with:
          name: npm-tarballs
          path: tarballs

      - name: Smoke the packed tarball
        run: sh scripts/packed-smoke.sh tarballs

  packed-intake:
    # Unit F on the 2026-09-13 gap study on #337 (#630), extended to the
    # unattended gate (2026-09-17): does a real alert source reach an incident
    # on the packed tarball, and does the app then investigate it on its own?
    # `packed-smoke` proves the tarball boots; this proves a webhook delivery
    # becomes an open incident, an investigation starts without a human and
    # completes with a report citing real paths, and a resolution closes the
    # incident. On PRs the harness is the scripted fake ACP agent installed as
    # `opencode` (scripts/fakes/sessions/intake.json), so a red run means the
    # code is wrong, not that a free model was slow or refused (#884). The
    # repository under investigation is a small built-in fixture (#876).
    # `PACKED_INTAKE_AGENT=live` runs the same script on the pinned OpenCode and
    # the keyless model; `packed-intake-live` below runs it that way.
    #
    # REQUIRED: in `ci-gate`'s `needs` (#920, operator ruling 2026-10-24).
    name: Packed intake (Prometheus webhook -> incident -> report)
    needs: pack
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - uses: actions/download-artifact@v8
        with:
          name: npm-tarballs
          path: tarballs

      - name: Prometheus webhook to incident, unattended investigation, and back to resolved
        env:
          PACKED_INTAKE_AGENT: fake
          PACKED_INTAKE_REPO: fixture
          PRISMALENS_HARNESS: opencode
        run: node scripts/packed-intake.mjs tarballs

  packed-service:
    # `pl service` on a real systemd user manager (#732).
    # REQUIRED: in `ci-gate`'s `needs` (#920).
    name: Packed service (systemd user unit)
    needs: pack
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: actions/download-artifact@v8
        with:
          name: npm-tarballs
          path: tarballs

      - name: Install, check, restart and uninstall the service
        env:
          PRISMALENS_TELEMETRY: "off"
          PRISMALENS_UPDATE_CHECK: "off"
        run: |
          set -eu
          # A runner has no login session; lingering gives this user a systemd manager.
          sudo loginctl enable-linger "$(id -un)"
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          for _ in $(seq 1 20); do systemctl --user show-environment >/dev/null 2>&1 && break; sleep 1; done
          prefix=$(mktemp -d); ws=$(mktemp -d)
          npm install -g --prefix "$prefix" ./tarballs/prismalens-*.tgz
          export PATH="$prefix/bin:$PATH"
          pl service install --port 3190 --workspace "$ws"
          pl service status
          curl -fsS http://127.0.0.1:3190/health
          pl service restart
          curl -fsS http://127.0.0.1:3190/health
          pl service uninstall
          test ! -e "$HOME/.config/systemd/user/prismalens.service"
          if curl -fsS -m 2 http://127.0.0.1:3190/health; then echo "still serving after uninstall"; exit 1; fi
          test -f "$ws/PRISMALENS_AUTH_SECRET_FILE"

  packed-upgrade-smoke:
    # An installed tarball upgrades a database that predates `investigation_turns` and
    # claims each legacy pending job with the right intent (#673). Package script
    # `gate:packed-upgrade`; on the fake ACP agent, so a red run means the code is wrong.
    # Then every release already on npm upgrades through `pl upgrade` to this tarball
    # (`gate:upgrade-chain`, #920).
    #
    # REQUIRED: in `ci-gate`'s `needs` (#920).
    name: Packed upgrade smoke
    needs: pack
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # The chain script needs only the root package's own dependencies (cross-spawn, semver).
      - name: Install the script's dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts --filter prismalens-monorepo

      - uses: actions/download-artifact@v8
        with:
          name: npm-tarballs
          path: tarballs

      - name: Upgrade a populated database on the packed tarball
        run: node scripts/packed-upgrade-smoke.mjs tarballs

      # The versions come from `npm view prismalens versions`, never a list in this file.
      - name: Upgrade each published release to this tarball with pl upgrade
        run: node scripts/packed-upgrade-chain.mjs tarballs

  gate-side-checks:
    # The release gate's side checks (#673), scripted: telemetry, update notice, lock,
    # reset, hosts, `pl upgrade` and, on Linux, its rollback under systemd, each in a
    # throwaway HOME on the packed tarball (package script `gate:side-checks`). The same
    # script runs on all three OSes and `--no-skip` makes a SKIP a failure (#920).
    #
    # REQUIRED: in `ci-gate`'s `needs` (#920).
    name: Gate side checks (${{ matrix.os }})
    needs: pack
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # The script needs only the root package's own dependencies (a pseudo-terminal, cross-spawn).
      - name: Install the script's dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts --filter prismalens-monorepo

      - uses: actions/download-artifact@v8
        with:
          name: npm-tarballs
          path: tarballs

      - name: Give the runner user a systemd manager (Linux)
        if: runner.os == 'Linux'
        run: |
          set -eu
          sudo loginctl enable-linger "$(id -un)"
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          for _ in $(seq 1 20); do systemctl --user show-environment >/dev/null 2>&1 && break; sleep 1; done

      - name: Run the side checks
        run: |
          set -eu
          if [ "$RUNNER_OS" = "Linux" ]; then export XDG_RUNTIME_DIR="/run/user/$(id -u)"; fi
          node scripts/gate-side-checks.mjs --no-skip --tarball "$(ls tarballs/prismalens-[0-9]*.tgz | head -1)"

  harness-admission:
    # Compatibility run (ADR 0003 §10): the pinned agent is real, its model is the
    # scripted one in scripts/fakes/fake-model-server.mjs, so a red run means the code
    # is wrong and the same commit gives the same verdict (#884). The live-model run is
    # `harness-admission-live` below.
    #
    # REQUIRED: listed in `ci-gate`'s `needs`; the scripted model makes the verdict deterministic (#884).
    name: Harness admission (${{ matrix.harness }}, scripted model)
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - harness: opencode
            pin: opencode-ai
            binary: opencode
          - harness: claude-code
            pin: "@anthropic-ai/claude-code"
            binary: claude
          # The adapter is the shipped one (its pin is in agent-adapters); it runs the codex on PATH.
          - harness: codex
            pin: "@openai/codex"
            binary: codex
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the packages the engine imports
        run: pnpm --filter "@prismalens/contracts..." build

      - name: Install the pinned agent
        if: matrix.pin != ''
        env:
          PIN: ${{ matrix.pin }}
          BINARY: ${{ matrix.binary }}
        run: |
          version=$(node -p "require('./scripts/agent-pins.json').pins[process.env.PIN]")
          npm install -g "$PIN@$version" && "$BINARY" --version

      # Codex's bwrap sandbox needs unprivileged user namespaces, which ubuntu-24.04 restricts.
      - name: Allow Codex's sandbox
        if: matrix.harness == 'codex'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Run the admission (R1-R9) against the scripted model, 3 times
        run: node scripts/admission-fake.mjs "${{ matrix.harness }}" "$GITHUB_WORKSPACE" --repeat 3

      # The negative run (#848): with no gateway the model calls no PrismaLens tool, so R8 must fail the gate.
      - name: Without the gateway, the admission must fail
        if: matrix.harness == 'opencode'
        env:
          ADMISSION_NO_GATEWAY: "1"
        run: |
          if node scripts/admission-fake.mjs opencode "$GITHUB_WORKSPACE"; then
            echo "::error::the admission passed with no PrismaLens gateway; R8 is not gating"
            exit 1
          fi

  agent-replay:
    # Recorded sessions of each agent row replayed through the real engine against
    # scripts/fakes/acp-replay.mjs in strict mode (#914). A row with no recording on
    # disk is skipped with the command that records one, so nothing here needs a login.
    # Advisory until recordings exist for every tier-1 row and it has three greens.
    name: Agent replay (recorded transcripts)
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the packages the engine imports
        run: pnpm --filter "@prismalens/engine^..." build

      - name: Replay the transcripts that exist
        run: pnpm --filter @prismalens/engine test:replay

  lint:
    name: Lint (Biome)
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Biome reads source only — no build or Prisma generate required.
      - name: Biome check (format + lint)
        run: pnpm format-and-lint

  # The `gate-scripts` job that stood here tested `.github/scripts/` — the
  # merge-gate publisher, the high-risk path matcher, and their producer-transport
  # guards. All of it was deleted with the `review-evidence` gate in #415, so the
  # directory is gone and there is nothing left for this job to run.

  # Playwright (e2e.yml, called here so `CI gate` can wait on it and the merge queue runs it).
  e2e:
    name: E2E
    needs: build
    if: github.event_name != 'workflow_dispatch'
    uses: ./.github/workflows/e2e.yml

  # The single aggregating required status check. The branch ruleset requires
  # THIS context instead of enumerating every job above, so adding, renaming, or
  # re-sharding a job (or a matrix leg) never rots the ruleset again.
  #
  # `if: always()` is load-bearing. Without it, a failed or skipped dependency
  # would merely SKIP this job — and GitHub counts a SKIPPED required check as
  # SUCCESS, so the gate would pass VACUOUSLY and let a broken PR merge. `always()`
  # alone is not enough either: it only guarantees the job RUNS, not that it
  # notices a red dependency. Hence the explicit assertion below, which treats
  # anything other than `success` on any needed job as red. Matrix jobs (`test`,
  # `packed-smoke`) contribute ONE aggregated result each — `failure` if any cell
  # failed — so every leg is still covered. On a live run every need is skipped,
  # so the gate is skipped too rather than going red.
  ci-gate:
    name: CI gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - build
      - test
      - pack
      - packed-smoke
      - packed-intake
      - packed-service
      - packed-upgrade-smoke
      - gate-side-checks
      - lint
      - harness-admission
      - e2e
    if: always() && github.event_name != 'workflow_dispatch'
    steps:
      - name: Assert every required job succeeded
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          echo "Needed job results:"
          echo "$NEEDS_JSON"
          bad=$(echo "$NEEDS_JSON" | jq -r '
            to_entries
            | map(select(.value.result != "success") | "\(.key)=\(.value.result)")
            | join(", ")')
          if [ -n "$bad" ]; then
            echo "::error::CI gate is red — these jobs did not succeed: $bad"
            exit 1
          fi
          echo "All required jobs succeeded."

  # The live agent check (#884): the real pinned agent on the free model, on dispatch
  # only; advisory, and not in `ci-gate`'s `needs`. Release gate: dispatch with
  # `ref` set to the release PR's base SHA (.github/workflows/README.md).
  live-pack:
    name: Pack npm tarball (live)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Pack tarball
        run: |
          mkdir -p /tmp/tarballs
          node scripts/pack-cli.mjs --out /tmp/tarballs
          ls -l /tmp/tarballs

      - uses: actions/upload-artifact@v7
        with:
          name: live-npm-tarballs
          path: /tmp/tarballs/*.tgz
          retention-days: 3

  packed-intake-live:
    # 3 attempts, passes on at least 2 valid reports; each uploads its paged event
    # stream, the recording source for #533.
    name: Packed intake, live agent (2 of 3)
    needs: live-pack
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Install the pinned OpenCode
        run: npm install -g "opencode-ai@$(node -p "require('./scripts/agent-pins.json').pins['opencode-ai']")" && opencode --version

      - uses: actions/download-artifact@v8
        with:
          name: live-npm-tarballs
          path: tarballs

      - name: Three attempts, pass on at least two valid reports
        env:
          PACKED_INTAKE_AGENT: live
          PACKED_INTAKE_REPO: fixture
          PRISMALENS_HARNESS: opencode
          PRISMALENS_HARNESS_MODEL: ${{ env.FREE_MODEL }}
        run: |
          set -u
          mkdir -p events
          passed=0
          for n in 1 2 3; do
            echo "::group::attempt $n"
            if PACKED_INTAKE_EVENTS_OUT="$PWD/events/attempt-$n.json" \
              PACKED_INTAKE_PORT=$((3102 + n)) \
              timeout 20m node scripts/packed-intake.mjs tarballs; then
              passed=$((passed + 1))
              echo "attempt $n: valid report" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "attempt $n: no valid report" >> "$GITHUB_STEP_SUMMARY"
            fi
            echo "::endgroup::"
          done
          echo "$passed of 3 attempts completed with a valid report" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$passed" -lt 2 ]; then
            echo "::error::only $passed of 3 attempts completed with a valid report; 2 are needed"
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: intake-events-attempt-1
          path: events/attempt-1.json
          if-no-files-found: ignore
          retention-days: 30

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: intake-events-attempt-2
          path: events/attempt-2.json
          if-no-files-found: ignore
          retention-days: 30

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: intake-events-attempt-3
          path: events/attempt-3.json
          if-no-files-found: ignore
          retention-days: 30

  harness-admission-live:
    name: Harness admission, live (opencode)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the packages the engine imports
        run: pnpm --filter "@prismalens/contracts..." build

      - name: Install the pinned OpenCode
        run: npm install -g "opencode-ai@$(node -p "require('./scripts/agent-pins.json').pins['opencode-ai']")" && opencode --version

      - name: Run the admission script against this checkout
        env:
          PRISMALENS_HARNESS_MODEL: ${{ env.FREE_MODEL }}
        run: pnpm --filter @prismalens/engine exec tsx scripts/acp-admission.ts opencode "$GITHUB_WORKSPACE"
