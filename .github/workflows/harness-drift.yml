# Weekly drift check for opencode@latest against the admission gate (ADR 0003 §10).
#
# Runs weekly (Mondays 06:00 UTC) and on manual dispatch. Installs opencode-ai@latest,
# executes the unattended ACP admission run, and opens a GitHub issue if admission fails
# and an open drift issue does not already exist.
name: Harness Drift Check

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

# Serial runs, so a manual dispatch cannot race the open-issue check below.
concurrency:
  group: harness-drift
  cancel-in-progress: false

jobs:
  drift-check:
    name: Harness drift check (opencode@latest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the packages the engine imports
        run: pnpm --filter @prismalens/config --filter @prismalens/contracts build

      - name: Install the latest OpenCode
        run: npm install -g opencode-ai@latest && opencode --version

      - name: Run the admission script against this checkout
        id: admission
        continue-on-error: true
        env:
          PRISMALENS_HARNESS_MODEL: opencode/muse-spark-1.3-contributor-free
        run: |
          set -o pipefail
          pnpm --filter @prismalens/engine exec tsx scripts/acp-admission.ts opencode "$GITHUB_WORKSPACE" | tee /tmp/admission.log

      - name: Open issue on admission failure
        if: steps.admission.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          COUNT=$(gh issue list --state open --search '"harness drift: opencode@latest" in:title' --json number --jq length)
          if [ "$COUNT" -eq 0 ]; then
            INSTALLED_LINE=$(grep "installedVersion" /tmp/admission.log || echo "installedVersion: unknown")
            RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            gh issue create \
              --title "harness drift: opencode@latest fails admission" \
              --body "Automated drift check failed on $(date -u +%Y-%m-%d).

          Run URL: ${RUN_URL}
          ${INSTALLED_LINE}

          Check the run logs for full admission failure details."
          fi
          exit 1
