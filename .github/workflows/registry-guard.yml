# The registry stays generated and ratcheted (#1125): CI regenerates the manifest and
# fails on any difference, and fails when a lint or suppression count rises or goes stale.
name: Registry guard

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: registry-guard-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  guard:
    name: Registry guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: The manifest is fresh
        run: pnpm registry gen --check
      - name: The ratchet holds
        run: pnpm registry ratchet
