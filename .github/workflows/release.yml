name: Release
on:
  push:
    branches: [main]
  release:
    types: [published]
permissions:
  contents: write
  pull-requests: write
  id-token: write
concurrency: release-${{ github.ref }}
jobs:
  release-please:
    # HELD until 0.5.0 is deliberately cut. release-please opens a release PR on
    # every push to main, and merging that PR publishes to npm and cuts a GitHub
    # Release — so an open release PR is a live publish button nobody asked for.
    # Set the `RELEASE_ENABLED` repository variable to "true" to re-arm it
    # (Settings -> Secrets and variables -> Actions -> Variables); no code change
    # and no PR needed to turn it back on.
    #
    # Before 1.0 a breaking change bumps the minor version (`bump-minor-pre-major`
    # in release-please-config.json). Tags are `v<version>` from 0.5.0 on; the
    # releases before it are tagged `prismalens@<version>`.
    #
    # The `publish` job below is deliberately NOT gated: it fires on a published
    # GitHub Release, which only exists if a human deliberately made one.
    if: github.event_name == 'push' && vars.RELEASE_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.RELEASE_PAT || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
  publish:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm publint
      - run: node scripts/pack-cli.mjs --publish
