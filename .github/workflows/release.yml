name: Release
on:
  push:
    branches: [main]
  # Recovery: resume an existing draft release from its assets on (CONTRIBUTING.md, #717).
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag of the draft release to finish, e.g. v0.5.2"
        required: true
permissions:
  contents: read
concurrency: release-${{ github.ref }}
jobs:
  release-please:
    # HELD until 0.5.0 is deliberately cut. release-please opens a release PR on
    # every push to main, and merging that PR publishes to npm and cuts a GitHub
    # Release — so an open release PR is a live publish button nobody asked for.
    # Set the `RELEASE_ENABLED` repository variable to "true" to re-arm it
    # (Settings -> Secrets and variables -> Actions -> Variables); no code change
    # and no PR needed to turn it back on.
    #
    # Every release is a 0.5.x patch (`versioning: always-bump-patch` in
    # release-please-config.json); a minor needs that line changed on purpose.
    # Before 1.0 a breaking change bumps the minor version (`bump-minor-pre-major`
    # in release-please-config.json). Tags are `v<version>` from 0.5.0 on; the
    # releases before it are tagged `prismalens@<version>`.
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      created: ${{ steps.rp.outputs.release_created }}
      tag: ${{ steps.rp.outputs.tag_name }}
    steps:
      # A step-level gate: a skipped job would skip every job after it, dispatch included.
      - if: github.event_name == 'push' && vars.RELEASE_ENABLED == 'true'
        uses: googleapis/release-please-action@v5
        id: rp
        with:
          token: ${{ secrets.RELEASE_PAT || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Merging the release PR makes a DRAFT release (`draft` + `force-tag-creation` in
  # release-please-config.json). Everything below fills it, then publishes it:
  # immutable releases refuse uploads once a release is published (#717).
  draft:
    name: Resolve the draft release
    needs: release-please
    if: >-
      vars.RELEASE_ENABLED == 'true' &&
      (needs.release-please.outputs.created == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.r.outputs.tag }}
      version: ${{ steps.r.outputs.version }}
      latest: ${{ steps.r.outputs.latest }}
    steps:
      - id: r
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || needs.release-please.outputs.tag }}
        run: |
          draft=$(gh release view "$TAG" --json isDraft --jq .isDraft --repo "$GITHUB_REPOSITORY")
          if [ "$draft" != "true" ]; then echo "::error::$TAG is not a draft release"; exit 1; fi
          version="${TAG#v}"
          current=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name 2>/dev/null || true)
          case "$current" in v[0-9]*) ;; *) current="" ;; esac
          newest=$(printf '%s\n%s\n' "${current#v}" "$version" | sort -V | tail -1)
          latest=$([ "$newest" = "$version" ] && echo true || echo false)
          echo "$TAG: version $version, current latest ${current:-none}, becomes latest: $latest"
          { echo "tag=$TAG"; echo "version=$version"; echo "latest=$latest"; } >> "$GITHUB_OUTPUT"

  standalone:
    needs: draft
    uses: ./.github/workflows/standalone.yml
    with:
      release-tag: ${{ needs.draft.outputs.tag }}
    permissions:
      contents: write
      id-token: write
      attestations: write

  desktop:
    needs: draft
    uses: ./.github/workflows/desktop.yml
    with:
      release-tag: ${{ needs.draft.outputs.tag }}
    permissions:
      contents: write

  npm:
    name: Publish to npm
    needs: [draft, standalone, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - id: npm
        env:
          VERSION: ${{ needs.draft.outputs.version }}
        run: |
          if [ "$(npm view "prismalens@$VERSION" version 2>/dev/null)" = "$VERSION" ]; then
            echo "::notice::prismalens@$VERSION is already on npm; not publishing it again"
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.npm.outputs.published != 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.draft.outputs.tag }}
      - if: steps.npm.outputs.published != 'true'
        uses: pnpm/action-setup@v6
      - if: steps.npm.outputs.published != 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: steps.npm.outputs.published != 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.npm.outputs.published != 'true'
        name: Write the PrismaLens OAuth app IDs (#848)
        env:
          OAUTH_APP_GITHUB_CLIENT_ID: ${{ secrets.OAUTH_APP_GITHUB_CLIENT_ID }}
          OAUTH_APP_GITHUB_CLIENT_SECRET: ${{ secrets.OAUTH_APP_GITHUB_CLIENT_SECRET }}
          OAUTH_APP_GITLAB_CLIENT_ID: ${{ secrets.OAUTH_APP_GITLAB_CLIENT_ID }}
          OAUTH_APP_GITLAB_CLIENT_SECRET: ${{ secrets.OAUTH_APP_GITLAB_CLIENT_SECRET }}
          OAUTH_APP_BITBUCKET_CLIENT_ID: ${{ secrets.OAUTH_APP_BITBUCKET_CLIENT_ID }}
          OAUTH_APP_BITBUCKET_CLIENT_SECRET: ${{ secrets.OAUTH_APP_BITBUCKET_CLIENT_SECRET }}
        run: node scripts/write-oauth-apps.mjs
      - if: steps.npm.outputs.published != 'true'
        run: pnpm build
      - if: steps.npm.outputs.published != 'true'
        run: pnpm publint
      # An older version finished after a newer one must not take npm's `latest`.
      - if: steps.npm.outputs.published != 'true'
        env:
          DIST_TAG: ${{ needs.draft.outputs.latest == 'true' && 'latest' || 'previous' }}
        run: node scripts/pack-cli.mjs --publish --tag "$DIST_TAG"

  # npm goes first: publishing the release is what the in-app update notice reads
  # (`releases/latest`), so it must not point at a version npm lacks (#717).
  publish-release:
    name: Publish the release
    needs: [draft, npm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # A PAT, so `release: published` starts cross-os-smoke; GITHUB_TOKEN events start nothing.
      - env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT || github.token }}
          TAG: ${{ needs.draft.outputs.tag }}
          LATEST: ${{ needs.draft.outputs.latest }}
        run: gh release edit "$TAG" --draft=false "--latest=$LATEST" --repo "$GITHUB_REPOSITORY"

  package-managers:
    name: Update the Homebrew tap and Scoop bucket
    needs: [draft, publish-release]
    if: needs.draft.outputs.latest == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.draft.outputs.tag }}

      - name: Write and push the formula and manifest
        env:
          GH_TOKEN: ${{ github.token }}
          PM_TOKEN: ${{ secrets.PACKAGE_MANAGERS_TOKEN }}
          TAG: ${{ needs.draft.outputs.tag }}
        run: |
          if [ -z "$PM_TOKEN" ]; then
            echo "::notice::PACKAGE_MANAGERS_TOKEN not set; skipping the Homebrew tap and Scoop bucket"
            exit 0
          fi
          version="${TAG#v}"
          gh release download "$TAG" --pattern SHA256SUMS --dir "$RUNNER_TEMP" --repo "$GITHUB_REPOSITORY"
          node scripts/install/package-manifests.mjs --version "$version" --sums "$RUNNER_TEMP/SHA256SUMS" --out "$RUNNER_TEMP/manifests"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          publish() {
            repo="$1" src="$2" dest="$3" dir="$RUNNER_TEMP/clone-${1#*/}"
            git clone --depth 1 "https://x-access-token:${PM_TOKEN}@github.com/${repo}.git" "$dir"
            mkdir -p "$dir/$(dirname "$dest")"
            cp "$src" "$dir/$dest"
            git -C "$dir" add "$dest"
            if git -C "$dir" diff --cached --quiet; then return 0; fi
            git -C "$dir" commit -m "prismalens $version"
            git -C "$dir" push origin HEAD:main
          }
          publish prismalens/homebrew-tap "$RUNNER_TEMP/manifests/Formula/prismalens.rb" Formula/prismalens.rb
          publish prismalens/scoop-bucket "$RUNNER_TEMP/manifests/bucket/prismalens.json" bucket/prismalens.json
