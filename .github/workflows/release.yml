name: Release
on:
  push:
    branches: [main]
  # Recovery: resume an existing draft release from its assets on (docs/contributing/release-pipeline.md, #717).
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag of the draft release to finish, e.g. v0.5.2"
        required: true
permissions:
  contents: read
concurrency: release-${{ github.ref }}
jobs:
  release-please:
    # Runs only while the `RELEASE_ENABLED` repository variable is "true": an open
    # release PR is a live publish button, so unsetting the variable pauses releases.
    #
    # Every release is a 0.5.x patch (`versioning: always-bump-patch` in
    # release-please-config.json); a minor needs that line changed on purpose.
    # Before 1.0 a breaking change bumps the minor version (`bump-minor-pre-major`
    # in release-please-config.json). Tags are `v<version>` from 0.5.0 on; the
    # releases before it are tagged `prismalens@<version>`.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      created: ${{ steps.rp.outputs.release_created }}
      tag: ${{ steps.rp.outputs.tag_name }}
      pr: ${{ steps.rp.outputs.pr }}
    steps:
      # A step-level gate: a skipped job would skip every job after it, dispatch included.
      - if: github.event_name == 'push' && vars.RELEASE_ENABLED == 'true'
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: rp
        with:
          token: ${{ secrets.RELEASE_PAT || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # The release PR carries this release's snapshot of the public ACP registry; the app
  # never fetches it (#848, ADR 0003 §4). A failed fetch keeps the last bundled list.
  acp-registry:
    name: Refresh the bundled ACP registry list
    needs: release-please
    if: needs.release-please.outputs.pr != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ fromJSON(needs.release-please.outputs.pr).headBranchName }}
          token: ${{ secrets.RELEASE_PAT || github.token }}
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # The snapshot writes its JSON through the Biome this branch pins (another version rejects
      # the repo's biome.json plugins, #1020), so the root's own dependencies must be installed.
      - run: pnpm install --frozen-lockfile --ignore-scripts --filter prismalens-monorepo
      - run: node scripts/acp-registry-snapshot.mjs
      - name: Commit when it changed
        run: |
          paths=(packages/@prismalens/config/src/acp-registry.json packages/@prismalens/config/src/acp-marks.json)
          git diff --quiet -- "${paths[@]}" && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(#848): refresh the bundled ACP registry list" -- "${paths[@]}"
          git push

  # Merging the release PR makes a DRAFT release (`draft` + `force-tag-creation` in
  # release-please-config.json). Everything below fills it, then publishes it:
  # immutable releases refuse uploads once a release is published (#717).
  draft:
    name: Resolve the draft release
    needs: release-please
    if: >-
      vars.RELEASE_ENABLED == 'true' &&
      (needs.release-please.outputs.created == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.r.outputs.tag }}
      version: ${{ steps.r.outputs.version }}
      latest: ${{ steps.r.outputs.latest }}
    steps:
      - id: r
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || needs.release-please.outputs.tag }}
        run: |
          draft=$(gh release view "$TAG" --json isDraft --jq .isDraft --repo "$GITHUB_REPOSITORY")
          if [ "$draft" != "true" ]; then echo "::error::$TAG is not a draft release"; exit 1; fi
          version="${TAG#v}"
          current=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name 2>/dev/null || true)
          case "$current" in v[0-9]*) ;; *) current="" ;; esac
          newest=$(printf '%s\n%s\n' "${current#v}" "$version" | sort -V | tail -1)
          latest=$([ "$newest" = "$version" ] && echo true || echo false)
          echo "$TAG: version $version, current latest ${current:-none}, becomes latest: $latest"
          { echo "tag=$TAG"; echo "version=$version"; echo "latest=$latest"; } >> "$GITHUB_OUTPUT"

  standalone:
    needs: draft
    uses: ./.github/workflows/build-standalone-cli.yml
    with:
      release-tag: ${{ needs.draft.outputs.tag }}
    permissions:
      contents: write

  desktop:
    needs: draft
    uses: ./.github/workflows/build-desktop-app.yml
    with:
      release-tag: ${{ needs.draft.outputs.tag }}
    permissions:
      contents: write

  # One SHA256SUMS over every asset on the draft, and one build-provenance attestation
  # over it: `gh attestation verify <asset> --repo prismalens/prismalens` (#906).
  sums:
    name: Checksums and provenance
    needs: [draft, standalone, desktop]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.draft.outputs.tag }}
          persist-credentials: false
      - name: Download every asset
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.draft.outputs.tag }}
        run: gh release download "$TAG" -p 'prismalens-*' -p 'PrismaLens-*' -p install.sh -p install.ps1 -D assets --repo "$GITHUB_REPOSITORY"
      - name: Write SHA256SUMS
        run: cd assets && sha256sum $(ls | LC_ALL=C sort) > SHA256SUMS && cat SHA256SUMS
      # npm's launcher downloads these, so a release missing one never reaches npm (#717).
      - name: Every archive is attached and in SHA256SUMS
        env:
          VERSION: ${{ needs.draft.outputs.version }}
        run: node scripts/release-complete.mjs --dir assets "$VERSION"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: assets/SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: assets/SHA256SUMS
      - name: Upload SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.draft.outputs.tag }}
        run: gh release upload "$TAG" assets/SHA256SUMS --clobber --repo "$GITHUB_REPOSITORY"

  # The release publishes first: npm's launcher downloads from it, and a draft's assets are not public (#717).
  publish-release:
    name: Publish the release
    needs: [draft, sums]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # One release promotes at a time across every ref, and `latest` is decided then, not when
    # the draft was made: a newer release that published meanwhile keeps it (#717).
    concurrency:
      group: release-promotion
      cancel-in-progress: false
    permissions:
      contents: write
    outputs:
      latest: ${{ steps.latest.outputs.latest }}
    steps:
      - id: latest
        name: Is this the newest release now
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.draft.outputs.version }}
        run: |
          current=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name 2>/dev/null || true)
          case "$current" in v[0-9]*) ;; *) current="" ;; esac
          newest=$(printf '%s\n%s\n' "${current#v}" "$VERSION" | sort -V | tail -1)
          latest=$([ "$newest" = "$VERSION" ] && echo true || echo false)
          echo "$VERSION: current latest ${current:-none}, becomes latest: $latest"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
      # A PAT, so `release: published` starts cross-os-smoke; GITHUB_TOKEN events start nothing.
      - env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT || github.token }}
          TAG: ${{ needs.draft.outputs.tag }}
          LATEST: ${{ steps.latest.outputs.latest }}
        run: gh release edit "$TAG" --draft=false "--latest=$LATEST" --repo "$GITHUB_REPOSITORY"

  npm:
    name: Publish to npm
    needs: [draft, publish-release]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # One npm publish at a time across every ref, from reading npm's `latest` to publishing,
    # so two releases never both read the old `latest` and the older one takes it (#717).
    concurrency:
      group: release-npm
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - id: npm
        env:
          VERSION: ${{ needs.draft.outputs.version }}
        run: |
          if [ "$(npm view "prismalens@$VERSION" version 2>/dev/null)" = "$VERSION" ]; then
            echo "::notice::prismalens@$VERSION is already on npm; not publishing it again"
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.npm.outputs.published != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.draft.outputs.tag }}
      - if: steps.npm.outputs.published != 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      # pack-launcher refuses unless the release downloads, anonymously, complete and matching
      # SHA256SUMS. An older version finished after a newer one must not take npm's `latest`;
      # provenance is required, so a publish that cannot make it fails closed (#906).
      - if: steps.npm.outputs.published != 'true'
        env:
          LATEST: ${{ needs.publish-release.outputs.latest }}
          VERSION: ${{ needs.draft.outputs.version }}
          NPM_CONFIG_PROVENANCE: "true"
          GH_TOKEN: ""
        run: |
          # npm's own `latest`, read now: a newer version published meanwhile keeps it.
          npm_latest=$(npm view prismalens@latest version 2>/dev/null || true)
          newest=$(printf '%s\n%s\n' "$npm_latest" "$VERSION" | sort -V | tail -1)
          tag=previous
          if [ "$LATEST" = true ] && [ "$newest" = "$VERSION" ]; then tag=latest; fi
          node scripts/pack-launcher.mjs --publish --tag "$tag"

  package-managers:
    name: Update the Homebrew tap and Scoop bucket
    needs: [draft, publish-release]
    if: needs.publish-release.outputs.latest == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.draft.outputs.tag }}

      - name: Write and push the formula and manifest
        env:
          GH_TOKEN: ${{ github.token }}
          PM_TOKEN: ${{ secrets.PACKAGE_MANAGERS_TOKEN }}
          TAG: ${{ needs.draft.outputs.tag }}
        run: |
          if [ -z "$PM_TOKEN" ]; then
            echo "::error::PACKAGE_MANAGERS_TOKEN is not set, so the Homebrew tap and Scoop bucket stay on the old version. Set it and re-run this job (RELEASING.md)."
            exit 1
          fi
          version="${TAG#v}"
          gh release download "$TAG" --pattern SHA256SUMS --dir "$RUNNER_TEMP" --repo "$GITHUB_REPOSITORY"
          node scripts/install/package-manifests.mjs --version "$version" --sums "$RUNNER_TEMP/SHA256SUMS" --out "$RUNNER_TEMP/manifests"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          publish() {
            repo="$1" src="$2" dest="$3" dir="$RUNNER_TEMP/clone-${1#*/}"
            git clone --depth 1 "https://x-access-token:${PM_TOKEN}@github.com/${repo}.git" "$dir"
            mkdir -p "$dir/$(dirname "$dest")"
            cp "$src" "$dir/$dest"
            git -C "$dir" add "$dest"
            if git -C "$dir" diff --cached --quiet; then return 0; fi
            git -C "$dir" commit -m "prismalens $version"
            git -C "$dir" push origin HEAD:main
          }
          publish prismalens/homebrew-tap "$RUNNER_TEMP/manifests/Formula/prismalens.rb" Formula/prismalens.rb
          publish prismalens/scoop-bucket "$RUNNER_TEMP/manifests/bucket/prismalens.json" bucket/prismalens.json

  # The real tap and bucket, as a user meets them (#920). The standalone workflow smokes a
  # formula and manifest built beside the archives; only this installs what was pushed.
  verify-install:
    name: Install from the real ${{ matrix.manager }}
    needs: [draft, publish-release, package-managers]
    if: needs.publish-release.outputs.latest == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            manager: Homebrew tap
          - os: windows-latest
            manager: Scoop bucket
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.draft.outputs.version }}
    steps:
      - name: brew install prismalens/tap/prismalens
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          set -eu
          brew install prismalens/tap/prismalens
          out=$("$(brew --prefix)/bin/pl" --version)
          [ "$out" = "$VERSION" ] || { echo "::error::pl --version printed $out, expected $VERSION"; exit 1; }
          brew test prismalens/tap/prismalens
          brew uninstall prismalens

      - name: scoop install prismalens
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-RestMethod https://raw.githubusercontent.com/ScoopInstaller/Install/1e2f334083d609986d8c8bc9e31ae8e87c39fab4/install.ps1 -OutFile "$env:RUNNER_TEMP\install-scoop.ps1"
          & "$env:RUNNER_TEMP\install-scoop.ps1" -RunAsAdmin
          $env:Path = "$env:USERPROFILE\scoop\shims;$env:Path"
          scoop bucket add prismalens https://github.com/prismalens/scoop-bucket
          scoop install prismalens
          if ($LASTEXITCODE -ne 0) { Write-Error "scoop install failed"; exit 1 }
          $out = (pl --version).Trim()
          if ($out -ne $env:VERSION) { Write-Error "pl --version printed $out, expected $env:VERSION"; exit 1 }
          scoop uninstall prismalens
