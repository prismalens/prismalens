# What the agents we support have released (#914): a zero-token protocol probe of each row's
# latest version on Linux, Windows and macOS, and a pull request that moves a pin once its release
# has soaked 3 days. The probe installs from each row's install-hint channel and starts the agent
# through @prismalens/agent-host, as the product does (#1013). Neither spends a model call, and
# neither is required by `CI gate`.
name: Agent releases (probe and pin bumps)

on:
  schedule:
    - cron: "23 3 * * *" # 03:23 UTC daily, on the default branch
  workflow_dispatch:
    inputs:
      file-issues:
        description: "File or update the `Agent probe failing` issue for a red leg, as a scheduled run does"
        type: boolean
        default: false
      agent:
        description: "Bump only this agent (its folder under providers/src/agent); empty bumps every agent"
        type: string
        default: ""
      dry-run:
        description: "Run each bump's candidate and conformance legs, then report the verdict without opening a PR"
        type: boolean
        default: false
  # A change to the probe, or to how an agent starts, runs the probe before it merges.
  pull_request:
    paths:
      - ".github/workflows/agent-release-watch.yml"
      - "scripts/agent-probe.mjs"
      - "scripts/agent-pins.mjs"
      - "scripts/agent-bump.mjs"
      - ".github/workflows/agent-bump.yml"
      - "scripts/agent-locks.mjs"
      - "scripts/agent-locks/**"
      - "packages/@prismalens/agent-host/src/registry/agents.ts"
      - "packages/@prismalens/agent-host/src/registry/agents/**"
      - "packages/@prismalens/agent-host/src/registry/row.ts"
      - "packages/@prismalens/agent-host/src/registry/facts.ts"
      - "scripts/agent-facts.mjs"
      - "packages/@prismalens/agent-host/src/probe.ts"
      - "packages/@prismalens/agent-host/src/launch.ts"
      - "packages/@prismalens/agent-host/src/process.ts"
      - "packages/@prismalens/config/src/providers/harness.ts"
      - "packages/@prismalens/providers/src/agent/**"
      - "packages/@prismalens/providers/src/agents.ts"
      - "scripts/sync-models.mjs"
      - "packages/@prismalens/agent-adapters/**"

permissions:
  contents: read

concurrency:
  group: agent-releases-${{ github.event_name == 'pull_request' && github.ref || 'default' }}
  # A PR push supersedes its earlier probe; the nightly and dispatch runs are never cancelled (#1052).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  probe:
    name: Protocol probe (${{ matrix.os }})
    if: github.repository == 'prismalens/prismalens'
    strategy:
      fail-fast: false
      matrix:
        # A PR probes on Linux only; the nightly runs all three.
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest"]' || '["ubuntu-latest","windows-latest","macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    # This job runs freshly published packages and their install scripts: read-only, no issue token.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The deepagents row installs with uv, which fetches the Python 3.14 it needs.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Build the registry, the agent host and the adapters PrismaLens ships
        run: pnpm --filter "@prismalens/config..." --filter @prismalens/agent-adapters build

      # initialize and session/new only: the agents run unauthenticated and see no model.
      - name: Probe every row at its channel's latest release, and at its pin
        shell: bash
        env:
          FAILURES: ${{ runner.temp }}/probe-failures-${{ matrix.os }}.tsv
        run: |
          : > "$FAILURES"
          node scripts/agent-probe.mjs --all --failures "$FAILURES"

      # The OS is in the file name: one artifact downloads flat, with no folder named after it.
      - name: Keep the failing rows for the report job
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: probe-failures-${{ matrix.os }}
          path: ${{ runner.temp }}/probe-failures-${{ matrix.os }}.tsv
          if-no-files-found: ignore
          retention-days: 7

  # Each registry fact's `verifiedAt` against the pins: red when a pin moved past a fact nobody
  # re-read. The pin-bump PR moves probed facts itself; source-read ones need a person (#1101).
  facts:
    name: agent facts not re-verified
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter "@prismalens/config..." --filter "@prismalens/registry..."
      - run: pnpm --filter "@prismalens/config..." build
      - run: node scripts/agent-facts.mjs check

  # The harness registry's models, makers and ACP agents with their marks (#1101): one rolling PR when they change.
  models:
    name: Model catalogue
    if: >-
      github.repository == 'prismalens/prismalens' && github.event_name != 'pull_request' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A PR pushed with GITHUB_TOKEN starts no checks, and this PR exists to run them.
          token: ${{ secrets.RELEASE_PAT }}
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # The root's own dependencies: the snapshot writes its JSON through Biome.
      - run: pnpm install --frozen-lockfile --ignore-scripts --filter prismalens-monorepo
      - run: node scripts/sync-models.mjs && node scripts/acp-registry-snapshot.mjs
      - name: Open or update the catalogue PR
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
        run: |
          paths=(packages/@prismalens/config/src/providers/model-catalogue.json packages/@prismalens/config/src/providers/model-makers.json packages/@prismalens/config/src/acp-registry.json packages/@prismalens/config/src/acp-marks.json)
          if git diff --quiet -- "${paths[@]}"; then echo "models.dev unchanged"; exit 0; fi
          branch=chore/model-catalogue
          git config user.name "github-actions[bot]"
          git config user.email "41898729+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -m "chore(config): model catalogue from models.dev" -- "${paths[@]}"
          git push --force origin "$branch"
          gh pr view "$branch" --json number >/dev/null 2>&1 || gh pr create --head "$branch" \
            --title "chore(config): model catalogue from models.dev" \
            --body "The nightly scripts/sync-models.mjs run: each harness's models and makers from models.dev changed (#1101)."

  # Files the issues from the probe's results alone: it checks out and runs nothing it was given.
  report:
    name: Report failing agents
    needs: probe
    if: >-
      always() && github.repository == 'prismalens/prismalens' &&
      (github.event_name == 'schedule' || inputs.file-issues)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/actions
            scripts
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: probe-failures-*
          path: failures
          merge-multiple: true

      # One open issue per agent and OS, found by its exact title; a red night rewrites its body and a green
      # one closes it. Artifact fields are data: scripts/agent-report-rows.mjs allowlists them, and the
      # action passes them to gh as arguments, never through a shell.
      - name: Build one report per failing agent
        env:
          GH_TOKEN: ${{ github.token }}
          PROBE_RESULT: ${{ needs.probe.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          mkdir -p failures
          node scripts/agent-report-rows.mjs failures "$PROBE_RESULT" "$RUN_URL" > "$RUNNER_TEMP/batch.json"

      - uses: ./.github/actions/report-failure
        with:
          ok: "false"
          batch: ${{ runner.temp }}/batch.json

  # One bump per agent (#1082 P1): each runs its own candidate, conformance legs and publish gate,
  # so one agent's break holds only that agent.
  agents:
    name: Agents with a pin
    if: >-
      github.repository == 'prismalens/prismalens' && github.event_name != 'pull_request' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      list: ${{ steps.list.outputs.list }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: list
        env:
          ONLY: ${{ inputs.agent }}
        run: |
          if [ -n "$ONLY" ]; then list=$(node -e 'console.log(JSON.stringify([process.argv[1]]))' "$ONLY"); else list=$(node scripts/agent-bump.mjs matrix); fi
          echo "list=$list" >> "$GITHUB_OUTPUT"

  bump:
    name: Pin bump
    needs: agents
    strategy:
      fail-fast: false
      matrix:
        agent: ${{ fromJSON(needs.agents.outputs.list) }}
    uses: ./.github/workflows/agent-bump.yml
    permissions:
      contents: read
      issues: write
    with:
      agent: ${{ matrix.agent }}
      dry-run: ${{ inputs.dry-run == true }}
    secrets:
      # A PR opened with GITHUB_TOKEN starts no checks, and the bump PR exists to run them.
      token: ${{ secrets.RELEASE_PAT }}
