# Mutation testing: StrykerJS breaks the guarded code and checks a test goes red.
#
# Weekly and on demand, never on PRs: a full run takes hours. Scoped to the
# permission policy, device pairing, the API's guards and dispatch, where a test
# that cannot fail costs the most. A survived mutant is reported, not failed.
name: Mutation testing

on:
  schedule:
    - cron: "0 3 * * 0" # Sundays 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mutate:
    name: stryker (${{ matrix.package }})
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        package: ["@prismalens/engine", "@prismalens/auth", "@prismalens/api"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build what the package imports
        run: pnpm turbo run build --filter="${{ matrix.package }}^..."

      - name: Run Stryker
        run: pnpm --filter "${{ matrix.package }}" exec stryker run

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-${{ strategy.job-index }}
          path: packages/**/reports/mutation/
          if-no-files-found: ignore
