# Mutation testing: StrykerJS breaks the guarded code and checks a test goes red.
#
# Weekly and on demand, never on PRs: a full run takes hours. Scoped to the
# permission policy, device pairing, the API's guards and dispatch, where a test
# that cannot fail costs the most. A survived mutant is reported, not failed.
name: Mutation testing

on:
  schedule:
    - cron: "0 3 * * 0" # Sundays 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mutate:
    name: stryker (${{ matrix.package }}${{ matrix.shard && format(', {0}', matrix.shard) || '' }})
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      # The api's ~6,900 mutants take ~34 h on one runner (#1154): each shard names a slice of the
      # config's `mutate`, sized to about 3 h; a file's last range is open-ended, so the slices cover it whole.
      # Stryker mutates a node only inside one range, so each cut sits between class members: a cut inside a
      # body would drop that body's own mutants. Re-cut by listing a file's mutants against its ranges (#1197).
      matrix:
        include:
          - package: "@prismalens/engine"
          - package: "@prismalens/auth"
          - package: "@prismalens/api"
            shard: "guards, dispatch 1"
            mutate: "src/middlewares/host-allowlist.middleware.ts,src/core/auth/auth.guard.ts,src/core/auth/owner.ts,src/infrastructure/dispatch/in-process-runner.ts,src/infrastructure/dispatch/checkout-status.ts,src/infrastructure/dispatch/event-bus.ts,src/infrastructure/dispatch/restart-recovery.ts"
          - package: "@prismalens/api"
            shard: "dispatch 2"
            mutate: "src/infrastructure/dispatch/folder-lock.ts,src/infrastructure/dispatch/dispatcher.ts,src/infrastructure/dispatch/run-ports.ts"
          - package: "@prismalens/api"
            shard: "dispatch 3"
            mutate: "src/infrastructure/dispatch/prisma-investigation-store.ts,src/infrastructure/dispatch/checkout-lease.ts,src/infrastructure/dispatch/job-store.ts"
          - package: "@prismalens/api"
            shard: "harness-receipt"
            mutate: "src/infrastructure/dispatch/harness-receipt.ts"
          - package: "@prismalens/api"
            shard: "dispatch rest"
            mutate: "src/infrastructure/dispatch/**/*.ts,!src/**/*.spec.ts,!src/infrastructure/dispatch/in-process-runner.ts,!src/infrastructure/dispatch/checkout-status.ts,!src/infrastructure/dispatch/event-bus.ts,!src/infrastructure/dispatch/restart-recovery.ts,!src/infrastructure/dispatch/folder-lock.ts,!src/infrastructure/dispatch/dispatcher.ts,!src/infrastructure/dispatch/run-ports.ts,!src/infrastructure/dispatch/prisma-investigation-store.ts,!src/infrastructure/dispatch/checkout-lease.ts,!src/infrastructure/dispatch/job-store.ts,!src/infrastructure/dispatch/dispatch.service.ts,!src/infrastructure/dispatch/investigation-run.ts,!src/infrastructure/dispatch/harness-receipt.ts"
          - package: "@prismalens/api"
            shard: "dispatch.service 1"
            mutate: "src/infrastructure/dispatch/dispatch.service.ts:1-857"
          - package: "@prismalens/api"
            shard: "dispatch.service 2"
            mutate: "src/infrastructure/dispatch/dispatch.service.ts:858-1264"
          - package: "@prismalens/api"
            shard: "dispatch.service 3"
            mutate: "src/infrastructure/dispatch/dispatch.service.ts:1265-1636"
          - package: "@prismalens/api"
            shard: "dispatch.service 4"
            mutate: "src/infrastructure/dispatch/dispatch.service.ts:1637-2215"
          - package: "@prismalens/api"
            shard: "dispatch.service 5"
            mutate: "src/infrastructure/dispatch/dispatch.service.ts:2216-99999"
          - package: "@prismalens/api"
            shard: "investigation-run 1"
            mutate: "src/infrastructure/dispatch/investigation-run.ts:1-724"
          - package: "@prismalens/api"
            shard: "investigation-run 2"
            mutate: "src/infrastructure/dispatch/investigation-run.ts:725-1050"
          - package: "@prismalens/api"
            shard: "investigation-run 3"
            mutate: "src/infrastructure/dispatch/investigation-run.ts:1051-1664"
          - package: "@prismalens/api"
            shard: "investigation-run 4"
            mutate: "src/infrastructure/dispatch/investigation-run.ts:1665-2064"
          - package: "@prismalens/api"
            shard: "investigation-run 5"
            mutate: "src/infrastructure/dispatch/investigation-run.ts:2065-2610"
          - package: "@prismalens/api"
            shard: "investigation-run 6"
            mutate: "src/infrastructure/dispatch/investigation-run.ts:2611-3010"
          - package: "@prismalens/api"
            shard: "investigation-run 7"
            mutate: "src/infrastructure/dispatch/investigation-run.ts:3011-99999"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build what the package imports
        run: pnpm turbo run build --filter="${{ matrix.package }}^..."

      - name: Run Stryker
        env:
          MUTATE: ${{ matrix.mutate }}
          # A mutant that allocates without end crashes its own worker, not the runner (#1154).
          NODE_OPTIONS: --max-old-space-size=3072
        # Its own PID namespace (#1154): a mutant that signals every process it can list (the
        # harness receipt's sweep) reaches only Stryker's tree, never the runner's agent.
        run: >-
          sudo -E unshare --pid --fork --mount-proc --kill-child
          sudo -E -u "$(id -un)" env "PATH=$PATH"
          pnpm --filter "${{ matrix.package }}" exec stryker run ${MUTATE:+--mutate "$MUTATE"}

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-${{ strategy.job-index }}
          path: packages/**/reports/mutation/
          if-no-files-found: ignore
