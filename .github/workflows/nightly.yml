# Everything that proves the product against the outside world or on other machines, once a night:
# the release proofs (`proofs.yml`) and the real pinned agent on its free model (the `Live:` jobs).
# Nothing here is a required check; a red night opens or updates one tracking issue (`report`).
# Release gate: dispatch on `main` with `ref` set to the release PR's base SHA (README.md).
name: Nightly

on:
  schedule:
    - cron: "47 3 * * *"
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or SHA to prove (default is the branch the run is dispatched on)
        required: false
        type: string
      report:
        description: Let the tracking-issue job change issues; off, it only prints what it would do
        required: false
        type: boolean
        default: false
      live:
        description: Also run the live agent check on the free model (a scheduled night always does)
        required: false
        type: boolean
        default: false
      publish:
        description: Publish this run as the nightly once its proofs pass (main only, no ref)
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && format('nightly-{0}', inputs.ref || github.ref) || 'nightly' }}
  cancel-in-progress: false

env:
  # The live jobs' model: OpenCode's own free one. Their agent versions are the pins in
  # scripts/agent-pins.json, which `agent-release-watch.yml` moves (#639, #712, #914).
  FREE_MODEL: opencode/deepseek-v4.1-flash-free

jobs:
  # The schedule stays off until the repository variable NIGHTLY_ENABLED is "true", as RELEASE_ENABLED holds the release.
  proofs:
    name: Proofs
    if: github.event_name == 'workflow_dispatch' || vars.NIGHTLY_ENABLED == 'true'
    uses: ./.github/workflows/proofs.yml
    with:
      ref: ${{ inputs.ref }}

  # Main's head as `<next patch>-nightly.<date>.<run>` (#1024): a draft prerelease gets the standalone archives and
  # SHA256SUMS, then publishes. npm carries stable launchers only; they switch to a nightly in the app (#717).
  # Off until NIGHTLY_PUBLISH is "true" (RELEASING.md).
  nightly-draft:
    name: Draft the nightly
    needs: proofs
    if: >-
      needs.proofs.result == 'success' && github.ref == 'refs/heads/main' && !inputs.ref &&
      ((github.event_name == 'schedule' && vars.NIGHTLY_PUBLISH == 'true') ||
      (github.event_name == 'workflow_dispatch' && inputs.publish))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: nightly-publish
      cancel-in-progress: false
    permissions:
      contents: write
    outputs:
      build: ${{ steps.draft.outputs.build }}
      version: ${{ steps.version.outputs.version }}
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      # The newest nightly's commit must be behind this one: an older commit would publish older code as newer.
      - name: Is there anything new since the last nightly
        id: since
        run: |
          set -euo pipefail
          prev=$(gh release list -R "$REPO" --limit 100 --json tagName,isPrerelease,isDraft \
            --jq '[.[] | select(.isPrerelease and (.isDraft | not) and (.tagName | contains("-nightly.")))][0].tagName // empty')
          echo "prev=$prev" >> "$GITHUB_OUTPUT"
          if [ -n "$prev" ]; then
            prev_sha=$(gh api "repos/$REPO/commits/$prev" --jq .sha)
            if [ "$prev_sha" = "$SHA" ]; then
              echo "::notice::$prev already is $SHA; nothing to publish"
              echo "new=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git merge-base --is-ancestor "$prev_sha" "$SHA" || { echo "::error::$SHA is not ahead of $prev ($prev_sha)"; exit 1; }
          fi
          # Nightlies live on GitHub only (#717): the newest published one orders the next version.
          echo "above=${prev#v}" >> "$GITHUB_OUTPUT"
          echo "new=true" >> "$GITHUB_OUTPUT"

      - if: steps.since.outputs.new == 'true'
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - if: steps.since.outputs.new == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: steps.since.outputs.new == 'true'
        run: pnpm install --frozen-lockfile

      # The run's creation date and number, so a re-run of this run computes the same version.
      - name: Version
        id: version
        if: steps.since.outputs.new == 'true'
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
          ABOVE: ${{ steps.since.outputs.above }}
        run: |
          set -euo pipefail
          date=$(gh api "repos/$REPO/actions/runs/$RUN_ID" --jq .created_at | cut -c1-10 | tr -d -)
          version=$(node scripts/nightly-version.mjs --stable "$(jq -r '."."' .release-please-manifest.json)" \
            --date "$date" --run "$RUN_NUMBER" ${ABOVE:+--above "$ABOVE"} --write packages/cli/package.json)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Nightly $version from $SHA" >> "$GITHUB_STEP_SUMMARY"

      # The tag first: build-standalone-cli.yml checks it out, and a draft alone creates none.
      - name: Draft the prerelease
        id: draft
        if: steps.since.outputs.new == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PREV: ${{ steps.since.outputs.prev }}
        run: |
          set -eu
          if [ "$(gh release view "v$VERSION" -R "$REPO" --json isDraft --jq .isDraft 2>/dev/null)" = false ]; then
            echo "::notice::v$VERSION is already published"
            exit 0
          fi
          gh api "repos/$REPO/git/refs/tags/v$VERSION" >/dev/null 2>&1 ||
            gh api "repos/$REPO/git/refs" -f ref="refs/tags/v$VERSION" -f sha="$SHA" >/dev/null
          if ! gh release view "v$VERSION" -R "$REPO" >/dev/null 2>&1; then
            {
              echo "A build of main at $SHA, published because that night's proofs passed. It may migrate a workspace past the last stable release."
              echo
              echo "Install the stable release (\`npm install -g prismalens\`), then switch with \`pl upgrade --channel nightly\`."
              [ -z "$PREV" ] || { echo; echo "Changes since $PREV: https://github.com/$REPO/compare/$PREV...$SHA"; }
            } > "$RUNNER_TEMP/notes.md"
            gh release create "v$VERSION" -R "$REPO" --draft --prerelease --latest=false --verify-tag \
              --title "Nightly $VERSION" --notes-file "$RUNNER_TEMP/notes.md"
          fi
          echo "build=true" >> "$GITHUB_OUTPUT"

  nightly-standalone:
    name: Nightly archives
    needs: nightly-draft
    if: needs.nightly-draft.outputs.build == 'true'
    uses: ./.github/workflows/build-standalone-cli.yml
    with:
      release-tag: v${{ needs.nightly-draft.outputs.version }}
      version: ${{ needs.nightly-draft.outputs.version }}
    permissions:
      contents: write

  nightly-sums:
    name: Nightly checksums
    needs: [nightly-draft, nightly-standalone]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: v${{ needs.nightly-draft.outputs.version }}
      VERSION: ${{ needs.nightly-draft.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Download the archives
        run: gh release download "$TAG" -p 'prismalens-*' -p install.sh -p install.ps1 -D assets -R "$GITHUB_REPOSITORY"
      - name: Write SHA256SUMS
        run: cd assets && sha256sum $(ls | LC_ALL=C sort) > SHA256SUMS && cat SHA256SUMS
      # The launcher downloads these, so a nightly missing one is never published (#717).
      - name: Every archive is attached and in SHA256SUMS
        run: node scripts/release-complete.mjs --dir assets "$VERSION"
      - name: Upload SHA256SUMS
        run: gh release upload "$TAG" assets/SHA256SUMS --clobber -R "$GITHUB_REPOSITORY"

  publish:
    name: Publish the nightly
    needs: [nightly-draft, nightly-sums]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      VERSION: ${{ needs.nightly-draft.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts --filter prismalens-monorepo

      - name: Publish the prerelease
        run: gh release edit "v$VERSION" -R "$REPO" --draft=false --prerelease --latest=false

      # As a launcher sees it: no token, every archive downloaded and hashed against SHA256SUMS (#717).
      - name: The published prerelease is complete to a stranger
        env:
          GH_TOKEN: ""
        run: node scripts/release-complete.mjs --public "v$VERSION" "$VERSION"

      # Never a stable release, a draft, or a tag a published launcher names (scripts/prune-nightlies.mjs).
      - name: Keep the newest 10 nightly prereleases
        run: node scripts/prune-nightlies.mjs --keep 10

  # One issue holds every red night: found by its exact title, open or closed, so a recurrence reopens it
  # and a green night closes it. A cancelled or skipped `proofs`, or a failed `publish`, counts as red.
  report:
    name: Nightly tracking issue
    needs: [proofs, nightly-draft, nightly-standalone, nightly-sums, publish, live-pack, packed-intake-live, harness-admission-live]
    if: always() && (github.event_name == 'workflow_dispatch' || vars.NIGHTLY_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: nightly-report
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
      actions: read
    steps:
      # The first failed or cancelled publication stage is the publish result; else publish's own.
      - name: Publication result
        id: publication
        env:
          STAGES: ${{ needs.nightly-draft.result }} ${{ needs.nightly-standalone.result }} ${{ needs.nightly-sums.result }}
          PUBLISH: ${{ needs.publish.result }}
        run: |
          for stage in $STAGES; do
            case "$stage" in failure | cancelled) PUBLISH=$stage; break ;; esac
          done
          echo "result=$PUBLISH" >> "$GITHUB_OUTPUT"
      - name: Open, update or close the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_ID: ${{ github.run_id }}
          PROOFS: ${{ needs.proofs.result }}
          PUBLISH: ${{ steps.publication.outputs.result }}
          LIVE: ${{ needs.live-pack.result }} ${{ needs.packed-intake-live.result }} ${{ needs.harness-admission-live.result }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.report != true }}
        run: |
          set -eu
          # A dry run says what it would do, in the job summary, and touches no issue.
          act() {
            if [ "$DRY_RUN" = true ]; then
              { echo "Dry run, would run: $*"; [ ! -f "$body" ] || cat "$body"; } | tee -a "$GITHUB_STEP_SUMMARY"
            else
              "$@"
            fi
          }
          body="$RUNNER_TEMP/nightly-body.md"
          title="Nightly CI failing"
          found=$(gh issue list -R "$REPO" --state all --limit 100 --search "\"$title\" in:title" --json number,title,state)
          open=$(echo "$found" | jq -r --arg t "$title" '[.[] | select(.title == $t and .state == "OPEN")][0].number // empty')
          closed=$(echo "$found" | jq -r --arg t "$title" '[.[] | select(.title == $t and .state == "CLOSED")][0].number // empty')
          live_red=false
          for job in $LIVE; do case "$job" in failure | cancelled) live_red=true ;; esac; done
          if [ "$PROOFS" = success ] && [ "$PUBLISH" != failure ] && [ "$PUBLISH" != cancelled ] && [ "$live_red" = false ]; then
            if [ -n "$open" ]; then
              act gh issue close "$open" -R "$REPO" --comment "The nightly proofs passed: $RUN_URL"
            fi
            exit 0
          fi
          failed=$(gh api "repos/$REPO/actions/runs/$RUN_ID/jobs" --paginate --jq '.jobs[] | select(.conclusion != null and .conclusion != "success" and .conclusion != "skipped" and .name != "Nightly tracking issue") | "- \(.name): \(.conclusion) \(.html_url)"')
          {
            echo "The nightly proofs ended \`$PROOFS\`, its publish \`$PUBLISH\` and the live checks \`$LIVE\`: $RUN_URL"
            echo
            echo "Red jobs:"
            echo "${failed:-- none listed; the run was cancelled or a job never started}"
            echo
            echo "These run outside pull requests and never block one. This issue closes itself on the next green night."
          } > "$body"
          if [ -n "$open" ]; then
            act gh issue edit "$open" -R "$REPO" --body-file "$body"
          elif [ -n "$closed" ]; then
            act gh issue reopen "$closed" -R "$REPO" --comment "Red again: $RUN_URL"
            act gh issue edit "$closed" -R "$REPO" --body-file "$body"
          else
            act gh issue create -R "$REPO" --title "$title" --body-file "$body"
          fi

  # The live agent check (#884): the real pinned agent on its free model, every scheduled night and on
  # dispatch with `live` (#1085). Release gate: dispatch with `ref` set to the release PR's base SHA (README.md).
  live-pack:
    name: "Live: pack npm tarball"
    if: inputs.live || (github.event_name == 'schedule' && vars.NIGHTLY_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Pack tarball
        run: |
          mkdir -p /tmp/tarballs
          node scripts/pack-cli.mjs --out /tmp/tarballs
          ls -l /tmp/tarballs

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: live-npm-tarballs
          path: /tmp/tarballs/*.tgz
          retention-days: 3

  packed-intake-live:
    # 3 attempts, passes on at least 2 valid reports; each uploads its paged event
    # stream, the recording source for #533.
    name: "Live: alert to report on the free model (2 of 3)"
    needs: live-pack
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Install the pinned OpenCode
        run: npm install -g "opencode-ai@$(node -p "require('./scripts/agent-pins.json').pins['opencode-ai']")" && opencode --version

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: live-npm-tarballs
          path: tarballs

      - name: Three attempts, pass on at least two valid reports
        env:
          PACKED_INTAKE_AGENT: live
          PACKED_INTAKE_REPO: fixture
          PRISMALENS_HARNESS: opencode
          PRISMALENS_HARNESS_MODEL: ${{ env.FREE_MODEL }}
        run: |
          set -u
          mkdir -p events
          passed=0
          for n in 1 2 3; do
            echo "::group::attempt $n"
            if PACKED_INTAKE_EVENTS_OUT="$PWD/events/attempt-$n.json" \
              PACKED_INTAKE_PORT=$((3102 + n)) \
              timeout 20m node scripts/packed-intake.mjs tarballs; then
              passed=$((passed + 1))
              echo "attempt $n: valid report" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "attempt $n: no valid report" >> "$GITHUB_STEP_SUMMARY"
            fi
            echo "::endgroup::"
          done
          echo "$passed of 3 attempts completed with a valid report" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$passed" -lt 2 ]; then
            echo "::error::only $passed of 3 attempts completed with a valid report; 2 are needed"
            exit 1
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: intake-events-attempt-1
          path: events/attempt-1.json
          if-no-files-found: ignore
          retention-days: 30

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: intake-events-attempt-2
          path: events/attempt-2.json
          if-no-files-found: ignore
          retention-days: 30

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: intake-events-attempt-3
          path: events/attempt-3.json
          if-no-files-found: ignore
          retention-days: 30

  harness-admission-live:
    name: "Live: agent qualification (opencode, free model)"
    if: inputs.live || (github.event_name == 'schedule' && vars.NIGHTLY_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the packages the engine imports
        run: pnpm --filter "@prismalens/contracts..." --filter "@prismalens/integrations..." --filter "@prismalens/engine..." build

      - name: Install the pinned OpenCode
        run: npm install -g "opencode-ai@$(node -p "require('./scripts/agent-pins.json').pins['opencode-ai']")" && opencode --version

      - name: Run the admission script against this checkout
        env:
          PRISMALENS_HARNESS_MODEL: ${{ env.FREE_MODEL }}
          ADMISSION_LIVE_MODEL: "1"
        run: pnpm --filter @prismalens/engine exec tsx scripts/acp-admission.ts opencode "$GITHUB_WORKSPACE"
