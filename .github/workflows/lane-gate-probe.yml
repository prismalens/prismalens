name: Lane gate probe

# TEMPORARY DIAGNOSTIC. Delete once prismalens/gh-workflows#20 item 2 is settled.
#
# An in-thread reply on this repo reaches the review lane's admission gate and is
# refused, while an `@claude review` summon on the same PR from the same member is
# admitted, and prismalens/sreforge admits the identical reply shape under a
# byte-identical gate. Every field readable from the REST API matches. This prints
# what the gate actually receives, which is the only place the answer can be.
#
# Deliberately inert: no secrets, no permissions, no network calls, and it never
# reads the comment body. The body is attacker-influenceable and stays out.

on:
  pull_request_review_comment:
    types: [created]
  issue_comment:
    types: [created]

permissions: {}

# Unique per run, so this can never queue behind or evict a real lane run.
concurrency:
  group: lane-gate-probe-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Echo the fields the admission gate reads
        env:
          EVENT_NAME: ${{ github.event_name }}
          COMMENT_USER_TYPE: ${{ github.event.comment.user.type }}
          COMMENT_USER_LOGIN: ${{ github.event.comment.user.login }}
          COMMENT_ASSOC: ${{ github.event.comment.author_association }}
          COMMENT_IN_REPLY_TO: ${{ github.event.comment.in_reply_to_id }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_STATE: ${{ github.event.pull_request.state }}
          PR_DRAFT: ${{ github.event.pull_request.draft }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_STATE: ${{ github.event.issue.state }}
          ISSUE_IS_PR: ${{ github.event.issue.pull_request != null }}
        run: |
          echo "EVENT_NAME=[$EVENT_NAME]"
          echo "COMMENT_USER_TYPE=[$COMMENT_USER_TYPE]"
          echo "COMMENT_USER_LOGIN=[$COMMENT_USER_LOGIN]"
          echo "COMMENT_ASSOC=[$COMMENT_ASSOC]"
          echo "COMMENT_IN_REPLY_TO=[$COMMENT_IN_REPLY_TO]"
          echo "PR_NUMBER=[$PR_NUMBER]"
          echo "PR_STATE=[$PR_STATE]"
          echo "PR_DRAFT=[$PR_DRAFT]"
          echo "ISSUE_NUMBER=[$ISSUE_NUMBER]"
          echo "ISSUE_STATE=[$ISSUE_STATE]"
          echo "ISSUE_IS_PR=[$ISSUE_IS_PR]"

      - name: Evaluate each clause of the gate separately
        env:
          CLAUSE_NOT_BOT: ${{ github.event.comment.user.type != 'Bot' }}
          CLAUSE_NO_BOT_SUFFIX: ${{ !endsWith(github.event.comment.user.login, '[bot]') }}
          CLAUSE_ASSOC: ${{ github.event.comment.author_association == 'OWNER' || github.event.comment.author_association == 'MEMBER' || github.event.comment.author_association == 'COLLABORATOR' }}
          CLAUSE_REVIEW_COMMENT_BRANCH: ${{ github.event_name == 'pull_request_review_comment' && github.event.pull_request.state == 'open' }}
          CLAUSE_CALLER_DRAFT_GUARD: ${{ github.event.pull_request.draft != true }}
        run: |
          echo "CLAUSE_NOT_BOT=[$CLAUSE_NOT_BOT]"
          echo "CLAUSE_NO_BOT_SUFFIX=[$CLAUSE_NO_BOT_SUFFIX]"
          echo "CLAUSE_ASSOC=[$CLAUSE_ASSOC]"
          echo "CLAUSE_REVIEW_COMMENT_BRANCH=[$CLAUSE_REVIEW_COMMENT_BRANCH]"
          echo "CLAUSE_CALLER_DRAFT_GUARD=[$CLAUSE_CALLER_DRAFT_GUARD]"
