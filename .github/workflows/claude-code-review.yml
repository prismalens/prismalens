# Generated by the `claude` CLI's GitHub Actions setup, then adjusted for this
# repo's merge gate. Tracked in #301.
#
# WHY `synchronize` IS KEPT
# -------------------------
# It costs a review on every push, and `strict_required_status_checks_policy` is
# on, so every merge to `main` forces the next PR to update and pushes again.
# Dropping it was considered and rejected: review evidence in this repo is keyed
# to the head SHA, so a review of an earlier commit stops counting the moment the
# branch moves. A workflow that only fires on `opened` would leave every updated
# PR with stale evidence and no way to refresh it except a manual dispatch. The
# concurrency group below is the cheaper half of that trade — it collapses a burst
# of pushes into one review instead of reviewing each.
name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

# One review in flight per PR. `cancel-in-progress` is correct here, unlike in
# review-evidence.yml: a review of a superseded SHA has no value once a newer
# commit exists, because the gate keys on the current head either way.
concurrency:
  group: claude-code-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true


# WHY TWO JOBS — this is a privilege boundary, not tidiness.
#
# The job that reads PR content and runs a model must never be the job that
# writes the evidence the merge gate trusts. `review` gets a READ-ONLY token, so
# a prompt injected into the reviewed diff cannot steer it into minting its own
# marker. `marker` runs no model, reads nothing from the PR but its head SHA,
# and is the only job that can write.
#
# `needs: review` means the marker cannot exist without a completed review job —
# GitHub skips a `needs` job on failure, cancellation or skip.
#
# WHY THE MARKER, AND NOT THE REVIEW ARTIFACT ITSELF
# --------------------------------------------------
# `claude[bot]` is an app installation shared by THIS workflow and claude.yml,
# the mention lane anyone who can comment may trigger. An earlier design bound a
# `claude[bot]` review to a successful run of this file by comparing timestamps.
# That made a successful run a REUSABLE AUTHORIZATION TOKEN: a run that succeeds
# while posting nothing — the routine failure mode of a misconfigured tool list,
# observed twice on 2026-08-09 — leaves an unspent authorization that a
# mention-lane post can redeem. The marker closes it: the agent holds no
# credential that can author `github-actions[bot]`, and the publisher validates
# the cited run rather than inferring anything from submission times.
#
# WHY THE MARKER SURVIVES THE MOVE TO LIVENESS (#413)
# ---------------------------------------------------
# `review-evidence` no longer asks what the reviewer SAID, only that it ran. The
# tempting simplification is to drop this job and let the publisher key on "a
# successful run of this workflow file at this head". That fails OPEN here:
# `claude-code-action` refuses to run when the PR head's copy of this file
# differs from the default branch, and on that path
# `src/entrypoints/run.ts` returns early having set only
# `skipped_due_to_workflow_validation_mismatch` — the step exits 0 and this job
# reports SUCCESS with nothing reviewed. So run success does not imply the
# reviewer looked. This job is what separates the two, by refusing to mint unless
# the action reported a `conclusion`, which run.ts sets only after the agent
# actually executed.
jobs:
  review:
    # Fork PRs get no repository secrets, so CLAUDE_CODE_OAUTH_TOKEN would be
    # empty and this job would fail — a red job on every outside contribution,
    # which reads as "the contributor broke something". Skip cleanly instead.
    #
    # Fork PRs take the CodeRabbit lane (`@coderabbitai review`, or admission on
    # a high-risk path). `pull_request_target` is deliberately NOT used to work
    # around this: it pairs repository secrets with an attacker-controlled ref,
    # which is the exact combination this repo removed with cla.yml.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      head_sha: ${{ steps.pr.outputs.head_sha }}
      # THE LIVENESS SIGNAL. `claude-code-action` sets `conclusion` in
      # `src/entrypoints/run.ts` only after the agent has actually executed
      # (line 312, from `claudeResult.conclusion`). On the workflow-validation
      # skip path it returns at line 177 having set only
      # `skipped_due_to_workflow_validation_mismatch` — which the composite
      # action does not expose — so `conclusion` comes through EMPTY. An empty
      # value therefore means "the reviewer never ran", which is exactly the case
      # a bare `needs: review` success cannot see.
      conclusion: ${{ steps.claude-review.outputs.conclusion }}
    # READ-ONLY. The action posts under its own app installation token, not this
    # one, so the review still publishes; what this token cannot do is write a
    # commit status or author a marker comment.
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      # The start time this step used to record is gone with the artifact count
      # that consumed it: nothing in this workflow compares timestamps any more,
      # and a runner clock was never something to gate on.
      - name: Record head
        id: pr
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          printf 'head_sha=%s\n' "$HEAD_SHA" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          # The agent runs in this workspace. Left on, checkout leaves a usable
          # credential in .git/config for the whole job.
          persist-credentials: false

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          # `--comment` is required, and its absence is why this lane posted
          # nothing at all. The plugin's step 7 no-ops its ENTIRE posting path
          # ("if --comment was NOT provided, stop here"), so the reviewer runs a
          # full review and publishes none of it. Folded in from #410.
          #
          # It matters more under liveness than it did before: objections are
          # enforced by GitHub's `required_review_thread_resolution`, which has
          # nothing to resolve if the reviewer never opens a thread.
          prompt: '/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }} --comment'
          # THE TOOL LIST IS LOAD-BEARING. Supplying `prompt:` puts the action in
          # AGENT mode, and in agent mode `src/modes/agent/index.ts` resolves the
          # tool list ONLY from `claude_args` — `settings` is not read for this.
          # Worse, `src/mcp/install-mcp-server.ts` installs the action's own MCP
          # posting servers CONDITIONALLY on that list: no `mcp__github_comment__`
          # entry, no comment server; no `mcp__github_inline_comment__` entry, no
          # inline server. So an omitted or partial list does not merely restrict
          # the reviewer — it leaves it with nothing to post with.
          #
          # Both failure shapes were observed on 2026-08-09. A single-entry list:
          # 11 turns, 1 permission denial, nothing posted, `conclusion: success`.
          # No list at all (grant attempted via `settings`): 37 turns, 15 denials,
          # nothing posted, `conclusion: success`. Tag mode works out of the box
          # only because it builds its own list; agent mode has no default.
          #
          # THE LIST IS THE PLUGIN'S OWN DECLARATION, PLUS `Task`.
          #
          # `plugins/code-review/commands/code-review.md` in anthropics/claude-code
          # declares `allowed-tools:` in its frontmatter — but agent mode does not
          # merge it, so it has to be restated here. Copy it from there when the
          # plugin changes, not from `tagModeTools`, which is a different lane's
          # list and does not include what a review needs.
          #
          # `Task` is the entry that is easy to miss and fatal to omit: that
          # command is SUBAGENT-BASED. Its first step launches a haiku agent, then
          # a sonnet agent to summarise, then four agents in parallel to review.
          # Without `Task` the reviewer is denied at its first step and gives up —
          # observed on #401 at `6dcb987f`: 4 turns, 1 permission denial, $0.17,
          # nothing posted, `conclusion: success`, and the marker job correctly
          # refused to mint.
          #
          # `Bash(gh pr review:*)` is deliberately ABSENT: the gate reads the
          # marker this workflow mints, not a review object, so the reviewer never
          # needs to submit one.
          #
          # THIS LIST IS NOW THE LANE'S WEAKEST POINT, and the move to liveness
          # (#413) is what made it so. The old marker predicate counted posted
          # artifacts, so a stale list produced a denied reviewer, no artifacts,
          # and a red `marker` — loud, never a silent pass. Observed on #401 at
          # `6dcb987f`: 4 turns, 1 denial, nothing posted, `conclusion: success`,
          # marker correctly refused. The predicate is now `conclusion == success`,
          # which that same run WOULD satisfy: an agent denied at its first step
          # still exits success, so a stale list would mint a marker for a review
          # that read nothing.
          #
          # Accepted, with eyes open, because the alternative is the requirement
          # #413 proved unsatisfiable — and because the failure is self-announcing
          # in the review job log (denials are printed) rather than silent in the
          # gate. Re-derive this list whenever the plugin changes; do not treat a
          # green `marker` as proof the tool list is current. A follow-up worth
          # having: bind an issue comment to THIS run by its run id in the body,
          # which restores "the reviewer posted" without reintroducing either a
          # timestamp or a findings requirement.
          claude_args: >-
            --allowed-tools
            "Task,Read,Grep,Glob,LS,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*),Bash(gh pr comment:*),Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh search:*),mcp__github_comment__update_claude_comment,mcp__github_inline_comment__create_inline_comment"

  marker:
    needs: review
    if: needs.review.result == 'success'
    runs-on: ubuntu-latest
    # The ONLY write in this workflow, and it is held by a job that runs no model
    # and reads no PR content beyond the head SHA it was handed.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Verify the reviewer actually ran, then mint the marker
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ needs.review.outputs.head_sha }}
          CONCLUSION: ${{ needs.review.outputs.conclusion }}
          RUN_ID: ${{ github.run_id }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          SELF: .github/workflows/claude-code-review.yml
        run: |
          set -euo pipefail

          # LIVENESS CHECK — EXECUTION, NOT ARTIFACTS.
          #
          # `needs: review` proves the JOB succeeded. It does not prove the
          # REVIEWER ran: `claude-code-action` self-skips when this file differs
          # from the copy on the default branch, exits 0, and leaves the job
          # green. So job success alone must never mint a marker.
          #
          # What separates the two is the action's own `conclusion` output.
          # `src/entrypoints/run.ts` sets it from `claudeResult.conclusion` only
          # after the agent has executed; on the validation-skip path it returns
          # early having set only
          # `skipped_due_to_workflow_validation_mismatch` — a step output the
          # composite action does not expose — so `conclusion` arrives EMPTY here.
          # Empty means "never ran". A non-empty value other than `success` means
          # it ran and failed, which is equally not evidence.
          #
          # WHAT THIS DELIBERATELY NO LONGER COUNTS: head-bound `claude[bot]`
          # artifacts. That check required the reviewer to have POSTED something
          # carrying a `commit_id`, and #413 proved it unsatisfiable for a correct
          # PR — a clean diff yields at most an issue comment, which has no commit
          # id, so the gate stayed red on code nobody could fault. The old comment
          # here called that "a nuisance with an obvious fallback"; the fallback
          # did not exist, because branch A is blind to clean diffs in the same
          # way. Liveness is now proved by execution, which a clean diff does not
          # suppress.
          if [ "$CONCLUSION" != "success" ]; then
            # WHY THIS ASKS WHO EDITED THE WORKFLOW BEFORE BLAMING THE TOOL LIST.
            # An EMPTY `conclusion` says the agent never ran, but not why. The
            # overwhelmingly common cause is that this PR edits this file:
            # `claude-code-action` refuses to run when it differs from the copy on
            # the default branch — "Workflow validation failed" — and reports that
            # skip as SUCCESS. The other causes need completely different fixes,
            # and an earlier version of this message asserted one of them
            # unconditionally, which cost a real investigation.
            #
            # That validation is a control, not an obstacle: without it a PR
            # could rewrite the reviewing workflow and have its own version run
            # with the app token. The standing consequence is that this lane can
            # never review a PR that edits this file. The gate already absorbs
            # that — `.github/**` is on the high-risk list, so such a PR needs
            # `coderabbitai[bot]` and branch D could not have greened it anyway.
            #
            # Blob SHAs, not content: the API hands them over without fetching
            # either file.
            #
            # `differs` ALONE CANNOT CARRY THIS, and that is the whole reason
            # `compared` exists. An empty `differs` means one of two opposite
            # things: the blobs matched, or a lookup failed and nothing was
            # compared. Reporting "this file matches $DEFAULT_BRANCH" in the
            # second case is an assertion this job did not compute — the same
            # class of guess that cost the investigation recorded above, which is
            # why it is worth a second variable rather than a shorter condition.
            differs=""
            compared=""
            head_blob=$(gh api "repos/$REPO/contents/$SELF?ref=$HEAD_SHA" --jq .sha 2>/dev/null) || head_blob=""
            base_blob=$(gh api "repos/$REPO/contents/$SELF?ref=$DEFAULT_BRANCH" --jq .sha 2>/dev/null) || base_blob=""
            if [ -n "$head_blob" ] && [ -n "$base_blob" ]; then
              compared=yes
              if [ "$head_blob" != "$base_blob" ]; then
                differs=yes
              fi
            fi

            if [ -n "$differs" ]; then
              echo "::error::The reviewer never ran at ${HEAD_SHA:0:8} because this PR edits $SELF," \
                   "so claude-code-action skipped itself on workflow validation (it requires this file to match" \
                   "$DEFAULT_BRANCH) and reported success without running." \
                   "This is expected on a PR that changes the review workflow, and it resolves once the PR merges." \
                   "Such a PR touches .github/** and therefore needs a coderabbitai[bot] review regardless —" \
                   "branch D cannot satisfy the gate for it."
            elif [ -z "$CONCLUSION" ] && [ -n "$compared" ]; then
              echo "::error::claude-code-action reported no conclusion at ${HEAD_SHA:0:8}, so the agent never ran." \
                   "No marker will be minted and review-evidence stays red." \
                   "This file matches $DEFAULT_BRANCH, so workflow validation is not the cause —" \
                   "read the review job log before changing anything here."
            elif [ -z "$CONCLUSION" ]; then
              echo "::error::claude-code-action reported no conclusion at ${HEAD_SHA:0:8}, so the agent never ran." \
                   "No marker will be minted and review-evidence stays red." \
                   "Could NOT compare this file against $DEFAULT_BRANCH (blob lookup failed), so workflow" \
                   "validation is not ruled out — check whether this PR edits $SELF, then read the review job log."
            else
              echo "::error::The reviewer ran at ${HEAD_SHA:0:8} and concluded '$CONCLUSION', not success." \
                   "No marker will be minted and review-evidence stays red." \
                   "A stale --allowed-tools list is the usual cause — see the comment on that input."
            fi
            exit 1
          fi

          # The marker asserts only what this job can vouch for: a run of THIS
          # workflow file, at THIS head, whose reviewer executed and concluded
          # success. The publisher re-derives every one of those facts from the run
          # id rather than trusting the text.
          body=$(printf '%s\n\n%s\n\n%s\n' \
            "<!-- claude-review: $HEAD_SHA run:$RUN_ID -->" \
            "Claude review ran to completion for \`${HEAD_SHA:0:8}\` — [run $RUN_ID](https://github.com/$REPO/actions/runs/$RUN_ID)." \
            "This marker records that the reviewer ran; it is not itself the review, and it does not assert that anything was found. \`review-evidence\` validates it by looking up the cited run.")

          gh api -X POST "repos/$REPO/issues/$PR/comments" -f body="$body" --silent
          echo "marker posted for ${HEAD_SHA:0:8} citing run $RUN_ID"
