name: Mirror a release
# Copies a release's archives and SHA256SUMS to downloads.prismalens.io/v<version>/ and keeps
# only the newest KEEP releases, so the bucket stays inside R2's free tier; anything older
# falls back to GitHub (#1215 holds the budget).
on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
    secrets:
      R2_ACCESS_KEY_ID:
        required: true
      R2_SECRET_ACCESS_KEY:
        required: true
  # Back-fill or repair: mirror an existing release again.
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to mirror, e.g. v0.5.6"
        required: true
permissions:
  contents: read
# One group for the whole bucket: two tags' jobs must not both prune the same version. A third run
# queued behind a pending one replaces it (GitHub keeps one pending run per group): dispatch it again.
concurrency:
  group: mirror-prismalens-releases
  cancel-in-progress: false
jobs:
  mirror:
    name: Mirror ${{ inputs.tag }} to downloads.prismalens.io
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Named, so GitHub adds pipefail: a failed listing must not read as an empty bucket.
    defaults:
      run:
        shell: bash
    env:
      TAG: ${{ inputs.tag }}
      BUCKET: prismalens-releases
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      # R2 rejects the CRC checksums newer AWS CLIs send by default.
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
      ENDPOINT: https://${{ vars.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
      KEEP: 3
      # Half of R2's free 10 GB: a release is about 1 GB, so 3 kept leave room for growth.
      CEILING_BYTES: 5000000000
    steps:
      # Retention only prunes vX.Y.Z prefixes, so anything else would stay in the bucket for good.
      - name: Only stable release tags are mirrored
        run: |
          echo "$TAG" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$' || { echo "::error::$TAG is not a stable release tag (vX.Y.Z); nothing was written"; exit 1; }
      - name: Only the newest releases are mirrored
        id: keep
        run: |
          all=$(aws s3 ls "s3://$BUCKET/" --endpoint-url "$ENDPOINT")
          listed=$(echo "$all" | awk '$1=="PRE"{print $2}' | tr -d / | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true)
          keep=$(echo $listed "$TAG" | tr ' ' '\n' | sort -uV | tail -n "$KEEP")
          echo "Kept after this run:" $keep
          if ! echo "$keep" | grep -qx "$TAG"; then
            echo "::notice::$TAG is older than the newest $KEEP; it stays on GitHub only"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
          echo "drop=$(echo $listed | tr ' ' '\n' | grep -vxF "$keep" | tr '\n' ' ')" >> "$GITHUB_OUTPUT"
      - name: Download the release's assets
        if: steps.keep.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$TAG" -p 'prismalens-*' -p 'PrismaLens-*' -p install.sh -p install.ps1 -p SHA256SUMS -D assets --repo "$GITHUB_REPOSITORY"
          cd assets && sha256sum -c SHA256SUMS
      # Before any write: what stays in the bucket plus this release must fit under the ceiling.
      - name: The bucket has room for this release
        if: steps.keep.outputs.skip != 'true'
        env:
          DROP: ${{ steps.keep.outputs.drop }}
        run: |
          incoming=$(cat assets/* | wc -c)
          retained=$(aws s3 ls "s3://$BUCKET/" --recursive --endpoint-url "$ENDPOINT" | awk -v gone=" $DROP $TAG " '{ split($4, p, "/"); if (index(gone, " " p[1] " ") == 0) s += $3 } END { print s + 0 }')
          echo "Bucket keeps $retained bytes and takes $incoming more (ceiling $CEILING_BYTES)"
          [ $((retained + incoming)) -le "$CEILING_BYTES" ] || { echo "::error::Mirroring $TAG would hold $((retained + incoming)) bytes, over the $CEILING_BYTES ceiling; nothing was written"; exit 1; }
      # SHA256SUMS goes last: a client that finds it can fetch every archive it names.
      - name: Upload, archives first
        if: steps.keep.outputs.skip != 'true'
        run: |
          dest="s3://$BUCKET/$TAG"
          cache="public, max-age=31536000, immutable"
          for f in assets/*; do
            [ "$(basename "$f")" = SHA256SUMS ] && continue
            aws s3 cp "$f" "$dest/$(basename "$f")" --endpoint-url "$ENDPOINT" --cache-control "$cache" --only-show-errors
          done
          aws s3 cp assets/SHA256SUMS "$dest/SHA256SUMS" --endpoint-url "$ENDPOINT" --cache-control "$cache" --content-type text/plain --only-show-errors
      - name: The mirror serves the same bytes
        if: steps.keep.outputs.skip != 'true'
        run: |
          cd assets
          curl -fsSL "https://downloads.prismalens.io/$TAG/SHA256SUMS" | diff - SHA256SUMS
          f=$(ls prismalens-*-win32-x64.zip)
          curl -fsSL "https://downloads.prismalens.io/$TAG/$f" -o "$RUNNER_TEMP/$f"
          echo "$(grep " $f\$" SHA256SUMS | cut -d' ' -f1)  $RUNNER_TEMP/$f" | sha256sum -c
      - name: Drop releases past the newest ${{ env.KEEP }}
        env:
          DROP: ${{ steps.keep.outputs.drop }}
        run: |
          for v in $DROP; do
            echo "Removing $v from the mirror"
            aws s3 rm "s3://$BUCKET/$v/" --recursive --endpoint-url "$ENDPOINT" --only-show-errors
          done
      - name: The bucket stays under its ceiling
        run: |
          total=$(aws s3 ls "s3://$BUCKET/" --recursive --summarize --endpoint-url "$ENDPOINT" | awk '/Total Size/{print $3}')
          echo "Bucket holds ${total:-0} bytes (ceiling $CEILING_BYTES)"
          [ "${total:-0}" -le "$CEILING_BYTES" ] || { echo "::error::The mirror holds $total bytes, over its $CEILING_BYTES ceiling"; exit 1; }
