# Cross-OS from-scratch CLI smoke: proves the published `prismalens` npm
# package installs and runs correctly on Linux, macOS, AND Windows.
#
# This is phase-gate testing PART 2 (the milestone gate's "smoke-test the
# RELEASED artifact" requirement — see .github/workflows/phase-gate.yml) —
# NOT sreforge. sreforge is the separate clean-env engine/eval capabilities
# testing ground; this workflow only proves the packaged CLI artifact.
#
# Two modes, chosen by the `mode` job from the triggering event:
#   - tarball  (pull_request touching packages/** or this workflow, and push
#     to main): build + `node scripts/pack-cli.mjs`, cold-install the tarballs into a clean
#     dir, drive the installed bin. Fast feedback on every PR.
#   - registry (workflow_dispatch, and `release: published` for the
#     unscoped `prismalens` package tag): `npm install prismalens@<version>`
#     from the real npm registry into a clean dir, drive the installed bin.
#     This IS the gate's released-artifact verification — trigger this
#     workflow with `version` set to the just-released version (or let a
#     `prismalens@<version>` GitHub Release trigger it automatically) and
#     link the green 3-OS run in the phase-gate issue.
#
# Assertions share their core with scripts/packed-smoke.sh (which only
# proves the tarballs are well-formed, on Linux containers, as part of the
# `ci.yml` pack/packed-smoke jobs) via scripts/cross-os-smoke.sh, which adds
# `status`, unknown-flag handling, and a `serve` JSON-RPC round-trip.
#
# Two matrices run per mode, and they answer different questions (issue #330):
#   - `smoke`     drives the CLI from a LOCAL install. Does the packaged
#                 command-line tool work on this OS?
#   - `app-boot`  installs the tarball GLOBALLY, runs `pl up`, and asserts the
#                 running application's behaviour. Does a stranger who typed
#                 `npm i -g prismalens && pl up` get a WORKING APP on this OS?
#                 A booting process is not a working app, so it asserts served
#                 behaviour — the SPA's own assets, and an authenticated `/api`
#                 call proving the static catch-all did not shadow the API —
#                 not liveness. See scripts/cross-os-app-boot.mjs.
name: Cross-OS CLI smoke

on:
  pull_request:
    paths:
      - "packages/**"
      - ".github/workflows/cross-os-smoke.yml"
      - "scripts/cross-os-smoke.sh"
      - "scripts/cross-os-app-boot.mjs"
  push:
    branches: [main]
    paths:
      - "packages/**"
      - ".github/workflows/cross-os-smoke.yml"
      - "scripts/cross-os-smoke.sh"
      - "scripts/cross-os-app-boot.mjs"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "prismalens version to install from the npm registry (default: latest)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: cross-os-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mode:
    name: Resolve mode
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.resolve.outputs.mode }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Resolve mode + version from the triggering event
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_VERSION: ${{ github.event.inputs.version }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          case "$EVENT_NAME" in
          release)
            # `prismalens` is the only published package, so `prismalens@X.Y.Z`
            # is the only release tag that maps to a verifiable npm artifact
            # (the @prismalens/* closure is private + bundled, #193 — it never
            # gets its own release tag). Guard anyway: skip any other tag.
            case "$RELEASE_TAG" in
            prismalens@*)
              echo "mode=registry" >> "$GITHUB_OUTPUT"
              echo "version=${RELEASE_TAG#prismalens@}" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "mode=skip" >> "$GITHUB_OUTPUT"
              echo "version=" >> "$GITHUB_OUTPUT"
              ;;
            esac
            ;;
          workflow_dispatch)
            echo "mode=registry" >> "$GITHUB_OUTPUT"
            echo "version=${DISPATCH_VERSION:-latest}" >> "$GITHUB_OUTPUT"
            ;;
          *)
            echo "mode=tarball" >> "$GITHUB_OUTPUT"
            echo "version=" >> "$GITHUB_OUTPUT"
            ;;
          esac

  pack:
    name: Pack prismalens tarball (tarball mode)
    needs: mode
    if: needs.mode.outputs.mode == 'tarball'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Pack tarball
        # `pnpm pack` cannot produce this artifact: the published package carries
        # the first-party closure as bundleDependencies, and pnpm's handling of
        # those has historically diverged from npm's. The pack script builds
        # everything, generates the dependency union, and asserts the tarball —
        # and it is the SAME script the publish job runs (issue #237).
        run: |
          mkdir -p /tmp/tarballs
          node scripts/pack-cli.mjs --out /tmp/tarballs
          ls -l /tmp/tarballs

      - uses: actions/upload-artifact@v7
        with:
          name: npm-tarballs-cross-os-smoke
          path: /tmp/tarballs/*.tgz
          retention-days: 3

  smoke:
    name: Smoke (${{ matrix.os }})
    needs: [mode, pack]
    # `pack` is skipped (not failed) in registry mode — only block on an
    # actual pack failure/cancellation, never on registry-mode's skip.
    if: |
      always() &&
      needs.mode.outputs.mode != 'skip' &&
      needs.pack.result != 'failure' &&
      needs.pack.result != 'cancelled'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        # Windows runners default `run:` to pwsh — force git-bash everywhere
        # so scripts/cross-os-smoke.sh runs unmodified on all 3 OSes.
        shell: bash
    env:
      MODE: ${{ needs.mode.outputs.mode }}
      VERSION: ${{ needs.mode.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            scripts/cross-os-smoke.sh
            .nvmrc
          sparse-checkout-cone-mode: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Download tarballs
        if: env.MODE == 'tarball'
        uses: actions/download-artifact@v8
        with:
          name: npm-tarballs-cross-os-smoke
          path: tarballs

      - name: Cold-install the prismalens tarball into a clean dir (tarball mode)
        if: env.MODE == 'tarball'
        run: |
          mkdir -p scratch
          cd scratch

          # Relative (forward-slash) paths only — an absolute path minted by
          # mktemp/pwd on Windows git-bash is a POSIX-style MSYS path that
          # native npm.exe/node.exe cannot resolve back to the same real
          # directory. Relative "file:../tarballs/x.tgz" has no such
          # ambiguity and resolves identically on all 3 OSes.
          find_tarball() {
            for f in ../tarballs/$1[0-9]*.tgz; do
              [ -e "$f" ] || { echo "no tarball matching $1*.tgz" >&2; exit 1; }
              echo "$f"
              return
            done
          }
          CLI_TGZ=$(find_tarball "prismalens-")

          # prismalens is self-contained — the @prismalens/* closure is bundled
          # into its tarball at build time (#193), so a single dependency is the
          # entire install. No overrides for the (now private, unpublished)
          # scoped packages; if they leaked back into the tree, the ci.yml
          # packed-smoke assertion would catch it.
          cat > package.json <<EOF
          {
            "name": "cross-os-smoke-scratch",
            "private": true,
            "dependencies": { "prismalens": "file:$CLI_TGZ" }
          }
          EOF

          npm install --engine-strict --no-audit --no-fund --loglevel=error

      - name: Cold-install from the npm registry into a clean dir (registry mode)
        if: env.MODE == 'registry'
        run: |
          mkdir -p scratch
          cd scratch
          npm init -y >/dev/null
          npm install --engine-strict --no-audit --no-fund --loglevel=error "prismalens@${VERSION}"

      - name: Run the cross-OS smoke assertions
        run: bash scripts/cross-os-smoke.sh scratch

  # The app-boot matrix (issue #330). Separate from `smoke` on purpose: `smoke`
  # answers "does the CLI work here", this answers "does the APPLICATION work
  # here", and conflating them would hide which of the two a red cell means.
  # It is also the only job in the repo that installs the artifact the way a
  # user does — `npm i -g` — and the only cross-platform coverage of
  # better-sqlite3's native binding and Nest's single-origin SPA serving.
  app-boot:
    name: App boot (${{ matrix.os }})
    needs: [mode, pack]
    # Same guard as `smoke`: `pack` is SKIPPED in registry mode, which must not
    # be read as a failure.
    if: |
      always() &&
      needs.mode.outputs.mode != 'skip' &&
      needs.pack.result != 'failure' &&
      needs.pack.result != 'cancelled'
    runs-on: ${{ matrix.os }}
    # Boot + first-run migration + a forked investigation child, on the slowest
    # of the three runners. Generous, but bounded — a hung `pl up` must not sit
    # on the default 360-minute ceiling.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        # Windows runners default `run:` to pwsh; force git-bash so the install
        # steps below are one script on all three OSes. The assertions
        # themselves are Node, not bash — see the script's header for why.
        shell: bash
    env:
      MODE: ${{ needs.mode.outputs.mode }}
      VERSION: ${{ needs.mode.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            scripts/cross-os-app-boot.mjs
            .nvmrc
          sparse-checkout-cone-mode: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Download tarballs
        if: env.MODE == 'tarball'
        uses: actions/download-artifact@v8
        with:
          name: npm-tarballs-cross-os-smoke
          path: tarballs

      - name: Install the packed tarball GLOBALLY (tarball mode)
        if: env.MODE == 'tarball'
        # `-g` is the point of this job, not an implementation detail: it is the
        # command README tells a stranger to run, and it is the layout
        # (<prefix>/lib/node_modules on POSIX, <prefix>\node_modules on Windows)
        # that better-sqlite3's binding and the bin shims have to resolve from.
        #
        # Relative forward-slash paths only — an absolute path minted by
        # pwd/mktemp under Windows git-bash is an MSYS path that native npm.exe
        # cannot resolve back to the same directory (same reason as `smoke`).
        run: |
          find_tarball() {
            for f in ./tarballs/$1[0-9]*.tgz; do
              [ -e "$f" ] || { echo "no tarball matching $1*.tgz" >&2; exit 1; }
              echo "$f"
              return
            done
          }
          CLI_TGZ=$(find_tarball "prismalens-")
          echo "installing $CLI_TGZ globally"
          npm install -g --engine-strict --no-audit --no-fund --loglevel=error "$CLI_TGZ"

      - name: Install from the npm registry GLOBALLY (registry mode)
        if: env.MODE == 'registry'
        run: npm install -g --engine-strict --no-audit --no-fund --loglevel=error "prismalens@${VERSION}"

      - name: Boot the app and assert it serves a working dashboard and API
        run: node scripts/cross-os-app-boot.mjs
