# Reruns a `CI` run once when its only red jobs never got a runner (#1052): a runner shortage is
# not a code failure, and the run's other jobs keep their results. `scripts/ci-gate-report.mjs` decides.
name: CI rerun for jobs that never started

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  actions: write
  contents: read

concurrency:
  group: ci-rerun-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  rerun:
    name: Rerun jobs that never started
    # One retry per run, and only for a run that failed: a run someone cancelled stays cancelled.
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts/ci-gate-report.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Rerun when only never-started jobs are red
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RERUN: "1"
        run: node scripts/ci-gate-report.mjs
