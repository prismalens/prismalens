# Applies the `review-ready` admission label to a pull request.
#
# WHY IT IS DISPATCH-ONLY
# -----------------------
# This is the mechanism the drip cron will eventually use. It ships as manual
# dispatch because the drip itself does not exist yet — not because the premise
# is unproven. On mage-memory the premise WAS the open question ("does a label
# applied by a workflow start a CodeRabbit review, given GitHub's anti-recursion
# rule that GITHUB_TOKEN events do not trigger other *workflows*?") and it has
# since been measured: a `review-ready` label applied by `github-actions[bot]`
# via GITHUB_TOKEN does start a CodeRabbit review. The anti-recursion rule is a
# workflow-trigger rule; it does not gate an external app's own webhooks. No PAT
# is needed. Evidence: #301, step-5 comment.
#
# Two measured caveats that the drip must model, recorded here so they are not
# rediscovered:
#   - Bot-AUTHORED PRs are skipped by CodeRabbit's platform default regardless of
#     labels, so admitting one is a silent no-op. They already pass
#     `review-evidence` via its bot-author branch, so exclude them from the queue.
#   - An admitted review can enter the `paused` state without ever submitting
#     review evidence. `paused` is not `delivered`; a drip confirmation step must
#     distinguish them.
#
# It has to live on the DEFAULT branch to be dispatchable at all: workflow_dispatch
# only lists workflows present on the default branch. A previous probe failed
# entirely because the file existed only on a feature branch.
name: Admit PR to review

on:
  # AUTOMATIC ADMISSION on the high-risk paths.
  #
  # `.github/high-risk-paths.txt` is the policy; this trigger is one half of its
  # enforcement and deliberately the weaker half. A label can be removed, and a
  # `paths:` filter only fires on files the event reports — so the publisher
  # re-derives the match from the default branch and holds the gate red
  # independently. If these two ever disagree, the publisher wins.
  #
  # The globs are duplicated here because `paths:` cannot read a file. Keep them
  # in step with high-risk-paths.txt; drift makes admission miss, not the gate.
  # `pull_request_target`, NOT `pull_request`, and the distinction is load-bearing.
  #
  # A fork-origin `pull_request` run gets a READ-ONLY `GITHUB_TOKEN`, so
  # `gh pr edit --add-label` fails — meaning fork PRs on high-risk paths would
  # never be admitted, and the one class of contribution most deserving an
  # independent review would silently not get one. `pull_request_target` runs in
  # the base repository's context with a writable token.
  #
  # That trigger is dangerous when a workflow executes PR content. This one never
  # does: it checks out the BASE ref only, to read the path list and the matcher,
  # and never builds or runs anything from the head. Keep it that way.
  #
  # NO `paths:` FILTER. An earlier version duplicated the globs here, because
  # `paths:` cannot read a file — which meant two lists that had to be kept in
  # step by hand, and a `paths:` filter matches only what the event reports, so a
  # rename out of a listed path would not fire it. Instead this runs on every PR
  # update and asks the SAME matcher the publisher uses, over the same list. One
  # definition, one behaviour, and drift becomes impossible rather than merely
  # discouraged.
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

  workflow_dispatch:
    inputs:
      pr:
        description: PR number to admit
        required: true
      label:
        description: Label to apply
        required: true
        default: review-ready

permissions:
  pull-requests: write

jobs:
  admit:
    runs-on: ubuntu-latest
    steps:
      # BASE ref only — never the PR head. This is what makes `pull_request_target`
      # safe here: the checkout brings in the repository's own path list and
      # matcher, not anything the contributor wrote.
      - name: Check out the base ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Admit the PR if it touches a high-risk path
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ inputs.pr || github.event.pull_request.number }}
          LABEL: ${{ inputs.label || 'review-ready' }}
          MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          set -uo pipefail

          # A manual dispatch is an explicit operator decision and skips the path
          # test entirely — that is the valve for admitting something the list
          # does not cover.
          if [ "$MANUAL" != "true" ]; then
            # BOTH SIDES OF A RENAME, for the same reason the publisher does it:
            # a file renamed OUT of a high-risk path must still count.
            #
            # `@base64` because a git path may contain a line feed, which as raw
            # text would split one path into two fragments that match nothing.
            # The publisher encodes identically; the matcher decodes.
            files=$(gh api --paginate "repos/$REPO/pulls/$PR/files?per_page=100" \
                      --jq '.[] | (.filename, (.previous_filename // empty)) | @base64' 2>/dev/null)
            count=$(printf '%s\n' "$files" | grep -c . )
            if [ -z "$files" ]; then
              echo "::warning::Could not enumerate files for #$PR — admitting rather than guessing."
            elif [ "$count" -ge 3000 ]; then
              # The files endpoint caps at 3000 entries and `--paginate` stops
              # there, so the list is truncated and a high-risk file could sit in
              # the tail. Same rule the publisher applies: unknowable is high risk.
              echo "::warning::#$PR has $count changed files — at the API cap, so the list cannot be trusted; admitting."
            else
              if printf '%s\n' "$files" \
                   | python3 .github/scripts/high-risk-match.py .github/high-risk-paths.txt; then
                echo "#$PR touches no high-risk path — not admitting."
                exit 0
              fi
            fi
          fi

          # Idempotent: `synchronize` fires on every push to a matched PR, and
          # re-adding a label it already carries is a no-op that still emits a
          # webhook. Checking first keeps the timeline readable.
          if gh pr view "$PR" --repo "$REPO" --json labels \
               --jq '.labels[].name' | grep -qx "$LABEL"; then
            echo "#$PR already carries '$LABEL' — nothing to do."
            exit 0
          fi

          gh pr edit "$PR" --repo "$REPO" --add-label "$LABEL"
          echo "Applied '$LABEL' to #$PR using GITHUB_TOKEN."
          echo
          echo "If CodeRabbit does not start a review within ~5 minutes, check"
          echo "first whether #$PR is bot-AUTHORED — those are skipped by"
          echo "platform default and admission on them is a no-op by design."
