name: Playwright E2E (phone and tablet)

# The @responsive journeys on Pixel 7 and iPad sizes. Nightly and by hand, never
# on a PR: no required check depends on it.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-responsive-${{ github.ref }}
  cancel-in-progress: true

jobs:
  responsive:
    name: Playwright E2E (Pixel 7, iPad)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build monorepo packages
        run: pnpm build

      # The runner image already carries Chromium's libraries; `--with-deps` only adds fonts and
      # xvfb, and twice in one day the apt mirror served them at 20-80 kB/s (#885). No test compares
      # pixels, so apt runs only when the browser cannot launch.
      - name: Install Playwright Chromium Browser
        working-directory: packages/frontend
        run: |
          pnpm exec playwright install chromium
          if ! node -e "require('@playwright/test').chromium.launch().then((b) => b.close())"; then
            pnpm exec playwright install-deps chromium
          fi

      - name: Run the @responsive journeys
        run: pnpm --filter @prismalens/frontend test:e2e --project="Pixel 7" --project="iPad (gen 7)"

      - name: Upload Playwright Report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-responsive
          path: packages/frontend/playwright-report/
          retention-days: 7
