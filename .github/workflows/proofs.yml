# The proofs a PR does not run on every push: the release side checks on Linux, macOS and Windows, the
# systemd service, the npm upgrade chain, macOS unit tests, the sim's Playwright proof specs and the five
# agent qualification legs.
# `ci.yml` calls this when its plan says `full` or `agents` (a release PR, a path these read; #1052);
# `nightly.yml` calls it every night with both on. Each job packs or builds its own inputs, so a nightly
# needs nothing from another run.
name: Proofs

on:
  workflow_call:
    inputs:
      ref:
        description: Branch, tag or SHA to prove (default is the caller's own)
        required: false
        type: string
        default: ""
      full:
        description: Run the tarball, macOS and release-side proofs
        required: false
        type: boolean
        default: true
      agents:
        description: Run the agent qualification legs
        required: false
        type: boolean
        default: true
      code:
        description: Run the macOS unit tests and the sim's proof specs, which a code change needs on its PR (#1085)
        required: false
        type: boolean
        default: true

permissions:
  contents: read

env:
  TURBO_CACHE_DIR: ${{ github.workspace }}/.turbo-cache

jobs:
  pack:
    name: Pack the tarball for the proofs
    if: inputs.full || inputs.code
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Pack tarball
        run: |
          mkdir -p /tmp/tarballs
          node scripts/pack-cli.mjs --out /tmp/tarballs
          ls -l /tmp/tarballs

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: proofs-tarballs
          path: /tmp/tarballs/*.tgz
          retention-days: 3

  # macOS runs the unit tests on a code PR too: 5 of 11 timing failures in a month showed only here (#1085).
  # macos-latest is 3 or 5 CPUs, so turbo runs two tasks at a time (#885).
  macos-tests:
    name: Unit tests (macos-latest)
    if: inputs.full || inputs.code
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm turbo run test --concurrency=2

  packed-service:
    # `pl service` on a real systemd user manager (#732), installed through the npm launcher with
    # this runner's archives in a local mirror (#717): ExecStart, systemd-analyze, a channel switch
    # across restarts, and one SIGTERM per stop (scripts/lib/service-proof.mjs).
    # Blocking on a release PR: `ci.yml`'s `CI gate` waits on the `proofs` job that calls this (#920).
    name: "Tarball: pl service under systemd"
    needs: pack
    if: inputs.full
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: proofs-tarballs
          path: tarballs

      - name: Install, verify, switch channel, stop and uninstall the service
        run: |
          set -eu
          # A runner has no login session; lingering gives this user a systemd manager.
          sudo loginctl enable-linger "$(id -un)"
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          for _ in $(seq 1 20); do systemctl --user show-environment >/dev/null 2>&1 && break; sleep 1; done
          node scripts/lib/service-proof.mjs tarballs

  gate-side-checks:
    # The release gate's side checks (#673), scripted: telemetry, update notice, lock,
    # reset, hosts, `pl upgrade` and, on Linux, its rollback under systemd, each in a
    # throwaway HOME on the packed tarball (package script `gate:side-checks`). The same
    # script runs on all three OSes and `--no-skip` makes a SKIP a failure (#920).
    #
    # Blocking on a release PR: `ci.yml`'s `CI gate` waits on the `proofs` job that calls this (#920).
    name: "Tarball: release side checks (${{ matrix.os }})"
    needs: pack
    if: inputs.full
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # The script needs only the root package's own dependencies (a pseudo-terminal, cross-spawn).
      - name: Install the script's dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts --filter prismalens-monorepo

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: proofs-tarballs
          path: tarballs

      - name: Give the runner user a systemd manager (Linux)
        if: runner.os == 'Linux'
        run: |
          set -eu
          sudo loginctl enable-linger "$(id -un)"
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          for _ in $(seq 1 20); do systemctl --user show-environment >/dev/null 2>&1 && break; sleep 1; done

      - name: Run the side checks
        run: |
          set -eu
          if [ "$RUNNER_OS" = "Linux" ]; then export XDG_RUNTIME_DIR="/run/user/$(id -u)"; fi
          node scripts/gate-side-checks.mjs --no-skip --tarball "$(ls tarballs/prismalens-[0-9]*.tgz | head -1)"

  agent-legs:
    name: Agents with a pin
    if: inputs.agents
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      legs: ${{ steps.legs.outputs.legs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - id: legs
        run: |
          legs=$(node scripts/agent-bump.mjs legs)
          echo "legs=$legs" >> "$GITHUB_OUTPUT"

  harness-admission:
    # The pinned agent against aimock, so a red run is the code's and not a model's (#884, #914).
    # One leg per pin.json, whose `tier` 2 leaves the job green on a red leg (`continue-on-error`).
    name: Agent qualification (${{ matrix.harness }}, scripted model)
    needs: agent-legs
    if: inputs.agents
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: ${{ matrix.tier == 2 }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.agent-legs.outputs.legs) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the packages the engine imports
        run: pnpm --filter "@prismalens/contracts..." --filter "@prismalens/integrations..." --filter "@prismalens/engine..." build

      - name: Setup uv
        if: matrix.harness == 'deepagents'
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0

      - name: Install the pinned agent
        env:
          PIN: ${{ matrix.pin }}
          BINARY: ${{ matrix.binary }}
        run: |
          # The pin installs from its committed lock, the same bytes everywhere (#1154); deepagents-code needs Python 3.14, which uv fetches.
          bin=$(node scripts/agent-locks.mjs install "$PIN")
          echo "$bin" >> "$GITHUB_PATH"
          PATH="$bin:$PATH" "$BINARY" --version

      # Codex's bwrap sandbox needs unprivileged user namespaces, which ubuntu-24.04 restricts.
      - name: Allow Codex's sandbox
        if: matrix.harness == 'codex'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Run the admission (R1-R11) and the behaviour matrix against aimock, 3 times
        run: |
          set -o pipefail
          node scripts/admission-fake.mjs "${{ matrix.harness }}" "$GITHUB_WORKSPACE" --repeat 3 | tee admission.log

      # Tool search (#848): the run above uses each agent's shipped setting; a PR labelled
      # `tool-search` also runs the other mode, so both costs and pass rates show.
      - name: The behaviour matrix with tool search in the other mode
        if: contains(github.event.pull_request.labels.*.name, 'tool-search')
        continue-on-error: true
        run: |
          shipped=$(grep -E "^SEARCH (on|off)$" admission.log | head -1 | cut -d' ' -f2)
          export PL_TOOL_SEARCH=$([ "$shipped" = on ] && echo off || echo on)
          set -o pipefail
          node scripts/admission-fake.mjs "${{ matrix.harness }}" "$GITHUB_WORKSPACE" --only matrix --repeat 3 | tee search-on.log

      - name: PrismaLens tool cost and pass rate
        if: always()
        run: |
          {
            echo "### ${{ matrix.harness }}: PrismaLens tools"
            echo '```'
            grep -hE "^(TOOLCOST|PASSRATE)" admission.log search-on.log 2>/dev/null || echo "no matrix run"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # The negative run (#848): with no gateway the model calls no PrismaLens tool, so R8 must fail the gate.
      - name: Without the gateway, the admission must fail
        if: matrix.harness == 'opencode'
        env:
          ADMISSION_NO_GATEWAY: "1"
        run: |
          if node scripts/admission-fake.mjs opencode "$GITHUB_WORKSPACE" --only admission; then
            echo "::error::the admission passed with no PrismaLens gateway; R8 is not gating"
            exit 1
          fi

  # Every release already on npm upgrades through `pl upgrade` to this build's launcher, then switches
  # to a nightly and back (#920, #717). The versions come from `npm view prismalens versions`, never a list.
  upgrade-chain:
    name: "Tarball: every published release upgrades to it"
    needs: pack
    if: inputs.full
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # The chain script needs only the root package's own dependencies (cross-spawn, semver).
      - name: Install the script's dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts --filter prismalens-monorepo

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: proofs-tarballs
          path: tarballs

      - name: Upgrade each published release to this tarball with pl upgrade
        run: node scripts/packed-upgrade-chain.mjs tarballs

  # The PR proof specs in packages/frontend/e2e/sim (#1176), against a sim booted from this run's
  # tarball with the fake code host. They read the sim at import, so the default projects skip them.
  sim-specs:
    name: "Tarball: the sim's Playwright proof specs"
    needs: pack
    if: inputs.full || inputs.code
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore the turbo cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo-cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      # The specs' pairing and fixture commands run from source against the built packages.
      - name: Build monorepo packages
        run: pnpm build

      # `pair` runs on Playwright's Chromium, the specs on Edge, which the runner image carries.
      - name: Install the browsers
        working-directory: packages/frontend
        run: |
          pnpm exec playwright install chromium
          if ! node -e "require('@playwright/test').chromium.launch({ channel: 'msedge' }).then((b) => b.close())"; then
            pnpm exec playwright install msedge
          fi

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: proofs-tarballs
          path: tarballs

      - name: Bring up the sim on the packed tarball
        env:
          PRISMALENS_CONDITIONS: fake-code-host
        run: |
          PRISMALENS_TARBALL="$(ls "$GITHUB_WORKSPACE"/tarballs/prismalens-[0-9]*.tgz | head -1)" pnpm sim up --profile bare

      - name: Run the sim specs
        working-directory: packages/frontend
        run: pnpm exec playwright test -c playwright.sim.config.ts

      - name: Take the sim down
        if: always()
        run: pnpm sim down

      - name: Upload the specs' results and the sim's logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sim-specs-results
          path: |
            packages/frontend/test-results/
            .sim/logs/
          include-hidden-files: true
          retention-days: 7
