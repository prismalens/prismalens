# Per-repo review lane config. Read by the callee from the BASE ref of a pull request,
# never from the head, so a PR cannot rewrite the policy it is judged by.
# Story: prismalens/gh-workflows#33.
version: 1
review:
  # CodeRabbit reviews every PR; this lane stays off until the operator turns it back on.
  admission: off
  auto_pause_rounds: 3
  path_filters:
    - "packages/@prismalens/database/**"
    - ".github/workflows/**"
    # Playwright specs and their committed screenshots: the suite is the review.
    - "packages/frontend/e2e/**"
