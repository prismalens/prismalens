version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    # pnpm 11 verifies the lockfile against a supply-chain minimum-release-age
    # policy, so a bump proposed the moment a version lands cannot install
    # (ERR_PNPM_MINIMUM_RELEASE_AGE_VIOLATION) and the PR sits red until the
    # package ages out. Cooldown holds the PR back until the version is old
    # enough to pass, which removes the red-PR churn without delaying anything
    # that could have merged sooner anyway.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore
      include: scope
    groups:
      # Group only low-risk minor/patch bumps so they can be reviewed and merged
      # in bulk. Majors are deliberately excluded here, so Dependabot opens them
      # individually — one reviewable PR per potentially-breaking change instead
      # of a single grouped PR that hides majors among dozens of safe bumps.
      dev-minor-patch:
        dependency-type: development
        update-types:
          - minor
          - patch
      prod-minor-patch:
        dependency-type: production
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
    groups:
      # Without update-types the wildcard also groups MAJOR Action bumps, which
      # would park a breaking update inside the group PR and — since the group's
      # reported update-type is the highest change in it — block the whole group
      # from auto-merging. Majors open individually instead, as with npm.
      github-actions:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
