version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore
      include: scope
    ignore:
      # Pinned by agent-release-watch (#914) to the SDK the claude adapter declares;
      # a lone bump fails the bundle check (#913).
      - dependency-name: "@anthropic-ai/claude-agent-sdk"
      # The adapters move only with the rolling pin-bump PR, which probes them first (#914).
      - dependency-name: "@agentclientprotocol/claude-agent-acp"
      - dependency-name: "@agentclientprotocol/codex-acp"
      # 1.6 inlines +3.8 MB into the diff worker and busts the prismalens tarball
      # budget (scripts/artifact-budgets.json); move it with a budget re-base.
      - dependency-name: "@pierre/diffs"
    groups:
      # One Nest major moves every @nestjs/* package at once; split bumps can
      # never pass (@nestjs/common 12 against @nestjs/core 11). Listed first
      # because the first matching group wins.
      nestjs-major:
        patterns:
          - "@nestjs/*"
        update-types:
          - major
      # Group only low-risk minor/patch bumps so they can be reviewed and merged
      # in bulk. Majors are deliberately excluded here, so Dependabot opens them
      # individually — one reviewable PR per potentially-breaking change instead
      # of a single grouped PR that hides majors among dozens of safe bumps.
      dev-minor-patch:
        dependency-type: development
        update-types:
          - minor
          - patch
      prod-minor-patch:
        dependency-type: production
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
    groups:
      # Without update-types the wildcard also groups MAJOR Action bumps, which
      # would park a breaking update inside the group PR and — since the group's
      # reported update-type is the highest change in it — block the whole group
      # from auto-merging. Majors open individually instead, as with npm.
      github-actions:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
