packages:
  - packages/*
  - packages/@prismalens/*

catalog:
  '@nestjs/common': ^12.1.3
  '@nestjs/core': ^12.1.3
  '@orpc/client': ^1.15.7
  '@orpc/contract': ^1.15.7
  '@orpc/openapi-client': ^1.15.7
  '@types/node': ^26.6.5
  dotenv: ^18.0.8
  eslint: ^10.13.0
  rxjs: ^7.8.2
  tsx: ^4.23.15
  typescript: ^5.9.3
  vitest: ^5.0.5
  zod: ^4.6.7

onlyBuiltDependencies:
  - '@nestjs/core'
  - electron
  - '@prisma/engines'
  - esbuild
  - msgpackr-extract
  - prisma

# better-sqlite3 13 loads a prebuild from its own tarball; its binding.gyp is a source fallback only.
ignoredBuiltDependencies:
  - better-sqlite3

# The shipped ACP adapters run the user's own claude / codex; their native copies are never used (#818).
ignoredOptionalDependencies:
  - '@anthropic-ai/claude-agent-sdk-*'
  - '@openai/codex-*'
