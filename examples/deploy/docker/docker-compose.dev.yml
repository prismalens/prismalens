# PrismaLens Docker Compose - Development
# Usage: docker compose -f docker-compose.dev.yml up
# Access: http://localhost:5367
#
# Note: For active development, prefer running services separately:
#   Terminal 1: pnpm dev:api (http://localhost:3001)
#   Terminal 2: pnpm dev:frontend (http://localhost:3000)
# There is no broker to start and no separate worker process — the API runs the
# dispatch loop and forks one child per investigation.

services:
  # Caddy reverse proxy - unified entry point on port 5367
  caddy:
    image: caddy:2-alpine
    ports:
      - "5367:5367"
    volumes:
      - ./docker/caddy/Caddyfile.local:/etc/caddy/Caddyfile:ro
    depends_on:
      - frontend
      - api
    networks:
      - prismalens

  # TanStack Start frontend (development mode)
  frontend:
    build:
      context: .
      dockerfile: docker/images/frontend/Dockerfile
      target: dev
    expose:
      - "3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
    volumes:
      - ./packages/frontend/src:/app/packages/frontend/src:ro
      - ./packages/frontend/public:/app/packages/frontend/public:ro
    networks:
      - prismalens

  # NestJS API backend (development mode)
  # Single replica only: The API runs as a single instance due to the in-process EventBus.
  api:
    build:
      context: .
      dockerfile: docker/images/api/Dockerfile
      target: dev
    expose:
      - "3001"
    environment:
      - NODE_ENV=development
      - PRISMALENS_PORT=3001
      - PRISMALENS_HOST=0.0.0.0
      # Hostnames this container may be reached by. Caddy forwards the browser's
      # original Host (localhost here); the other containers reach it as `api`.
      # Anything else is rejected — see packages/api/README.md.
      - PRISMALENS_ALLOWED_HOSTS=localhost,api
      - PRISMALENS_INTERNAL_SECRET=${PRISMALENS_INTERNAL_SECRET}
      - DATABASE_URL=${DATABASE_URL:-file:./prismalens.db}
    volumes:
      - ./packages/api/src:/app/packages/api/src:ro
    networks:
      - prismalens

  # No worker service and no broker: the API process runs the dispatch loop and
  # forks ONE short-lived child per investigation.

networks:
  prismalens:
    driver: bridge
